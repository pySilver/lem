{#- The home page (docs/index.md names it): the logo's scene from edge to edge over the page, in
    its day or its night file by the visitor's theme, then the page's own Markdown. -#}
{% extends "main.html" %}

{% block hero %}
  <div class="lem-scene">
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="{{ 'assets/lem-night.svg' | url }}">
      <img src="{{ 'assets/lem.svg' | url }}" alt="Lem's logo: a tall hooded figure with a red eye holds a long line over a field. Four small figures and the word Lem hang from it. A small glow goes from the tall figure's hands down to the four small figures and lights their red eyes." width="1600" height="640">
    </picture>
  </div>
{% endblock %}

{% block content %}
  <div class="lem-home">{{ super() }}</div>
{% endblock %}
