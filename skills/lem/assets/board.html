<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lem board</title>
<link rel="stylesheet" href="lem.css">
<style>
  /* a little tighter than a page to read, so that the lanes start in the upper third of a window */
  .page { gap: 12px; padding-top: 16px; }
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; border: 1px solid var(--line); background: var(--card); color: var(--ink); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.live i { animation: ping 2s ease-out infinite; }
  .pill span { color: var(--fg); }
  .jump {
    appearance: none; font-size: 12px; font-weight: 600; color: var(--fg); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 8px;
    background: color-mix(in srgb, var(--fg) 7%, transparent); border: 1px solid var(--line-strong);
  }
  .jump:hover { background: color-mix(in srgb, var(--fg) 13%, transparent); }
  .jump .ic { width: 13px; height: 13px; }
  .jump.back .ic { transform: rotate(180deg); }

  .banner { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 12px; border: 1px solid; font-weight: 550; }
  .banner .ic { width: 16px; height: 16px; }
  .banner.attention { color: color-mix(in srgb, var(--you) 58%, var(--fg)); border-color: color-mix(in srgb, var(--you) 60%, transparent); background: color-mix(in srgb, var(--you) 14%, transparent); }
  .banner.problem { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); border-color: color-mix(in srgb, var(--bad) 65%, transparent); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .banner span { color: var(--fg); flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .banner .sub { color: var(--dim); font-weight: 400; }
  .banner.demo { padding-block: 6px; color: var(--fg); border-style: dashed; border-color: var(--line-strong); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--fg) 7%, transparent) 0 12px, transparent 12px 24px); }
  .banners { display: flex; flex-direction: column; gap: 8px; }
  .banners:empty { display: none; }
  /* past three banners the rest fold under one line that counts them */
  .banner-fold { display: flex; flex-direction: column; gap: 8px; }
  .fold-toggle {
    appearance: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 12px; text-align: left;
    font: inherit; font-weight: 550; color: var(--fg); background: transparent; border: 1px dashed color-mix(in srgb, var(--you) 60%, transparent);
  }
  .fold-toggle:hover { background: color-mix(in srgb, var(--you) 8%, transparent); }
  .fold-toggle .ic { width: 16px; height: 16px; color: color-mix(in srgb, var(--you) 58%, var(--fg)); }
  .fold-toggle b { color: color-mix(in srgb, var(--you) 58%, var(--fg)); }
  .fold-rest { display: flex; flex-direction: column; gap: 8px; }
  .fold-rest[hidden] { display: none; }

  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 12px; }
  h2 { margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }

  .hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  /* the board of all tasks has only the activity here: it takes the whole width */
  .cols.one, .hero.one { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 1080px) { .hero, .cols { grid-template-columns: minmax(0, 1fr); } }

  /* now */
  .now { overflow: hidden; border-color: color-mix(in srgb, var(--actor) 38%, var(--line)); display: flex; flex-direction: column; }
  .now > div { flex: 1; display: flex; flex-direction: column; }
  .now::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 160% at 0% 0%, color-mix(in srgb, var(--actor) 15%, transparent), transparent 58%);
  }
  .now.a-you, .now.a-bad { background: color-mix(in srgb, var(--actor) 7%, var(--card)); }
  .now-in { position: relative; display: flex; gap: 18px; align-items: flex-start; }
  .avatar {
    width: 58px; height: 58px; border-radius: 17px; flex: none; display: grid; place-items: center;
    color: var(--ink); background: color-mix(in srgb, var(--actor) 20%, transparent);
    border: 1px solid color-mix(in srgb, var(--actor) 48%, transparent);
    animation: halo 2s ease-out infinite;
  }
  .avatar .ic { width: 27px; height: 27px; }
  .still .avatar { animation: none; }
  .now-body { min-width: 0; flex: 1; }
  .now-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink); }
  .now-head { font-size: 19px; line-height: 1.3; font-weight: 680; margin-top: 2px; overflow-wrap: anywhere; }
  .now-status { margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .now-ctx { margin-top: 3px; color: var(--dim); overflow-wrap: anywhere; }
  .timer-row { display: flex; align-items: baseline; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .timer { font: 680 42px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .a-you .timer, .a-bad .timer { color: var(--ink); }
  .note { font-size: 12px; color: var(--dim); }
  .now-next { position: relative; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  .now-next .lbl { font-size: 10.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .now-next .right { margin-left: auto; }
  .now-spacer { height: 16px; }
  /* a task that ended: its large card is as tall as what it says, and the card beside it is the row's height */
  .hero.closed { align-items: start; }
  .hero.closed .now-spacer { height: 12px; }
  /* the board of all tasks: the large card is one band, its count-down and its button at the right */
  .now.brief { padding: 8px 16px; }
  .now.brief .now-in { align-items: center; }
  .now.brief .avatar { width: 44px; height: 44px; border-radius: 13px; }
  .now.brief .avatar .ic { width: 21px; height: 21px; }
  .now.brief .now-head { font-size: 17px; }
  .now-what { font-weight: 600; color: var(--ink); }
  .now-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; }
  .now.brief .timer-row { margin-top: 0; gap: 10px; justify-content: flex-end; }
  .now.brief .timer { font-size: 30px; }
  @media (max-width: 760px) { .now.brief .now-in { flex-wrap: wrap; } .now-side { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; } }

  /* progress */
  .prog { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 20px; align-items: center; }
  .ring-wrap { position: relative; width: 116px; height: 116px; }
  .ring { display: block; }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .done { stroke: var(--ok); }
  .ring .cur { stroke: var(--lead); animation: breathe 2s ease-in-out infinite; }
  .ring .todo { stroke: color-mix(in srgb, var(--fg) 12%, transparent); }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-center b { font: 700 25px/1 var(--mono); letter-spacing: -.03em; }
  .ring-center span { font-size: 10.5px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
  .phases { display: flex; align-items: flex-start; }
  /* Each phase is as wide as its words and shares the rest, and its right padding keeps two labels
     apart: in equal columns at 1300 px "task 2 of 2" and "2 green" stood 3 px apart, and "Proposed"
     ran into "Landed". */
  .phase { flex: 1 1 auto; min-width: 0; position: relative; padding: 20px 10px 0 0; font-size: 11.5px; color: var(--faint); }
  .phase::before { content: ""; position: absolute; top: 6px; left: 14px; right: 0; height: 2px; background: var(--line); }
  .phase:last-child { flex: 0 0 auto; }
  .phase:last-child::before { display: none; }
  .phase i { position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--card); }
  .phase.past { color: var(--dim); } .phase.past::before { background: color-mix(in srgb, var(--ok) 60%, transparent); }
  .phase.past i { background: var(--ok); border-color: var(--ok); }
  .phase.cur { color: var(--fg); font-weight: 600; }
  .phase.cur i { border-color: var(--actor); background: color-mix(in srgb, var(--actor) 35%, var(--card)); animation: halo 2s ease-out infinite; }
  .phase small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
  .stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .stat { min-width: 0; }
  .stat .sk { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 650; }
  .stat .sv { font: 650 16px/1.3 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 1px; }
  .stat .ss { font-size: 11px; line-height: 1.35; color: var(--dim); }
  .stat.ok .sv { color: color-mix(in srgb, var(--ok) 58%, var(--fg)); } .stat.you .sv { color: color-mix(in srgb, var(--you) 58%, var(--fg)); } .stat.bad .sv { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); }

  /* timeline */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; background: var(--actor); }
  .legend i.s-queued { background: color-mix(in srgb, var(--quiet) 45%, transparent); }
  .legend i.s-ready { background: color-mix(in srgb, var(--gate) 45%, transparent); }
  .tl-svg { display: block; overflow: visible; }
  .tl-svg .lane-label { font: 550 11.5px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; fill: var(--dim); }
  .tl-svg .track { fill: color-mix(in srgb, var(--fg) 4%, transparent); }
  .tl-svg .grid { stroke: var(--line); stroke-dasharray: 2 4; }
  .tl-svg .axis { font: 10.5px var(--mono); fill: var(--dim); }
  .tl-svg .seg { fill: var(--actor); }
  .tl-svg .seg.s-queued { fill: color-mix(in srgb, var(--quiet) 45%, transparent); }
  .tl-svg .seg.s-ready { fill: color-mix(in srgb, var(--gate) 45%, transparent); }
  .tl-svg .seg.live { animation: breathe 2s ease-in-out infinite; }
  .tl-svg .end { fill: var(--actor); stroke: var(--card); stroke-width: 1.5; }
  .tl-svg .nowline { stroke: var(--line-strong); stroke-width: 1.5; }
  .tl-svg a { cursor: pointer; }
  .tl-empty, .empty { padding: 22px 0; text-align: center; color: var(--faint); }
  /* where the time of one task went: a row for each actor, a band for each stage behind them */
  #tl-wrap { position: relative; }
  .legend .whole { color: var(--fg); font-family: var(--mono); font-size: 11.5px; }
  .legend em { font-style: normal; font-family: var(--mono); color: var(--fg); font-size: 11.5px; }
  .tl-svg .band { fill: transparent; }
  .tl-svg .band.odd { fill: color-mix(in srgb, var(--fg) 3.5%, transparent); }
  .tl-svg .band.hot { fill: color-mix(in srgb, var(--actor) 12%, transparent); stroke: color-mix(in srgb, var(--actor) 50%, transparent); stroke-width: 1; }
  .tl-svg .band-label { font: 600 10.5px var(--mono); fill: var(--dim); pointer-events: none; }
  .tl-svg .mark { stroke: var(--card); stroke-width: 1.5; }
  .tl-svg [data-head] { cursor: default; }
  .tl-note { margin-top: 10px; font-size: 11.5px; color: var(--faint); max-width: 120ch; }
  .tl-note:empty { display: none; }
  .tip {
    position: absolute; z-index: 5; pointer-events: none; width: max-content; max-width: 340px;
    padding: 8px 11px; border-radius: 10px; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere;
    background: color-mix(in srgb, var(--fg) 10%, var(--bg)); border: 1px solid var(--line-strong);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .3);
  }
  .tip .tt { display: flex; align-items: center; gap: 7px; font-weight: 650; }
  .tip .tt i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tip .ts { color: var(--dim); }
  .tip .td { color: var(--dim); font-family: var(--mono); font-size: 11.5px; }

  /* the board's columns */
  .lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1180px) { .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .lanes { grid-template-columns: minmax(0, 1fr); } }
  .lane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lane-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
  .lane-head i { width: 8px; height: 8px; border-radius: 3px; background: var(--actor); }
  .lane-head em { margin-left: auto; font: 600 11.5px var(--mono); font-style: normal; letter-spacing: 0; color: var(--fg); }
  .lane-empty { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 18px 14px; text-align: center; color: var(--faint); font-size: 12px; }
  .tcard {
    appearance: none; text-align: left; cursor: pointer; width: 100%; display: flex; flex-direction: column; gap: 8px;
    background: var(--card); border: 1px solid color-mix(in srgb, var(--actor) 30%, var(--line)); border-radius: 14px; padding: 13px 14px 12px;
    position: relative; overflow: hidden;
  }
  .tcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--actor); }
  .tcard:hover { background: var(--card-hi); }
  .tcard.s-queued, .tcard.s-dropped { border-style: dashed; }
  .tcard.s-queued::before, .tcard.s-dropped::before { background: transparent; }
  .tcard.s-dropped .tc-title { color: var(--faint); text-decoration: line-through; }
  .tc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tc-title { font-weight: 640; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; min-width: 0; }
  .tc-time { flex: none; font: 12px var(--mono); color: var(--dim); white-space: nowrap; padding-top: 1px; }
  .tc-ask { color: var(--dim); font-size: 12px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-text { font-size: 12.5px; line-height: 1.4; color: var(--ink); font-weight: 560; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tc-row:empty { display: none; }
  .tc-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    --c: var(--quiet);
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 11.5px; max-width: 100%;
    background: color-mix(in srgb, var(--c) 11%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag .ic { width: 12px; height: 12px; color: color-mix(in srgb, var(--c) 58%, var(--fg)); }
  .tag.c-lead { --c: var(--lead); } .tag.c-ok { --c: var(--ok); } .tag.c-bad { --c: var(--bad); } .tag.c-gate { --c: var(--gate); } .tag.c-you { --c: var(--you); } .tag.c-lem { --c: var(--lem); }
  .tag.live {
    border-color: var(--c);
    background-image: linear-gradient(45deg,
      color-mix(in srgb, var(--c) 24%, transparent) 25%, color-mix(in srgb, var(--c) 9%, transparent) 25%,
      color-mix(in srgb, var(--c) 9%, transparent) 50%, color-mix(in srgb, var(--c) 24%, transparent) 50%,
      color-mix(in srgb, var(--c) 24%, transparent) 75%, color-mix(in srgb, var(--c) 9%, transparent) 75%);
    background-size: 20px 20px;
    animation: stripes 1s linear infinite;
  }
  .tag span { overflow: hidden; text-overflow: ellipsis; }
  .mini { position: relative; height: 5px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .mini span { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ok); border-radius: 3px; }
  .mini span.cur { background: var(--lead); animation: breathe 2s ease-in-out infinite; }
  .more { padding: 0 4px; font-size: 12px; color: var(--faint); }

  /* lists: state blocks, gate commands, reviews, activity */
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 6px 0; position: relative; }
  .row + .row { border-top: 1px solid var(--line); }
  .fi { position: relative; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: var(--ink); background: color-mix(in srgb, var(--actor) 18%, var(--card)); border: 1px solid color-mix(in srgb, var(--actor) 32%, transparent); }
  .fi .ic { width: 12px; height: 12px; }
  .rtext { font-size: 12.5px; line-height: 1.4; padding-top: 3px; min-width: 0; overflow-wrap: anywhere; }
  .rtext b { color: var(--ink); }
  .rtext .sub { display: block; color: var(--dim); }
  .rtext .cmd { font-family: var(--mono); font-size: 11.5px; }
  .rtime { font: 11px var(--mono); color: var(--dim); white-space: nowrap; padding-top: 5px; text-align: right; }
  .rlink { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; text-align: left; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px; }
  .feed { max-height: 460px; overflow: auto; margin: 0 -10px; padding: 0 10px; }

  .foot { display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); }
  .foot .error { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); font-weight: 600; }

  /* the two tabs, and the backlog */
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding: 0 2px; }
  .tab {
    appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; padding: 2px 12px 7px; font-size: 13px; font-weight: 600; color: var(--dim);
  }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--you); }
  .tab em { font: 600 11.5px var(--mono); font-style: normal; color: var(--dim); }
  kbd { font: 600 10.5px var(--mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--dim); background: var(--card); }
  .backlog { display: flex; flex-direction: column; gap: 14px; }
  .bl-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .bl-bar input {
    flex: 1 1 260px; min-width: 0; font: inherit; color: var(--fg); padding: 7px 11px; border-radius: 9px;
    background: var(--card); border: 1px solid var(--line-strong);
  }
  .bl-bar input:focus-visible { outline: 2px solid var(--gate); outline-offset: 1px; }
  .bl-group { display: flex; flex-direction: column; gap: 8px; }
  .bl-group.recessive .bl-item { border-style: dashed; }
  .bl-group.recessive .bl-title { color: var(--dim); }
  .bl-item { background: var(--card); border: 1px solid color-mix(in srgb, var(--actor) 26%, var(--line)); border-radius: 12px; overflow: hidden; }
  .bl-item.cur { box-shadow: 0 0 0 2px color-mix(in srgb, var(--gate) 70%, transparent); }
  .bl-head { appearance: none; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 14px; }
  .bl-head:hover { background: var(--card-hi); }
  .bl-title { font-weight: 640; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .bl-where { grid-column: 1; font: 12px var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .bl-where.stale { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); display: flex; align-items: center; gap: 6px; }
  .bl-side { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 5px; max-width: 46ch; }
  .bl-body { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
  .bl-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55; max-width: 96ch; }
  .bl-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 12.5px; }
  .bl-actions code { font: 12px var(--mono); padding: 2px 7px; border-radius: 6px; background: var(--card-hi); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .bl-actions .go { border-color: color-mix(in srgb, var(--you) 60%, transparent); background: color-mix(in srgb, var(--you) 14%, transparent); }
  .bl-note { color: var(--dim); }
  .bl-note.bad { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); }
</style>
</head>
<body>
<main class="page" id="page">

<script type="module">
// The board of one repository's tasks, and the board of one task. It draws two files that sit
// beside it in the state folder: events.js (project.py: every state block, gate result, review
// and proposal, and what stories.py, decisions.py and land.py log through it) and meta.js
// (board.py: the repository, the base branch, Lem's session). A copy named task-SLUG.html opens
// on that task; any other name opens on all tasks.
//
// A decision of the build is the events with its `id` (decisions.py): `decision.taken` or
// `decision.asked` opens it, and `decision.advised` (one expert's advice), `decision.answered`,
// `decision.settled` (the experts' shared pick, taken while the owner is away), `decision.timeout`
// (the experts' shared pick or the recommended option, by its `by`) and `decision.late` are joined
// to it by that number. A choice whose wait ended with no timeout written still waits in the
// record, and the board says that its wait is over and what its timeout will take.
//
// "Where the time went" on the board of one task draws only what an event shows: a state block
// starts a span and the next one ends it, a stage whose start is logged (the interview, the scout,
// the personas' read, the investigation, a builder, the polish pass, the checks, the review: SKILL.md)
// runs from its start to the event that ends it, a choice runs from its question to its outcome, the
// stories wait for the owner from the personas' read to his approval, and a plan talk runs from its
// start to its record. A log written before the stages logged their starts draws what logged only
// its end (the personas' read, a plan talk) as a mark where it ended.
//
// The board of all tasks has a second tab, the backlog, from backlog.js (board.py: the items of the
// backlog folder). Items change rarely, so that file is read when the tab opens and on a key, not
// every two seconds, and the tab says when it was written. `#backlog` in the address opens there.
//
// No wait turns amber or red by its length here. The monitor this page follows had limits measured
// on its own runs; three small tasks ran through Lem (2026-11-15), too few to take a limit from.
// Colour says who acts, and a task that waits for the owner is the only one that asks for attention.
const FEED_EVERY_MS = 2000;
const TREE_EVERY_MS = 3000;
const DONE_SHOWN = 6;
// Past this many banners the rest fold under one line: on 2026-11-16 thirteen banners filled the
// first screen of a board of 40 tasks and pushed its lanes below it (audit of the board, that day).
const BANNERS_SHOWN = 3;
let bannersOpen = false;

const START_VIEW = (decodeURIComponent(location.pathname.split('/').at(-1)).match(/^task-([a-z0-9-]+)\.html$/) ?? [])[1] ?? null;
let view = START_VIEW;
// which tab of the board of all tasks is open; the board of one task has no tabs
let tab = !START_VIEW && location.hash === '#backlog' ? 'backlog' : 'tasks';

// Who acts in each status, in the words of SKILL.md's table.
const STATUS = {
  queued: {actor: 'quiet', who: 'Lem', label: 'Queued', icon: 'clock', live: false},
  building: {actor: 'lead', who: 'The agent', label: 'Building', icon: 'code', live: true},
  planned: {actor: 'lem', who: 'Lem', label: 'Planned', icon: 'file', live: false},
  held: {actor: 'you', who: 'You', label: 'Waits for you', icon: 'user', live: true},
  blocked: {actor: 'bad', who: 'Lem', label: 'Blocked', icon: 'alert', live: false},
  ready: {actor: 'gate', who: 'Lem', label: 'Ready for its checks', icon: 'flag', live: false},
  landing: {actor: 'gate', who: 'The checks', label: 'Checks and review', icon: 'play', live: true},
  open: {actor: 'you', who: 'You', label: 'Waits for the merge', icon: 'branch', live: false},
  landed: {actor: 'done', who: 'Nobody', label: 'Landed', icon: 'check', live: false},
  drafted: {actor: 'you', who: 'You', label: 'Drafted at night', icon: 'moon', live: false},
  dropped: {actor: 'quiet', who: 'Nobody', label: 'Dropped', icon: 'x', live: false},
  answered: {actor: 'done', who: 'Nobody', label: 'Answered', icon: 'file', live: false},
};
// The states a task does not leave (project.py ENDED): nobody acts, and nothing of it waits.
const ENDED = ['landed', 'dropped', 'answered'];
// The kind of a request, from its state line `kind: KIND, because WHY` (stages/new.md), in the card's words.
// The kind `correction` is one plain rule that is wrong: the page says "a one-rule fix", never the
// scripts' word. It says nothing of the size: a task is a small change only by its one builder (the
// state line `small change: one builder`), and only that task has the "small change" tag.
const KINDS = {bug: 'a bug', feature: 'a feature', correction: 'a one-rule fix', investigation: 'an investigation', chore: 'a chore', docs: 'documentation'};
// The kind of a set of stories (`Kind:` of stories.py), feature or correction, in the page's words.
const storyKind = kind => (kind === 'correction' ? 'one-rule fix' : kind);
// What the investigation of a bug or a question found (project.py `log investigation`), as the
// head of its line, the card's word before it, and the sentence of the task's own board: the call
// says which path the task took after it.
const CALLS = {
  correction: {head: 'The investigation found a plain cause: one rule fixes it', card: 'The cause', now: 'A plain cause, which one rule fixes: the task goes on as a small change'},
  usual: {head: 'The investigation found a plain cause: a larger change', card: 'The cause', now: 'A plain cause, and a larger change: the interview starts from it'},
  'not-a-bug': {head: 'The investigation found no bug', card: 'No bug', now: 'No bug: the code does what it should'},
  'not-reproduced': {head: 'The investigation did not reproduce the bug', card: 'Not reproduced', now: 'Not reproduced: Lem asks you for one more fact'},
  answer: {head: 'The investigation answered the question', card: 'The answer', now: 'The answer to the question'},
};
const UNKNOWN = {actor: 'bad', who: 'Nobody', label: 'No status', icon: 'alert', live: false};
// The lanes are who acts: the owner, a lead and its builders, the machine checks and the review.
const LANES = [
  {key: 'you', title: 'Waits for you', actor: 'you', empty: 'Nothing waits for you'},
  {key: 'build', title: 'Building', actor: 'lead', empty: 'No task builds'},
  {key: 'checks', title: 'Checks and review', actor: 'gate', empty: 'No branch is checked or reviewed'},
  {key: 'done', title: 'Done', actor: 'done', empty: 'Nothing landed yet'},
];
// 'Proposed' is the pull request, or a branch ready to land where the remote is not GitHub.
const PHASES = ['Stories', 'Plan', 'Build', 'Checks', 'Review', 'Proposed', 'Landed'];
// A small change has no stories to wait in and no plan: one builder makes it, then the landing.
const SMALL_PHASES = ['Change', 'Checks', 'Review', 'Proposed', 'Landed'];
// What waits for the owner, the most pressing first: a choice whose wait runs out, a held task,
// then what only waits for his word.
const OWNER_ORDER = ['choice', 'held', 'planned', 'drafted', 'open'];
// Who took a decision, in the page's words to the owner.
const BY_WHOM = {lead: 'the agent', personas: 'the personas', owner: 'you', lem: 'Lem', timeout: 'the timeout', experts: 'the experts'};
// Who works on a task, from its state lines, in words a developer needs no glossary for: the page
// never says "lead" or "defender". `lead: session` is the companion Lem opens for a careful or large
// plan's talk, which builds nothing; `lead: builder` after a plan talk is the agent that builds the
// talked plan; `small change: one builder` is a small change's one builder, which is no lead.
// `chip` is the tag a card shows: "one agent" is what most tasks have, so it says nothing there.
const LEAD = {
  session: {tag: 'plan talk', chip: 'plan talk', title: 'A companion session talks the plan through, with the reviewer in its other pane; an agent builds it after the talk',
    head: 'Its companion talks the plan through', stat: 'a companion talks the plan through, with the reviewer in its other pane'},
  talked: {tag: 'one agent', chip: null, title: 'One agent builds it, after the plan talk in its companion',
    head: 'An agent builds it', stat: 'one agent builds the plan its companion talked through'},
  builder: {tag: 'one agent', chip: null, title: 'One agent plans this task, and a fresh builder builds each task of its plan', head: 'An agent plans and builds it',
    stat: 'one agent plans it, and a fresh builder builds each task of the plan'},
  small: {tag: 'one builder', chip: 'small change', title: 'A small change: one builder makes it, with no lead and no plan, and the landing checks it',
    head: 'One builder makes the change', stat: 'one builder makes the change, with no lead and no plan'},
};
const leadOf = t => (t.lead === 'session' ? 'session' : t.lead === 'small' ? 'small' : t.talks.length ? 'talked' : 'builder');
// The two experts of the lem-ask-expert skill, by the names decisions.py keeps their advice under.
const EXPERTS = {fable: 'Fable', astra: 'Astra'};
const expertName = key => EXPERTS[key] ?? key;
// The option both experts picked, as decisions.py `shared` reads it: none when one is missing, one
// found that none fits, or they split.
function sharedPick(d) {
  const picks = Object.keys(EXPERTS).map(key => d.advice[key]);
  return picks.every(a => a && a.pick != null) && new Set(picks.map(a => a.pick)).size === 1 ? picks[0].pick : null;
}
// What the end of a choice's wait takes, and why: the experts' shared pick, or the recommended
// option. While the wait runs and an expert has not advised yet, their pick may still come.
function endOf(d, over) {
  const pick = sharedPick(d);
  if (pick != null) return `“${pick}”, the experts’ shared pick`;
  const advised = Object.keys(EXPERTS).filter(key => d.advice[key]);
  if (!over && advised.length < 2) return `“${d.recommended}”, the recommended option, unless both experts pick one option before then`;
  return `“${d.recommended}”, the recommended option, as ${!advised.length ? 'no expert advised' : advised.length === 1 ? `only ${expertName(advised[0])} advised` : 'the experts have no shared pick'}`;
}
// One expert's advice, on a choice that waits (now) or on one that was taken (then).
const adviceLine = (key, a, then) => (a.pick != null
  ? `${expertName(key)} ${then ? 'picked' : 'picks'} “${a.pick}”, because ${a.why}`
  : `${expertName(key)} ${then ? 'found' : 'finds'} that none of the options fits, because ${a.why}`);
// The experts' reasons a settle or a timeout carries (`experts`: {name: why}), in one line.
const reasonsOf = experts => Object.entries(experts ?? {}).map(([key, why]) => `${expertName(key)}: ${why}`).join(' · ');
const adviceLines = (d, then) => Object.keys(EXPERTS).filter(key => d.advice[key]).map(key => adviceLine(key, d.advice[key], then));
// Why a later "no" cannot undo a step, in decisions.py's four kinds.
const IRREVERSIBLE = {
  data: 'it destroys or rewrites data outside the worktree', system: 'it writes to a system outside the repository',
  person: 'it sends something to a person', money: 'it spends money',
};
const FAMILIES = {1: 'one model family', 2: 'two model families'};
// The rows of "Where the time went": who held the work. A row's color repeats a hue of lem.css and
// never stands alone: each row has its name, and each mark its hover.
const ROWS = [
  {key: 'you', label: 'You', fill: 'var(--you)'},
  {key: 'lem', label: 'Lem', fill: 'var(--lem)'},
  {key: 'lead', label: 'The agent', fill: 'var(--lead)'},
  {key: 'builders', label: 'The builders', fill: 'color-mix(in srgb, var(--lead) 55%, var(--fg))'},
  {key: 'personas', label: 'The personas', fill: 'var(--quiet)'},
  {key: 'checks', label: 'The checks', fill: 'var(--gate)'},
  {key: 'review', label: 'The review', fill: 'color-mix(in srgb, var(--gate) 55%, var(--fg))'},
];
const ROW = Object.fromEntries(ROWS.map(r => [r.key, r]));

const ICONS = {
  code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',

    // whose wait is over with no timeout written. Only the first two wait for the owner: after the
    // wait the experts' shared pick or the recommended action stands, and his answer is a late one
    // (decisions.py). A task that has ended has none that waits (decisions.py pending).
    const over = d => !d.irreversible && d.deadline != null && d.deadline <= now;
    const rank = d => (over(d) ? 2 : d.irreversible ? 1 : 0);
    t.choices = [...t.decisions.values()].sort((a, b) => a.id - b.id);
    t.waiting = t.closed ? [] : t.choices.filter(d => d.kind === 'asked' && d.state === 'waits')
      .sort((a, b) => rank(a) - rank(b) || (rank(a) === 1 ? 0 : (a.deadline ?? 0) - (b.deadline ?? 0)) || a.id - b.id);
    t.asks = t.waiting.filter(d => !over(d));
    // stages/new.md and stages/plan.md write this line for stories that wait for his yes
    t.storiesWait = t.status === 'held' && /\bstories wait\b/.test([last.text, ...last.lines].join(' '));
    // a queued task waits for a free place, and one with an `after:` line for the task it needs too
    t.waitsAfter = t.status === 'queued' && needsTask(last);
    // A planned task waits for the owner only when its lead said the owner reads the plan.
    // A proposed task waits for the owner's merge, and a task with a choice for him waits for him
    // while the rest of its plan goes on.
    t.forOwner = t.asks.length > 0 || t.status === 'held' || t.status === 'drafted' || t.status === 'open' || (t.status === 'planned' && /\bowner\b/.test(t.text));
    if (t.forOwner && t.info.actor !== 'you') t.info = {...t.info, actor: 'you', who: 'You'};
    // a builder that investigates a bug or a question works before any lead
    t.investigating = investigates(last);
    if (t.investigating && !t.forOwner) t.info = {...t.info, who: 'The investigator', label: 'Investigating', icon: 'eye'};
    t.ownerRank = OWNER_ORDER.indexOf(t.asks.length ? 'choice' : t.status);
    t.lane = t.forOwner ? 'you' : t.closed ? 'done' : t.status === 'ready' || t.status === 'landing' ? 'checks' : 'build';
    t.segments = [];
    for (const [k, b] of t.blocks.entries()) {
      const end = t.blocks[k + 1]?.ts ?? (t.closed ? b.ts : now);
      const prev = t.segments.at(-1);
      if (prev && prev.status === b.status) prev.end = end;
      else t.segments.push({status: b.status, start: b.ts, end, open: k === t.blocks.length - 1 && !t.closed});
    }
    // Where the task got to: the newest status that is a step forward. A task that waits for the
    // owner or is blocked stays at the phase it reached.
    t.reached = t.blocks.findLast(b => !['held', 'blocked'].includes(b.status))?.status ?? t.status;
    // a builder investigated a bug or a question before the stories: the task's phases start with it
    t.investigated = t.blocks.some(investigates) || t.investigation != null;
    t.planCommitted = t.blocks.some(b => b.status === 'planned' || b.status === 'drafted' || /\bplan committed\b/.test([b.text, ...b.lines].join(' ')));
    t.gateBad = t.gates.filter(g => g.exit !== 0).length;
  }

  const by = status => list.filter(t => t.status === status).sort((a, b) => a.since - b.since);
  const m = {
    now, list, limit,
    // proposed: a pull request is open or the branch is ready to land, and it waits for the merge
    proposed: by('open'),
    building: by('building'), queued: by('queued'), ready: by('ready'), landing: by('landing'), blocked: by('blocked'),
    // A choice runs out, a held task stops work, a plan and a night draft only wait: in that
    // order, the oldest first.
    forOwner: list.filter(t => t.forOwner).sort((a, b) => a.ownerRank - b.ownerRank || a.since - b.since),
    landedToday: list.filter(t => t.status === 'landed' && dayKey(t.since) === dayKey(now)),
    // What project.py may-start counts: a task that builds, and the one the gate runs on.
    places: list.filter(t => t.status === 'building' || t.status === 'landing').length,
    unknown: list.filter(t => !STATUS[t.status]),
    // Only a task with a state block has a status to draw: one whose stories were read before its
    // first block (the usual path) has its events in the feed and no board yet.
    task: view ? list.find(x => x.slug === view) ?? null : null,
    // the board's lanes: each task is in one, so these numbers add up to the cards
    lane: Object.fromEntries(LANES.map(lane => [lane.key, list.filter(t => t.lane === lane.key)])),
    early: view && !list.some(x => x.slug === view) ? tasks.get(view)?.events.length ?? 0 : 0,
  };
  return m;
}

// One line of decisions.py's record, as project.py logged it. `at` is the record's own time.
function decisionEvent(t, e) {
  const kind = String(e.event).slice('decision.'.length);
  const ts = e.at ? new Date(e.at).getTime() : at(e);
  if (kind === 'story') {
    // A change names the approval it applies to by its number (`approval`); an older one named its digest (`approved`).
    const approval = e.approval ?? t.approvals.findLast(a => e.approved && a.digest === e.approved && a.ts <= ts)?.number ?? 0;
    t.changes.push({ts, order: t.events.length, change: e.change, how: e.how, story: e.story, was: e.was ?? null, now: e.now ?? null, why: e.why, choice: e.choice ?? null, by: e.by ?? null, said: e.said ?? null, approval});
    return;
  }
  if (kind === 'taken' || kind === 'asked') {
    t.decisions.set(e.id, {
      id: e.id, kind, ts, what: e.what, chose: e.chose ?? null, why: e.why, by: e.by ?? null, said: e.said ?? null, undo: e.undo ?? null,
      options: e.options ?? [], recommended: e.recommended ?? null, irreversible: e.irreversible ?? null,
      wait: e.wait_minutes ?? null, deadline: e.deadline ? new Date(e.deadline).getTime() : null,
      state: kind === 'taken' ? 'taken' : 'waits', ended: null, late: null, advice: {}, experts: null, away: false,
    });
    return;
  }
  const d = t.decisions.get(e.id);
  // An outcome whose question is not in the log is shown as such, never dropped.
  if (!d || d.kind !== 'asked') { t.orphans.push({ts, kind, id: e.id, chose: e.chose}); return; }
  if (kind === 'advised') d.advice[e.expert] = {ts, pick: e.none ? null : e.pick ?? null, why: e.why};
  else if (kind === 'answered') Object.assign(d, {state: 'answered', chose: e.chose, by: 'owner', ended: ts, words: e.words ?? null, ownerWhy: e.why ?? null, instead: e.instead === true});
  // A timeout written before the experts existed has no `by`: it took the recommended option.
  else if (kind === 'timeout') Object.assign(d, {state: 'timeout', chose: e.chose, by: e.by ?? 'timeout', ended: ts, experts: e.experts ?? null});
  else if (kind === 'settled') Object.assign(d, {state: 'settled', chose: e.chose, by: 'experts', ended: ts, experts: e.experts ?? null, away: true});
  else if (kind === 'late') d.late = {ts, chose: e.chose, words: e.words ?? null, why: e.why ?? null, instead: e.instead === true};
  else t.orphans.push({ts, kind, id: e.id, chose: e.chose});
}

// ---- blocks shared by both views ----

const jump = (target, label) => h('button', {class: 'jump', type: 'button', 'data-jump': target}, label, ' ', icon('arrow'));
const open = (slug, ...kids) => h('button', {class: 'rlink', type: 'button', 'data-open': slug}, ...kids);

function paneOf(id) {
  if (!id || !sessions) return null;
  return sessions.find(x => x.id.toUpperCase() === id.toUpperCase() || x.id.toUpperCase().startsWith(id.toUpperCase()) || x.name === id) ?? null;
}

// The status and how long it has held; for a task that ended, how long ago it ended.
function statusPill(t) {
  return h('span', {class: `pill a-${t.info.actor}${t.info.live ? ' live' : ''}`}, h('i'), t.info.label, ' ', h('span', {}, live(t.since), t.closed ? ' ago' : ''));
}

// The tags of a task: each one says something a developer acts on. On a lane card (`card`) the line
// above the tags already names the first choice that waits and the task of the plan, so the card
// leaves those out. The newest commit is the task board's "Last commit", and no tag repeats it.
function tags(t, card = false) {
  const out = [];
  if (t.kind) out.push(h('span', {class: 'tag', title: `The kind of the request, as Lem took it from the ask: ${KINDS[t.kind.kind] ?? t.kind.kind}, because ${t.kind.why}`}, icon('flag'), h('span', {}, KINDS[t.kind.kind] ?? t.kind.kind)));
  for (const c of t.waiting.filter(x => !(card && x === t.asks[0]))) out.push(h('span', {class: `tag c-you${t.asks.includes(c) ? ' live' : ''}`, title: `${c.what}\nrecommended: ${c.recommended}`}, icon('help'),
    h('span', {}, `choice ${c.id}: `, c.irreversible ? 'no end' : t.asks.includes(c) ? until(c.deadline) : 'wait over')));
  const lead = t.lead ? LEAD[leadOf(t)] : null;
  if (lead?.chip) out.push(h('span', {class: `tag c-lead${t.status === 'building' ? ' live' : ''}`, title: lead.title},
    icon(t.lead === 'session' ? 'split' : 'code'), h('span', {}, lead.chip)));
  if (t.progress && t.status === 'building' && !(card && !t.asks.length && taskLine({status: t.status, text: t.text, lines: []})))
    out.push(h('span', {class: 'tag', title: 'The task of the plan that is built now'}, icon('layers'), h('span', {}, `task ${t.progress.n} of ${t.progress.of}`)));
  if (t.stories) out.push(h('span', {class: 'tag', title: t.stories.list.map(st => `${st.n}. ${st.text}`).join('\n')}, icon('file'),
    h('span', {}, plural(t.stories.list.length, 'story').replace('storys', 'stories'))));
  if (t.gates.length) out.push(h('span', {class: `tag ${t.gateBad ? 'c-bad' : 'c-ok'}`, title: t.gates.map(g => `${g.exit === 0 ? 'green' : `exit ${g.exit}`}  ${g.command}  ${g.last ?? ''}`).join('\n')},
    icon(t.gateBad ? 'alert' : 'check'), h('span', {}, t.gateBad ? `checks red: ${t.gateBad} of ${t.gates.length}` : `checks green: ${t.gates.length}`)));
  const r = t.reviews.at(-1);
  if (r) out.push(h('span', {class: `tag ${r.verdict === 'clean' ? 'c-ok' : 'c-bad'}`, title: t.reviews.map(reviewLine).join('\n')},
    icon('eye'), h('span', {}, r.verdict === 'clean' ? `review ${r.round}: clean` : r.verdict === 'must-fix' ? `review ${r.round}: ${r.must_fix} must-fix` : `review ${r.round}: not reviewed`)));
  if (t.proposal) out.push(h('span', {class: `tag ${t.proposal.green ? 'c-ok' : 'c-you'}`, title: t.proposal.green ? GREEN : t.proposal.reasons.join('\n')},
    icon(t.proposal.green ? 'check' : 'alert'), h('span', {}, t.proposal.green ? 'green' : 'not green')));
  return out;
}

// What green means, in the words of the first line of a green pull request (`GREEN` in land.py).
const GREEN = 'The checks passed with the bar where it was, the review left no must-fix, no story changed, and no decision was taken by timeout or by the experts';

// How Lem puts a question to the owner: the project's `tools.ask` (`project.py show`), which board.py
// writes into meta.js. Lem's own page, the conversation in Lem's session, or the developer's own
// asker; a meta.js from before it names none says only where.
function askedHow(what, shown = false) {
  const verb = shown ? 'shows you' : 'asks you';
  if (meta.ask === 'lem-ask') return shown ? `Lem shows you ${what} as a page in its session` : `Lem puts ${what} to you as a page in its session`;
  if (meta.ask === 'terminal') return `Lem ${verb} ${what} in its session, as text in the conversation`;
  if (meta.ask) return `Lem ${verb} ${what} with ${meta.ask}, the asker this project names`;
  return `Lem ${verb} ${what} in its session`;
}

// Where the owner answers what waits for them. Lem is the one voice to the owner: a question comes
// the way the project's asker puts it (askedHow), and a merge or a landing is his word to Lem.
function answerOf(t, c = t.asks[0]) {
  if (c) {
    return c.irreversible
      ? `${askedHow(`choice ${c.id}`)}. Answer it there: it waits for your word, with no end.`
      : `${askedHow(`choice ${c.id}`)}. Answer it there before its wait ends; then the build goes on with ${sharedPick(c) != null ? 'the experts’ shared pick' : 'the recommended action'}.`;
  }
  if (t.status === 'open') return /^pull request\b/.test(t.text) ? 'Merge the pull request, or tell Lem in its session to land it.' : 'Tell Lem in its session to land it.';
  // a read in which no persona answered puts nothing on top of the stories
  if (t.storiesWait && t.reads.at(-1)?.answered === 0) return `${askedHow('the stories', true)}. No persona answered the read of them. Approve or change them there.`;
  if (t.storiesWait) return `${askedHow('the stories, with the personas’ read on top,', true)}. Approve or change them there.`;
  // A held task waits on what its own state line says, and never on a decision with options, which
  // is a choice of the record: the stories, one more fact an investigation needs, a step that is
  // the owner's to do, such as a trust prompt of the reviewer's agent, or an irreversible choice
  // every task left needs (stages/new.md). The board quotes the line and does not guess which.
  if (t.status === 'held') return `It waits on what its state says: “${t.shown}”. Lem tells you in its session what to do and where.`;
  if (t.status === 'planned') return 'Read the plan, then tell Lem in its session: build it or drop it.';
  return `Tell Lem in its session: /lem build ${t.slug}, or drop it.`;
}
const toLem = () => { const lem = paneOf(meta.session); return lem ? jump(lem.id, 'Go to Lem') : null; };

function buildBanners(m) {
  const out = [];
  if (meta.demo) out.push(keyed('demo', h('div', {class: 'banner demo'}, icon('alert'),
    h('span', {}, h('b', {}, 'Demo data. '), 'These tasks are examples and not real work. Nothing on this page waits for you.'))));
  // A banner is for what stops work or runs out: a choice whose wait runs, a held task and a
  // blocked task. A draft waits in its lane. The large card above the lanes has the most pressing
  // one, with where you answer, so its banner would say it a second time: the banners are the waits
  // after it, one line each. Past the first three they fold under one line.
  const focus = view ? null : focusOf(m);
  const inCard = focus ? (focus.t.asks.length ? `choice:${focus.t.slug}:${focus.t.asks[0].id}` : `task:${focus.t.slug}`) : '';
  const waits = [];
  for (const t of view ? [] : m.forOwner.filter(x => x.asks.length)) {
    for (const c of t.asks.filter(x => `choice:${t.slug}:${x.id}` !== inCard)) {
      waits.push(keyed(`choice:${t.slug}:${c.id}:${c.irreversible ? 'forever' : 'runs'}`, h('div', {class: 'banner attention'}, icon('help'),
        h('span', {}, h('b', {}, `Choice ${c.id} waits for you: `), open(t.slug, t.title), h('span', {class: 'sub'}, ` · ${c.what} · `,
          c.irreversible ? 'no end: no timeout takes it' : [until(c.deadline), `; then the build goes on with ${sharedPick(c) != null ? 'the experts’ shared pick' : 'the recommended action'}.`])),
        toLem())));
    }
  }
  for (const t of view ? [] : m.forOwner.filter(x => x.status === 'held' && !x.asks.length && `task:${x.slug}` !== inCard)) {
    waits.push(keyed(`you:${t.slug}:${t.status}`, h('div', {class: 'banner attention'}, icon('user'),
      h('span', {}, h('b', {}, `${t.info.label}: `), open(t.slug, t.title), h('span', {class: 'sub'}, ` · ${t.shown} · `, live(t.since))), toLem())));
  }
  for (const t of view ? [] : m.blocked.filter(x => `task:${x.slug}` !== inCard)) {
    waits.push(keyed(`blocked:${t.slug}`, h('div', {class: 'banner problem'}, icon('alert'),
      h('span', {}, h('b', {}, 'Blocked: '), open(t.slug, t.title), h('span', {class: 'sub'}, ` · ${t.shown} · `, live(t.since))))));
  }
  out.push(...waits.slice(0, BANNERS_SHOWN));
  const rest = waits.slice(BANNERS_SHOWN);
  if (rest.length) {
    const yours = rest.filter(n => n.classList.contains('attention')).length, blocked = rest.length - yours;
    const what = [yours && `${yours} wait${yours === 1 ? 's' : ''} for you`, blocked && `${blocked} blocked`].filter(Boolean).join(', ');
    out.push(keyed(`fold:${bannersOpen}:${rest.map(n => n.dataset.key).join(',')}`, h('div', {class: 'banner-fold'},
      h('button', {class: 'fold-toggle', type: 'button', 'data-fold': '', 'aria-expanded': String(bannersOpen)}, icon('layers'),
        h('span', {}, `${rest.length} more: ${what} · `, h('b', {}, bannersOpen ? 'Hide them' : 'Show them'))),
      h('div', {class: 'fold-rest', hidden: !bannersOpen}, rest))));
  }
  for (const t of m.unknown) {
    out.push(keyed(`unknown:${t.slug}`, h('div', {class: 'banner problem'}, icon('alert'),
      h('span', {}, `${t.title} has the status "${t.status}", which no stage writes; nobody acts on it`))));
  }
  if (view && !m.task && m.early) {
    out.push(keyed(`early:${m.early}`, h('div', {class: 'banner attention'}, icon('clock'),
      h('span', {}, `No state was written yet for the task "${view}": its ${plural(m.early, 'event')} ${m.early === 1 ? 'is' : 'are'} in the activity below, and the rest comes with its first state.`))));
  } else if (view && !m.task) out.push(keyed('notask', h('div', {class: 'banner problem'}, icon('alert'), h('span', {}, `No state was written yet for the task "${view}"`))));
  return out;
}

function buildTimeline(m, tasks, width) {
  const rows = tasks.filter(t => t.segments.length);
  if (!rows.length) return keyed('tl', h('div', {class: 'tl-empty'}, 'A row appears when a task writes its first state'));
  const padL = view ? 14 : Math.min(230, Math.max(120, Math.round(width * 0.2))), padR = 14, rowH = 26, top = 6;
  const t0 = Math.min(...rows.map(t => t.first));
  // Drawn to a coarser clock than the page's, so the markup holds still between steps. When every
  // task shown is closed, the axis ends at the last block: time after that is nobody's.
  const anyOpen = rows.some(t => !t.closed);
  const coarse = anyOpen ? Math.ceil(m.now / 15000) * 15000 : Math.max(...rows.map(t => t.lastTs));
  const span0 = niceCeil(Math.max(60000, coarse - t0));
  const W = Math.max(320, width), H = top + rows.length * rowH + 22;
  const x = ms => padL + ((W - padL - padR) * Math.min(span0, Math.max(0, ms - t0))) / span0;
  const svg = s('svg', {class: 'tl-svg', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'What each task waited on, over time'});
  const steps = 6;
  for (let i = 0; i <= steps; i++) {
    const ms = t0 + (span0 * i) / steps, gx = x(ms);
    svg.append(s('line', {class: 'grid', x1: gx, x2: gx, y1: top, y2: H - 20}));
    svg.append(s('text', {class: 'axis', x: gx, y: H - 6, 'text-anchor': i === 0 ? 'start' : i === steps ? 'end' : 'middle'}, tickLabel(ms, span0, m.now)));
  }
  rows.forEach((t, r) => {
    const y = top + r * rowH;
    const label = t.title.length > 30 ? `${t.title.slice(0, 29)}…` : t.title;
    if (!view) svg.append(s('a', {'data-open': t.slug}, s('text', {class: 'lane-label', x: 0, y: y + 15}, label, s('title', {}, t.title))));
    svg.append(s('rect', {class: 'track', x: padL, y: y + 5, width: W - padL - padR, height: 14, rx: 4}));
    for (const g of t.segments) {
      const info = STATUS[g.status] ?? UNKNOWN;
      const x1 = x(g.start), x2 = x(g.open ? coarse : g.end);
      if (g.end === g.start && !g.open) {
        svg.append(s('circle', {class: `end a-${info.actor}`, cx: x1, cy: y + 12, r: 5}, s('title', {}, `${info.label} at ${stamp(g.start, m.now)}`)));
        continue;
      }
      svg.append(s('rect', {class: `seg s-${g.status} a-${info.actor}${g.open && info.live ? ' live' : ''}`, x: x1, y: y + 5, width: Math.max(2, x2 - x1), height: 14, rx: 4},
        s('title', {}, `${info.label} · ${info.who} · ${stamp(g.start, m.now)} to ${g.open ? 'now' : stamp(g.end, m.now)} · ${span((g.open ? m.now : g.end) - g.start)}`)));
    }
  });
  if (anyOpen && coarse - t0 <= span0) svg.append(s('line', {class: 'nowline', x1: x(coarse), x2: x(coarse), y1: top, y2: H - 20}));
  return keyed('tl', h('div', {}, svg));
}

// One entry for each look a bar can have: the statuses drawn alike (the three that wait for the
// owner, the two that ended) share an entry, so no two entries show the same swatch.
const LOOK = k => `${STATUS[k].actor}${k === 'queued' || k === 'ready' ? `:${k}` : ''}`;
function buildLegend(m, tasks) {
  const total = new Map();
  for (const t of tasks) for (const g of t.segments) total.set(g.status, (total.get(g.status) ?? 0) + (g.open ? m.now : g.end) - g.start);
  const looks = new Map();
  for (const k of Object.keys(STATUS).filter(k => total.get(k) > 0)) looks.set(LOOK(k), [...(looks.get(LOOK(k)) ?? []), k]);
  return [...looks.entries()].map(([look, keys]) => keyed(`lg:${look}:${keys.join()}`, h('span', {class: `a-${STATUS[keys[0]].actor}`, title: keys.map(k => `${STATUS[k].label}: ${STATUS[k].who} acts`).join('\n')},
    h('i', {class: look.includes(':') ? `s-${keys[0]}` : null}), keys.map(k => STATUS[k].label).join(' · '))));
}

// The label of a tick of a time axis: to the second when the axis spans under six minutes, where
// six ticks of whole minutes would repeat one minute.
const tickLabel = (ms, whole, now) => (whole < 6 * 60000 ? hms(ms, now) : stamp(ms, now));

// ---- where the time of one task went ----

const taskLine = b => b.status === 'building' && [b.text, ...b.lines].join(' ').match(/\btask (\d+) of (\d+)\b/);
// A builder investigates a bug or a question before any lead: the block's line `investigation: bug` or `investigation: question` (stages/new.md).
const investigates = b => b.status === 'building' && [b.text, ...b.lines].some(line => /^investigation:/.test(line));
// A small change's one builder makes it: the block's line `small change: one builder` (stages/new.md).
const smallBlock = b => b.status === 'building' && [b.text, ...b.lines].some(line => /^small change: one builder$/.test(line));
// The events that cut a landing. `polish` is the end of the polish pass (land.py polish --done),
// which logs no start: its span runs from the event before it.
const CHECKS = ['polish', 'gate', 'task.red', 'review', 'review.filed', 'proposed'];
// The starts of the steps of a landing (land.py logs the first three, and a builder of the landing
// the fourth): each ends at the next step's event (SKILL.md).
const LANDING_STARTS = ['polish.start', 'gate.start', 'review.start', 'builder.start'];
// A landing starts with the rebase onto the base and, for a task that is no correction, the polish
// pass; no event says which runs until the pass ends. A pass of an earlier landing still counts.
const kindOf = t => t.stories?.kind ?? t.approvals.at(-1)?.kind ?? null;
const startsLanding = t => t.status === 'landing' && !t.gates.length && !t.polish && !t.landingStep && kindOf(t) !== 'correction';
// What runs in a landing whose newest step started and has not ended.
const STEP_RUNS = {'polish.start': 'The polish pass runs', 'gate.start': 'The checks run', 'review.start': 'The review runs'};
const stepRuns = e => STEP_RUNS[e.event] ?? `A builder makes ${e.job ?? 'its job'}`;

// The spans of one task, each on the row of who held the work, the marks of what logged only its
// end, and the bands of the stages behind them. `end` is where the drawing stops: the last event of
// a closed task, the page's coarse clock for an open one. Nothing here is a guess at a time no
// event holds.
function timeOf(t, end) {
  const spans = [], marks = [], bands = [];
  const t0 = Math.min(at(t.events[0]), t.first);
  const add = (row, from, to, head, sub = '', live = false) => { if (to > from || live) spans.push({row, from, to: Math.max(from, to), head, sub, live}); };
  // Each event belongs to the state block it follows in the log. The log keeps whole seconds, so a
  // review and the next state block may share one; the order of the log still tells them apart.
  const blockOf = new Map();
  let current = -1;
  for (const e of t.events) { if (e.event === 'task.state') current++; else blockOf.set(e, current); }

  // The span of each stage whose start is logged (SKILL.md), outside a landing: from its start to the
  // event that ends it, on the row of who held the work. One with no end yet runs while the task is
  // open; one with no end in a closed task is a dot where it started. A state block's own span leaves
  // their time out, so no time is drawn twice on one row.
  const after = (i, test) => t.events.slice(i + 1).find(test) ?? null;
  const explicit = [], startedReads = new Set();
  const readSub = r => `${r.answered} of ${r.asked} answered, ${FAMILIES[(r.families ?? []).length] ?? `${(r.families ?? []).length} model families`} · ${r.flagged ? `${r.flagged} flagged` : 'nobody confused'}${r.split ? ' · the families split' : ''}`;
  const pair = (i, e, row, head, sub, ends) => {
    const stop = after(i, ends);
    if (stop) explicit.push({row, from: at(e), to: at(stop), head, sub: typeof sub === 'function' ? sub(stop) : sub, live: false});
    else if (!t.closed) explicit.push({row, from: at(e), to: end, head, sub: typeof sub === 'function' ? 'it runs' : sub, live: true});
    else marks.push({row, at: at(e), head: `${head}: its start`, sub: 'no event of its end is logged'});
    return stop;
  };
  t.events.forEach((e, i) => {
    if (e.event === 'interview.start') pair(i, e, 'you', 'The interview', 'Lem asks you one question at a time', x => x.event === 'stories.read.start' || x.event === 'stories.approved');
    else if (e.event === 'scout.start') pair(i, e, 'builders', 'The scout reads the code', 'for the facts the stories need', x => x.event === 'scout');
    else if (e.event === 'stories.read.start') { const r = pair(i, e, 'personas', 'The personas’ read of the stories', readSub, x => x.event === 'stories.read'); if (r) startedReads.add(r); }
    else if (e.event === 'investigation.start') pair(i, e, 'builders', 'The investigation', e.kind === 'bug' ? 'a builder reproduces the bug and finds its cause' : 'a builder finds the answer', x => x.event === 'investigation');
    else if (e.event === 'builder.start' && t.blocks[blockOf.get(e)]?.status !== 'landing') {
      pair(i, e, 'builders', cap(String(e.job ?? 'a job')), 'a fresh builder; its span ends at the next state block', x => x.event === 'task.state' || LANDING_STARTS.includes(x.event) || CHECKS.includes(x.event));
    }
  });
  spans.push(...explicit);
  // A state block's span with the time of the stages above left out. When the block is a builder's
  // work and a builder's start is logged in it, the rest of it is the coordinator's (`coord`: the
  // agent of the task, or Lem): the brief before the builder starts, the report after it ends.
  const addBlock = (row, from, to, head, sub, open, coord = null) => {
    const cover = explicit.filter(x => x.from < to && x.to > from).map(x => [Math.max(from, x.from), Math.min(to, x.to)]).sort((p, q) => p[0] - q[0]);
    if (!cover.length) return add(row, from, to, head, sub, open);
    let cur = from;
    const pieces = [];
    for (const [a0, b0] of cover) { if (a0 > cur) pieces.push([cur, a0]); cur = Math.max(cur, b0); }
    if (cur < to) pieces.push([cur, to]);
    const own = coord && explicit.some(x => x.row === 'builders' && x.from >= from && x.from < to);
    for (const [a0, b0] of pieces) {
      if (!own) add(row, a0, b0, head, sub, open && b0 === to);
      else add(coord, a0, b0, a0 < cover[0][0] ? (coord === 'lead' ? 'It briefs the builder' : 'Lem starts the builder') : (coord === 'lead' ? 'It reads the builder’s report' : 'Lem reads the report'), sub, open && b0 === to);
    }
  };

  // the landing, cut by the events of its checks and its review: each piece belongs to the event that
  // ends it. A step whose start is logged (polish.start, gate.start, review.start, a builder's
  // builder.start) starts its piece there, and the time before it is Lem's: the rebase onto the base
  // before the first step, and Lem between two steps after it.
  function landing(k, from, to, open) {
    const inside = t.events.filter(e => (CHECKS.includes(e.event) || LANDING_STARTS.includes(e.event)) && blockOf.get(e) === k);
    const stepped = inside.some(e => LANDING_STARTS.includes(e.event));
    // One run of the gate is its commands on one tip, in order: land.py runs every command before it
    // judges the run, so a failed command is followed by the next one, not by a repair. The run is
    // complete when it has as many results as the settings have commands (meta.js `gates`). A repair
    // shows only as a run on another tip after a failed run, a failed stories' check or a must-fix,
    // or as a builder's own start.
    const gates = Number.isInteger(meta.gates) && meta.gates > 0 ? meta.gates : null;
    const sameTip = (a, b) => Boolean(a && b) && (String(a).startsWith(b) || String(b).startsWith(a));
    let run = null, owed = false, prev = from, before = null, opened = null;
    const job = e => cap(String(e.job ?? 'a job'));
    for (const e of inside) {
      const x = at(e);
      if (LANDING_STARTS.includes(e.event)) {
        if (opened?.event === 'builder.start') add('builders', prev, x, job(opened), 'a builder of the landing; its span ends at the next step');
        else if (!before) add('lem', prev, x, 'The rebase onto the base', 'Lem rebases the branch before the first step of the landing');
        else add('lem', prev, x, 'Lem, between two steps of the landing');
        opened = e; prev = x; before = e;
        continue;
      }
      // a builder of the landing ends at the next step: its piece runs to this event
      if (opened?.event === 'builder.start') { add('builders', prev, x, job(opened), 'a builder of the landing; its span ends at the next step'); prev = x; }
      const started = LANDING_STARTS.includes(before?.event);
      let repairing = false;
      if (e.event === 'polish') {
        // With its start logged, the pass is the builders' from it; else from the event before it,
        // and then the rebase onto the base is in it too. The checks after it start on a new tip.
        if (opened?.event === 'polish.start') add('builders', prev, x, 'The polish pass', `${e.before ?? '?'} → ${e.after ?? '?'} · ${plural(e.commits ?? 0, 'commit')}`);
        else add('builders', prev, x, 'The polish pass', 'from the event before it: its start is not logged, so the rebase onto the base is in it');
        run = null; owed = false; prev = x; before = e; opened = null;
        continue;
      }
      if (e.event === 'gate') {
        if (!run || run.done || !sameTip(run.tip, e.tip)) {
          repairing = !started && Boolean(run) && !sameTip(run.tip, e.tip) && (run.failed || owed);
          if (!run || !sameTip(run.tip, e.tip)) owed = false;
          run = {tip: e.tip, count: 0, failed: false, done: false};
        }
        run.count++;
        run.failed ||= e.exit !== 0;
        run.done = gates != null && run.count >= gates;
      } else if (e.event === 'task.red') {
        repairing = !started && (owed || run?.failed) && Boolean(run) && !sameTip(run.tip, e.tip);
        if (!e.ok) owed = true;
      } else if (e.event === 'review' && e.verdict === 'must-fix') owed = true;
      if (repairing) add('builders', prev, x, 'A repair, and the checks again', 'no event tells the repair from the checks');
      else if (e.event === 'gate') add('checks', prev, x, `The checks: ${e.command ?? 'a gate command'}`, e.exit === 0 ? `green · ${e.last ?? ''}` : `exit ${e.exit} · ${e.last ?? ''}`);
      else if (e.event === 'task.red') add('checks', prev, x, 'The stories’ tests, on the branch and on the base commit', e.ok ? 'each test holds its story' : 'a test does not hold its story');
      else if (e.event === 'review') add('review', prev, x, `Review round ${e.round ?? '?'}: ${KIND[e.kind] ?? e.kind}`, `${e.verdict}${(e.answered ?? []).length ? ` · answered: ${e.answered.join(', ')}` : ''}`);
      else if (e.event === 'review.filed') add('lem', prev, x, 'Lem files the defects outside the change', plural((e.items ?? []).length, 'item'));
      else add('lem', prev, x, 'Lem writes the pull request', e.green ? 'green' : 'not green');
      prev = x; before = e; opened = null;
    }
    const last = before?.event;
    if (open) {
      // After a failed run nothing says yet whether a builder repairs or the task stops: the time is Lem's, as the landing's owner.
      const afterFailure = ['lem', 'After a failed check: a repair or a stop, and no event says which yet'];
      const between = ['lem', 'Lem, between two steps of the landing'];
      const [row, head] = last === 'builder.start' ? ['builders', job(before)]
        : last === 'polish.start' ? ['builders', 'The polish pass runs']
        : last === 'gate.start' ? ['checks', gates ? `The checks run: 0 of ${gates} commands done` : 'The checks run']
        : last === 'review.start' ? ['review', `The review runs: ${KIND[before.floor] ?? before.floor ?? 'its floor'}`]
        : !last ? (startsLanding(t) ? ['lem', 'The landing starts: the rebase onto the base, then the polish pass, and no event says which runs yet'] : ['checks', 'The checks run'])
        : last === 'polish' ? (stepped ? between : ['checks', 'The checks run'])
        : last === 'gate' ? (run.failed && run.done ? afterFailure
          : run.failed && gates == null ? ['lem', 'A command of this run failed: the next command, a repair or a stop, and no event says which yet']
            : run.done ? ['checks', 'The stories’ tests run'] : ['checks', gates ? `The checks run: ${run.count} of ${gates} commands done${run.failed ? ', one failed' : ''}` : 'The checks run'])
        : last === 'task.red' ? (before.ok ? (stepped ? between : ['review', 'The review runs; its event comes when it is written down']) : afterFailure)
          : last === 'review' && before.verdict === 'must-fix' ? ['builders', 'A repair after the review’s must-fix'] : ['lem', 'Lem files and proposes'];
      add(row, prev, end, head, '', true);
    } else if (opened?.event === 'builder.start') add('builders', prev, to, job(opened), 'a builder of the landing; its span ends at the next state block');
    else add('lem', prev, to, last ? 'Lem, after the checks and the review' : 'The landing, with no check on record');
  }

  let sawTask = false, stage = null;
  const stageOf = b => {
    const task = taskLine(b);
    if (task) { sawTask = true; return {key: `task-${task[1]}`, label: `Task ${task[1]}`, short: `T${task[1]}`, sub: `of ${task[2]}`}; }
    if (investigates(b)) return {key: 'investigation', label: 'Investigation', short: 'Inv.'};
    if (smallBlock(b)) return {key: 'change', label: 'The change', short: 'Change'};
    if (b.status === 'building') return sawTask ? {key: 'build', label: 'Build', short: 'Build'} : {key: 'plan', label: 'Plan', short: 'Plan'};
    if (b.status === 'planned' || b.status === 'drafted') return {key: 'plan', label: 'Plan', short: 'Plan'};
    if (b.status === 'queued') return {key: 'queued', label: 'Queued', short: 'Queued'};
    if (b.status === 'ready' || b.status === 'landing') return {key: 'checks', label: 'Checks and review', short: 'Checks'};
    if (b.status === 'open') return {key: 'pr', label: 'Pull request', short: 'PR'};
    // a held or blocked task stays in the stage it was in; stories that wait come before any plan
    return stage ?? {key: 'stories', label: 'Stories', short: 'Stories'};
  };
  const band = (st, from, to, live) => {
    const prev = bands.at(-1);
    if (prev && prev.key === st.key && prev.to === from) { prev.to = to; prev.live = live; } else bands.push({...st, from, to, live});
  };
  if (t0 < t.first) band({key: 'stories', label: 'Stories', short: 'Stories'}, t0, t.first, false);

  t.blocks.forEach((b, k) => {
    const next = t.blocks[k + 1]?.ts;
    const open = next == null && !t.closed;
    const from = b.ts, to = next ?? (open ? end : b.ts);
    const task = taskLine(b);
    const what = saidOf(b, talkedBefore(t, b.ts)).join(' · ');
    if (!ENDED.includes(b.status) && STATUS[b.status]) { stage = stageOf(b); band(stage, from, to, open); }
    if (b.status === 'queued') addBlock('lem', from, to, needsTask(b) ? 'Queued: it waits for the task it needs and a free place' : 'Queued: it waits for a free place', what, open);
    else if (b.status === 'building' && task) addBlock('builders', from, to, `Task ${task[1]} of ${task[2]}`, what, open, 'lead');
    else if (investigates(b)) addBlock('builders', from, to, 'The investigation', what, open, 'lem');
    else if (smallBlock(b)) addBlock('builders', from, to, 'One builder makes the change', what, open, 'lem');
    else if (b.status === 'building') addBlock('lead', from, to, 'It plans the task', what, open);
    else if (b.status === 'planned') addBlock(/\bowner\b/.test(b.text) ? 'you' : 'lem', from, to, /\bowner\b/.test(b.text) ? 'The plan waits for you'
      : t.talks.some(x => x.ts <= b.ts) ? 'The plan talk is done: the plan waits for the agent that builds it' : 'The plan waits for its talk companion', what, open);
    else if (b.status === 'held') addBlock('you', from, to, /\bstories wait\b/.test(what) ? 'The stories wait for your yes' : 'It waits for you', what, open);
    else if (b.status === 'blocked') addBlock('lem', from, to, 'Blocked: Lem has to settle it', what, open);
    else if (b.status === 'drafted') addBlock('you', from, to, 'A night draft waits for your word', what, open);
    else if (b.status === 'ready') addBlock('lem', from, to, 'Ready: it waits for its checks', what, open);
    else if (b.status === 'landing') landing(k, from, to, open);
    else if (b.status === 'open') addBlock('you', from, to, 'It waits for your merge', what, open);
  });

  // The stories wait for his yes from the personas' read to his approval after it. A yes he gave
  // before the read was in, and a correction Lem approved in his name, cost him no wait.
  let since = -Infinity;
  for (const a of t.approvals) {
    const read = t.reads.filter(r => r.order > since && r.order < a.order).at(-1);
    if (a.by === 'owner' && read) add('you', read.ts, a.ts, 'The stories waited for your yes', `from the personas’ read to your approval${read.flagged || read.split ? ' · the read found a doubt' : ''}`);
    since = a.order;
  }
  // A choice is his from its question to its outcome, and never after its wait ends: then the
  // experts' shared pick or the recommended action stands, whenever the timeout is written. One the
  // experts settled while he was away ends there. One with no outcome and a wait that still runs,
  // or with no end, runs to now while the task is open.
  for (const c of t.choices.filter(d => d.kind === 'asked')) {
    const limit = c.irreversible || c.deadline == null ? Infinity : c.deadline;
    const outcome = c.ended ?? (t.closed ? Math.max(c.ts, t.lastTs) : null);
    const running = outcome == null && limit > end;
    const stop = running ? end : Math.min(outcome ?? Infinity, limit);
    const how = c.state === 'answered' && c.ended <= limit ? `you answered: ${c.chose}`
      : c.state === 'settled' ? `the experts took “${c.chose}” at ${hhmm(c.ended)}, while you were away`
      : c.state === 'timeout' && c.by === 'experts' ? `its wait ended at ${hhmm(limit)}; the experts’ shared pick “${c.chose}” was taken at ${hhmm(c.ended)}`
      : c.state === 'timeout' ? `its wait ended at ${hhmm(limit)}; the timeout took “${c.chose}” at ${hhmm(c.ended)}`
        : t.closed && outcome <= limit ? `the task is ${t.status}: it no longer waits`
          : c.irreversible ? 'it waits for your word, with no end' : running ? 'it waits for you' : `its wait ended at ${hhmm(limit)}${c.state === 'waits' ? ', and no timeout is written' : ''}`;
    add('you', c.ts, stop, `Choice ${c.id}: ${c.what}`, how, running);
  }
  for (const r of t.reads.filter(x => !startedReads.has(t.events[x.order - 1]))) {
    // a read in which nobody answered is written down too, and started once more; a read whose
    // start is logged is a span above
    marks.push({row: 'personas', at: r.ts, head: 'The personas’ read of the stories ended', sub: !r.answered ? `nobody of ${r.asked} answered · its start is not logged`
      : `${r.answered} of ${r.asked} answered, ${FAMILIES[r.families.length] ?? `${r.families.length} model families`} · ${r.flagged ? `${r.flagged} flagged` : 'nobody confused'}${r.split ? ' · the families split' : ''} · its start is not logged`});
  }
  // A plan talk is the review's from its start to its record. A record with no start before it is
  // a dot where it ended, and a start with no record yet is a talk that runs while the task is open.
  for (const talk of t.talks) {
    const sub = `with ${talk.reviewer}: ${talkCounts(talk)}`;
    if (talk.start != null) add('review', talk.start, talk.ts, 'The plan talk', sub);
    else marks.push({row: 'review', at: talk.ts, head: 'The plan talk ended', sub: `${sub} · its start is not logged`});
  }
  if (t.talkStart && !t.closed) add('review', t.talkStart.ts, end, 'The plan talk runs', `with ${t.talkStart.reviewer}; its record comes when the talk ends`, true);
  else if (t.talkStart) marks.push({row: 'review', at: t.talkStart.ts, head: 'The plan talk started', sub: `with ${t.talkStart.reviewer}; no record of its end is logged`});
  for (const e of t.events.filter(x => x.event === 'task.red')) {
    // the check the lead runs before the task is ready; the landing's own is a span above
    const inBuild = t.blocks[blockOf.get(e)]?.status !== 'landing';
    if (inBuild) marks.push({row: 'checks', at: at(e), head: 'The stories’ tests, checked before the landing', sub: e.ok ? 'each test holds its story' : 'a test does not hold its story'});
  }

  // the total of each row is the time it held the work: two spans of one row that overlap count once
  const totals = {};
  for (const row of ROWS) {
    const parts = spans.filter(x => x.row === row.key).map(x => [Math.max(t0, x.from), Math.min(end, x.live ? end : x.to)]).filter(([a, b]) => b > a).sort((a, b) => a[0] - b[0]);
    let sum = 0, reach = -Infinity;
    for (const [a, b] of parts) { if (b > reach) { sum += b - Math.max(a, reach); reach = b; } }
    totals[row.key] = sum;
  }
  return {t0, end, spans, marks: marks.filter(x => x.at >= t0 && x.at <= end), bands, totals, whole: Math.max(1, end - t0)};
}

function buildTimeCard(m, t, width) {
  const model = timeOf(t, t.closed ? Math.max(t.lastTs, at(t.events.at(-1))) : Math.ceil(m.now / 15000) * 15000);
  const rows = ROWS.filter(r => r.key === 'you' || model.spans.some(x => x.row === r.key) || model.marks.some(x => x.row === r.key));
  const W = Math.max(320, Math.floor(width)), padL = W < 560 ? 104 : 124, padR = 14, top = 26, laneH = 16, gap = 9, axisH = 22;
  const H = top + rows.length * (laneH + gap) - gap + 8 + axisH, bottom = H - axisH;
  const span0 = niceCeil(Math.max(60000, model.end - model.t0));
  const x = ms => padL + ((W - padL - padR) * Math.min(span0, Math.max(0, ms - model.t0))) / span0;
  const tip = (head, sub, from, to, fill) => ({'data-head': head, 'data-sub': sub || null, 'data-from': from, 'data-to': to, 'data-fill': fill || null});
  const svg = s('svg', {class: 'tl-svg', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Who held the work of this task, over time'});
  model.bands.forEach((b, i) => {
    const a = x(b.from), z = x(b.live ? model.end : b.to);
    svg.append(s('rect', {class: `band${i % 2 ? ' odd' : ''}${b.live ? ' hot' : ''}`, x: a, y: 2, width: Math.max(1, z - a), height: bottom - 2, rx: 5,
      ...tip(b.label, b.sub ?? '', b.from, b.live ? 'now' : b.to)}));
    if (z - a > 8 * b.short.length + 10) svg.append(s('text', {class: 'band-label', x: a + 6, y: 15}, b.short));
  });
  for (let i = 0; i <= 6; i++) {
    const ms = model.t0 + (span0 * i) / 6, gx = x(ms);
    svg.append(s('line', {class: 'grid', x1: gx, x2: gx, y1: top - 4, y2: bottom}));
    svg.append(s('text', {class: 'axis', x: gx, y: H - 6, 'text-anchor': i === 0 ? 'start' : i === 6 ? 'end' : 'middle'}, tickLabel(ms, span0, m.now)));
  }
  rows.forEach((r, i) => {
    const y = top + i * (laneH + gap);
    svg.append(s('rect', {x: 0, y: y + 4, width: 8, height: 8, rx: 2.5, style: `fill:${r.fill}`}));
    svg.append(s('text', {class: 'lane-label', x: 14, y: y + 12}, r.label));
    svg.append(s('rect', {class: 'track', x: padL, y, width: W - padL - padR, height: laneH, rx: 4}));
    for (const g of model.spans.filter(z => z.row === r.key)) {
      const a = x(g.from), z = x(g.live ? model.end : g.to);
      svg.append(s('rect', {class: `seg${g.live ? ' live' : ''}`, x: a, y, width: Math.max(2, z - a), height: laneH, rx: 3, style: `fill:${r.fill}`,
        ...tip(`${r.label} · ${g.head}`, g.sub, g.from, g.live ? 'now' : g.to, r.fill)}));
    }
    for (const g of model.marks.filter(z => z.row === r.key)) {
      svg.append(s('circle', {class: 'mark', cx: x(g.at), cy: y + laneH / 2, r: 5, style: `fill:${r.fill}`, ...tip(`${r.label} · ${g.head}`, g.sub, g.at, g.at, r.fill)}));
    }
  });
  if (!t.closed) svg.append(s('line', {class: 'nowline', x1: x(model.end), x2: x(model.end), y1: 2, y2: bottom}));
  return {card: keyed('tl', h('div', {}, svg)), model, rows};
}

// Each row's total and its share of the task's time. A choice that waits for the owner runs while
// the build goes on, so rows overlap and the shares need not add up to 100.
function buildTimeLegend(model, rows) {
  const held = rows.filter(r => model.totals[r.key] > 0);
  const share = r => Math.round((100 * model.totals[r.key]) / model.whole);
  // Where rows overlap the shares add up past 100, and the line says so in its own words: the sum of
  // the shares as shown, so that a reader's sum is the same.
  const raw = held.reduce((sum, r) => sum + model.totals[r.key], 0), shown = held.reduce((sum, r) => sum + share(r), 0);
  const over = raw > model.whole * 1.005 && shown > 100;
  // the whole first: each share below is of it
  return [keyed(`lt:whole:${Math.round(model.whole / 1000)}`, h('span', {class: 'whole'}, `${span(model.whole)} in all`)), ...held.map(r => keyed(`lt:${r.key}:${Math.round(model.totals[r.key] / 1000)}:${Math.round(model.whole / 1000)}`,
