<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lem board</title>
<link rel="stylesheet" href="lem.css">
<style>
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; border: 1px solid var(--line); background: var(--card); color: var(--ink); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.live i { animation: ping 2s ease-out infinite; }
  .pill span { color: var(--fg); }
  .jump {
    appearance: none; font-size: 12px; font-weight: 600; color: var(--fg); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 8px;
    background: color-mix(in srgb, var(--fg) 7%, transparent); border: 1px solid var(--line-strong);
  }
  .jump:hover { background: color-mix(in srgb, var(--fg) 13%, transparent); }
  .jump .ic { width: 13px; height: 13px; }
  .jump.back .ic { transform: rotate(180deg); }

  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; border: 1px solid; font-weight: 550; }
  .banner .ic { width: 16px; height: 16px; }
  .banner.attention { color: color-mix(in srgb, var(--you) 58%, var(--fg)); border-color: color-mix(in srgb, var(--you) 60%, transparent); background: color-mix(in srgb, var(--you) 14%, transparent); }
  .banner.problem { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); border-color: color-mix(in srgb, var(--bad) 65%, transparent); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .banner span { color: var(--fg); flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .banner .sub { color: var(--dim); font-weight: 400; }
  .banner .where { display: block; }
  .banner.demo { color: var(--fg); border-style: dashed; border-color: var(--line-strong); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--fg) 7%, transparent) 0 12px, transparent 12px 24px); }
  .tc-where { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .banners { display: flex; flex-direction: column; gap: 8px; }
  .banners:empty { display: none; }

  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 12px; }
  h2 { margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }

  .hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  @media (max-width: 1080px) { .hero, .cols { grid-template-columns: minmax(0, 1fr); } }

  /* now */
  .now { overflow: hidden; border-color: color-mix(in srgb, var(--actor) 38%, var(--line)); display: flex; flex-direction: column; }
  .now > div { flex: 1; display: flex; flex-direction: column; }
  .now::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 160% at 0% 0%, color-mix(in srgb, var(--actor) 15%, transparent), transparent 58%);
  }
  .now.a-you, .now.a-bad { background: color-mix(in srgb, var(--actor) 7%, var(--card)); }
  .now-in { position: relative; display: flex; gap: 18px; align-items: flex-start; }
  .avatar {
    width: 58px; height: 58px; border-radius: 17px; flex: none; display: grid; place-items: center;
    color: var(--ink); background: color-mix(in srgb, var(--actor) 20%, transparent);
    border: 1px solid color-mix(in srgb, var(--actor) 48%, transparent);
    animation: halo 2s ease-out infinite;
  }
  .avatar .ic { width: 27px; height: 27px; }
  .still .avatar { animation: none; }
  .now-body { min-width: 0; flex: 1; }
  .now-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink); }
  .now-head { font-size: 19px; line-height: 1.3; font-weight: 680; margin-top: 2px; overflow-wrap: anywhere; }
  .now-status { margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .now-ctx { margin-top: 3px; color: var(--dim); overflow-wrap: anywhere; }
  .timer-row { display: flex; align-items: baseline; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .timer { font: 680 42px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .a-you .timer, .a-bad .timer { color: var(--ink); }
  .note { font-size: 12px; color: var(--dim); }
  .now-next { position: relative; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  .now-next .lbl { font-size: 10.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .now-next .right { margin-left: auto; }
  .now-spacer { height: 16px; }

  /* progress */
  .prog { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 20px; align-items: center; }
  .ring-wrap { position: relative; width: 116px; height: 116px; }
  .ring { display: block; }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .done { stroke: var(--ok); }
  .ring .cur { stroke: var(--lead); animation: breathe 2s ease-in-out infinite; }
  .ring .todo { stroke: color-mix(in srgb, var(--fg) 12%, transparent); }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-center b { font: 700 25px/1 var(--mono); letter-spacing: -.03em; }
  .ring-center span { font-size: 10.5px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
  .phases { display: flex; align-items: flex-start; }
  .phase { flex: 1; min-width: 0; position: relative; padding-top: 20px; font-size: 11.5px; color: var(--faint); }
  .phase::before { content: ""; position: absolute; top: 6px; left: 14px; right: 0; height: 2px; background: var(--line); }
  .phase:last-child { flex: 0 0 auto; }
  .phase:last-child::before { display: none; }
  .phase i { position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--card); }
  .phase.past { color: var(--dim); } .phase.past::before { background: color-mix(in srgb, var(--ok) 60%, transparent); }
  .phase.past i { background: var(--ok); border-color: var(--ok); }
  .phase.cur { color: var(--fg); font-weight: 600; }
  .phase.cur i { border-color: var(--actor); background: color-mix(in srgb, var(--actor) 35%, var(--card)); animation: halo 2s ease-out infinite; }
  .phase small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
  .stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .stat { min-width: 0; }
  .stat .sk { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 650; }
  .stat .sv { font: 650 16px/1.3 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 1px; }
  .stat .ss { font-size: 11px; line-height: 1.35; color: var(--dim); }
  .stat.ok .sv { color: color-mix(in srgb, var(--ok) 58%, var(--fg)); } .stat.you .sv { color: color-mix(in srgb, var(--you) 58%, var(--fg)); } .stat.bad .sv { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); }

  /* timeline */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; background: var(--actor); }
  .tl-svg { display: block; overflow: visible; }
  .tl-svg .lane-label { font: 550 11.5px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; fill: var(--dim); }
  .tl-svg .track { fill: color-mix(in srgb, var(--fg) 4%, transparent); }
  .tl-svg .grid { stroke: var(--line); stroke-dasharray: 2 4; }
  .tl-svg .axis { font: 10.5px var(--mono); fill: var(--dim); }
  .tl-svg .seg { fill: var(--actor); }
  .tl-svg .seg.s-queued { fill: color-mix(in srgb, var(--quiet) 45%, transparent); }
  .tl-svg .seg.s-ready { fill: color-mix(in srgb, var(--gate) 45%, transparent); }
  .tl-svg .seg.live { animation: breathe 2s ease-in-out infinite; }
  .tl-svg .end { fill: var(--actor); stroke: var(--card); stroke-width: 1.5; }
  .tl-svg .nowline { stroke: var(--line-strong); stroke-width: 1.5; }
  .tl-svg a { cursor: pointer; }
  .tl-empty, .empty { padding: 22px 0; text-align: center; color: var(--faint); }
  /* where the time of one task went: a row for each actor, a band for each stage behind them */
  #tl-wrap { position: relative; }
  .legend em { font-style: normal; font-family: var(--mono); color: var(--fg); font-size: 11.5px; }
  .tl-svg .band { fill: transparent; }
  .tl-svg .band.odd { fill: color-mix(in srgb, var(--fg) 3.5%, transparent); }
  .tl-svg .band.hot { fill: color-mix(in srgb, var(--actor) 12%, transparent); stroke: color-mix(in srgb, var(--actor) 50%, transparent); stroke-width: 1; }
  .tl-svg .band-label { font: 600 10.5px var(--mono); fill: var(--dim); pointer-events: none; }
  .tl-svg .mark { stroke: var(--card); stroke-width: 1.5; }
  .tl-svg [data-head] { cursor: default; }
  .tl-note { margin-top: 10px; font-size: 11.5px; color: var(--faint); max-width: 120ch; }
  .tl-note:empty { display: none; }
  .tip {
    position: absolute; z-index: 5; pointer-events: none; width: max-content; max-width: 340px;
    padding: 8px 11px; border-radius: 10px; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere;
    background: color-mix(in srgb, var(--fg) 10%, var(--bg)); border: 1px solid var(--line-strong);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .3);
  }
  .tip .tt { display: flex; align-items: center; gap: 7px; font-weight: 650; }
  .tip .tt i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tip .ts { color: var(--dim); }
  .tip .td { color: var(--dim); font-family: var(--mono); font-size: 11.5px; }

  /* the board's columns */
  .lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1180px) { .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .lanes { grid-template-columns: minmax(0, 1fr); } }
  .lane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lane-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
  .lane-head i { width: 8px; height: 8px; border-radius: 3px; background: var(--actor); }
  .lane-head em { margin-left: auto; font: 600 11.5px var(--mono); font-style: normal; letter-spacing: 0; color: var(--fg); }
  .lane-empty { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 18px 14px; text-align: center; color: var(--faint); font-size: 12px; }
  .tcard {
    appearance: none; text-align: left; cursor: pointer; width: 100%; display: flex; flex-direction: column; gap: 8px;
    background: var(--card); border: 1px solid color-mix(in srgb, var(--actor) 30%, var(--line)); border-radius: 14px; padding: 13px 14px 12px;
    position: relative; overflow: hidden;
  }
  .tcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--actor); }
  .tcard:hover { background: var(--card-hi); }
  .tcard.s-queued, .tcard.s-dropped { border-style: dashed; }
  .tcard.s-queued::before, .tcard.s-dropped::before { background: transparent; }
  .tcard.s-dropped .tc-title { color: var(--faint); text-decoration: line-through; }
  .tc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tc-title { font-weight: 640; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; min-width: 0; }
  .tc-time { flex: none; font: 12px var(--mono); color: var(--dim); white-space: nowrap; padding-top: 1px; }
  .tc-ask { color: var(--dim); font-size: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .tc-text { font-size: 12.5px; color: var(--ink); font-weight: 560; overflow-wrap: anywhere; }
  .tc-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    --c: var(--quiet);
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 11.5px; max-width: 100%;
    background: color-mix(in srgb, var(--c) 11%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag .ic { width: 12px; height: 12px; color: color-mix(in srgb, var(--c) 58%, var(--fg)); }
  .tag.c-lead { --c: var(--lead); } .tag.c-ok { --c: var(--ok); } .tag.c-bad { --c: var(--bad); } .tag.c-gate { --c: var(--gate); } .tag.c-you { --c: var(--you); } .tag.c-lem { --c: var(--lem); }
  .tag.live {
    border-color: var(--c);
    background-image: linear-gradient(45deg,
      color-mix(in srgb, var(--c) 24%, transparent) 25%, color-mix(in srgb, var(--c) 9%, transparent) 25%,
      color-mix(in srgb, var(--c) 9%, transparent) 50%, color-mix(in srgb, var(--c) 24%, transparent) 50%,
      color-mix(in srgb, var(--c) 24%, transparent) 75%, color-mix(in srgb, var(--c) 9%, transparent) 75%);
    background-size: 20px 20px;
    animation: stripes 1s linear infinite;
  }
  .tag span { overflow: hidden; text-overflow: ellipsis; }
  .mini { position: relative; height: 5px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .mini span { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ok); border-radius: 3px; }
  .mini span.cur { background: var(--lead); animation: breathe 2s ease-in-out infinite; }
  .more { padding: 0 4px; font-size: 12px; color: var(--faint); }

  /* lists: state blocks, gate commands, reviews, activity */
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 6px 0; position: relative; }
  .row + .row { border-top: 1px solid var(--line); }
  .fi { position: relative; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: var(--ink); background: color-mix(in srgb, var(--actor) 18%, var(--card)); border: 1px solid color-mix(in srgb, var(--actor) 32%, transparent); }
  .fi .ic { width: 12px; height: 12px; }
  .rtext { font-size: 12.5px; line-height: 1.4; padding-top: 3px; min-width: 0; overflow-wrap: anywhere; }
  .rtext b { color: var(--ink); }
  .rtext .sub { display: block; color: var(--dim); }
  .rtext .cmd { font-family: var(--mono); font-size: 11.5px; }
  .rtime { font: 11px var(--mono); color: var(--dim); white-space: nowrap; padding-top: 5px; text-align: right; }
  .rlink { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px; }
  .feed { max-height: 460px; overflow: auto; margin: 0 -10px; padding: 0 10px; }

  .foot { display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); }
  .foot .error { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); font-weight: 600; }

  /* the two tabs, and the backlog */
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding: 0 2px; }
  .tab {
    appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 8px; font-size: 13px; font-weight: 600; color: var(--dim);
  }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--you); }
  .tab em { font: 600 11.5px var(--mono); font-style: normal; color: var(--dim); }
  kbd { font: 600 10.5px var(--mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--dim); background: var(--card); }
  .backlog { display: flex; flex-direction: column; gap: 14px; }
  .bl-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .bl-bar input {
    flex: 1 1 260px; min-width: 0; font: inherit; color: var(--fg); padding: 7px 11px; border-radius: 9px;
    background: var(--card); border: 1px solid var(--line-strong);
  }
  .bl-bar input:focus-visible { outline: 2px solid var(--gate); outline-offset: 1px; }
  .bl-group { display: flex; flex-direction: column; gap: 8px; }
  .bl-group.recessive .bl-item { border-style: dashed; }
  .bl-group.recessive .bl-title { color: var(--dim); }
  .bl-item { background: var(--card); border: 1px solid color-mix(in srgb, var(--actor) 26%, var(--line)); border-radius: 12px; overflow: hidden; }
  .bl-item.cur { box-shadow: 0 0 0 2px color-mix(in srgb, var(--gate) 70%, transparent); }
  .bl-head { appearance: none; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 14px; }
  .bl-head:hover { background: var(--card-hi); }
  .bl-title { font-weight: 640; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .bl-where { grid-column: 1; font: 12px var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .bl-where.stale { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); display: flex; align-items: center; gap: 6px; }
  .bl-side { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 5px; max-width: 46ch; }
  .bl-body { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
  .bl-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55; max-width: 96ch; }
  .bl-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 12.5px; }
  .bl-actions code { font: 12px var(--mono); padding: 2px 7px; border-radius: 6px; background: var(--card-hi); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .bl-actions .go { border-color: color-mix(in srgb, var(--you) 60%, transparent); background: color-mix(in srgb, var(--you) 14%, transparent); }
  .bl-note { color: var(--dim); }
  .bl-note.bad { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); }
</style>
</head>
<body>
<main class="page" id="page">
  <div id="banners" class="banners"></div>
  <header class="top">
    <div class="ident">
      <div class="mark">
<!-- lem-mark: a copy of assets/lem-mark.svg; tests/test-lem.sh fails when the two differ -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="8 2 244 244" role="img" aria-labelledby="c2m-title c2m-desc">
<title id="c2m-title">Lem</title>
<desc id="c2m-desc">A tall hooded coat with nothing in its hood stands in a cut field and holds one long line in both hands. Strands hang from the line to four smaller hooded figures.</desc>
<defs>
  <linearGradient id="c2m-sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b5c5c0"/><stop offset="1" stop-color="#eadfbe"/></linearGradient>
  <linearGradient id="c2m-field" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#c7a95a"/><stop offset="1" stop-color="#ddbe6c"/></linearGradient>
  <clipPath id="c2m-clip"><rect x="9.5" y="3.5" width="241" height="241" rx="21"/></clipPath>
</defs>
<rect x="8.75" y="2.75" width="242.5" height="242.5" rx="22" fill="#eadfbe" stroke="#77725a" stroke-width="1.5" stroke-opacity=".7"/>
<g clip-path="url(#c2m-clip)">
  <path d="M0 0H260V130H0Z" fill="url(#c2m-sky)"/>
  <path d="M0 127Q130 123 260 127V260H0Z" fill="url(#c2m-field)"/>
  <!-- cut stalks -->
  <path d="M22 150l1-4M60 170l-1-4M95 148l1-4M176 152l1-4M240 166l-1-4M14 216l1-4M236 226l-1-4M206 244l1-4" fill="none" stroke="#85763c" stroke-width="1" opacity=".5"/>
  <path d="M44 160l1-3M120 142l1-3M222 180l-1-3M24 240l1-3" fill="none" stroke="#f3e0a0" stroke-width="1.2" opacity=".8"/>

  <!-- long shadows fall toward the viewer -->
  <path d="M101 229L160 229L92 262L22 262Z" fill="#6a7559" opacity=".6"/>
  <path d="M61 238L80 238L58 254L36 254Z" fill="#6a7559" opacity=".6"/>
  <path d="M181 238L200 238L178 254L156 254Z" fill="#6a7559" opacity=".6"/>
  <path d="M27 204L41 204L25 216L9 216Z" fill="#6a7559" opacity=".6"/>
  <path d="M219 204L233 204L217 216L201 216Z" fill="#6a7559" opacity=".6"/>

  <!-- the coat -->

// A text node tick() rewrites every second, so the block around it keeps the same markup.
const live = (since, fmt = 'span') => h('span', {'data-since': since, 'data-fmt': fmt});
// The same for a count-down to the end of a wait: "12m left", or a clock.
const until = (end, fmt = 'left') => h('span', {'data-until': end, 'data-fmt': fmt});
const keyed = (key, node) => { node.dataset.key = key; return node; };

// ---- the model ----

function derive(now) {
  const tasks = new Map();
  let limit = null;
  for (const e of events) {
    if (!e.task) continue;
    let t = tasks.get(e.task);
    if (!t) tasks.set(e.task, t = {
      slug: e.task, title: titleOf(e.task), ask: null, blocks: [], gates: [], reviews: [], proposal: null, stories: null, red: null, lead: null, session: null, progress: null, commit: null, branch: null,
      events: [], decisions: new Map(), orphans: [], changes: [], approvals: [], reads: [], talk: null, filed: [], missed: null,
    });
    // every event of the task, in the order of the log: "Where the time went" reads them all
    t.events.push(e);
    if (String(e.event).startsWith('decision.')) { decisionEvent(t, e); continue; }
    // The stories the owner approved, or Lem in his name for a correction, and each read of them by the personas.
    if (e.event === 'stories.approved') { t.approvals.push({ts: at(e), by: e.by, kind: e.kind, why: e.why, digest: e.digest, stories: e.stories ?? [], replaces: e.replaces ?? null}); continue; }
    if (e.event === 'stories.read') {
      t.reads.push({ts: at(e), by: e.by, asked: e.asked, answered: e.answered, families: e.families ?? [], silent: e.silent ?? [], stories: e.stories, flagged: e.flagged, split: e.split === true, digest: e.digest});
      continue;
    }
    if (e.event === 'plan.talk') { t.talk = {ts: at(e), reviewer: e.reviewer, turns: e.turns, settled: e.settled, open: e.open}; continue; }
    if (e.event === 'review.filed') { t.filed.push({ts: at(e), items: e.items ?? [], tip: e.tip}); continue; }
    if (e.event === 'careful.missed') { t.missed = {ts: at(e), path: e.path, pattern: e.pattern}; continue; }
    // The stories of the task's plan, as the lead last recorded them, and the newest check that
    // each one's tests pass on the branch and fail on the base commit.
    if (e.event === 'task.stories') { t.stories = {kind: e.kind, why: e.why, digest: e.digest, list: e.stories ?? [], ts: at(e)}; continue; }
    if (e.event === 'task.red') { t.red = {ok: e.ok, digest: e.digest, tests: e.tests ?? [], without: e.without_a_test ?? [], tip: e.tip, ts: at(e)}; continue; }
    if (e.event === 'gate') {
      // A repaired failure runs the gate again inside one landing: a result on another tip starts
      // a new run, and a command's newer result replaces its older one.
      const result = {ts: at(e), command: e.command, exit: e.exit, last: e.last, tip: e.tip};
      if (t.gates.some(g => g.tip !== result.tip)) t.gates = [];
      t.gates = [...t.gates.filter(g => g.command !== result.command), result];
      continue;
    }
    // Each review of the task's change before it is proposed, and what the proposal said: green,
    // or each reason it is not.
    // A review that was written down again after a cut-off run has the same attempt: it is one review.
    if (e.event === 'review') { t.reviews = t.reviews.filter(r => r.attempt == null || r.attempt !== e.attempt); t.reviews.push({ts: at(e), attempt: e.attempt, round: e.round, kind: e.kind, verdict: e.verdict, must_fix: e.must_fix, should: e.should, nit: e.nit, answered: e.answered ?? [], silent: e.silent ?? [], ran: e.ran ?? [], left_out: e.left_out ?? [], tip: e.tip}); continue; }
    if (e.event === 'proposed') { t.proposal = {ts: at(e), green: e.green === true, reasons: e.not_green ?? [], tip: e.tip}; continue; }
    if (e.event !== 'task.state') continue;
    const ts = at(e);
    const lines = [e.text, ...(e.lines ?? [])].map(String);
    // A landing that starts is a new run of the gate; the results of an earlier one are history.
    // A task that comes back from the build starts over, with new reviews too.
    if (e.status === 'landing' && t.blocks.at(-1)?.status !== 'landing') t.gates = [];
    if (e.status === 'landing' && t.blocks.at(-1)?.status === 'ready') { t.reviews = []; t.proposal = null; }
    t.blocks.push({ts, status: e.status, text: String(e.text ?? ''), lines: (e.lines ?? []).map(String)});
    // an older log may hold the first line of task.md with its heading mark
    t.ask = e.ask ? String(e.ask).replace(/^[#>\s]+/, '') : t.ask;
    limit = e.limit ?? limit;
    for (const line of lines) {
      const lead = line.match(/^lead: (builder|session)\b/);
      if (lead) { t.lead = lead[1]; if (lead[1] === 'builder') t.session = null; }
      const session = line.match(/^session: (\S+)/);
      if (session) t.session = session[1];
      const progress = e.status === 'building' && line.match(/\btask (\d+) of (\d+)\b/);
      if (progress) t.progress = {n: Number(progress[1]), of: Number(progress[2])};
    }
    // The block that says the plan is committed also says how many tasks it has; the lead is then on the first.
    const planned = e.status === 'building' && /\bplan committed\b/.test(lines.join(' ')) && lines.join(' ').match(/\b(\d+) tasks?\b/);
    if (planned) t.progress = {n: 1, of: Number(planned[1])};
    if (e.branch) t.branch = e.branch;
    if (e.head && e.head !== t.commit?.head) t.commit = {head: e.head, subject: e.subject ?? '', seen: ts};
  }

  const list = [...tasks.values()].filter(t => t.blocks.length);
  for (const t of list) {
    const last = t.blocks.at(-1);
    t.status = last.status;
    t.info = STATUS[t.status] ?? UNKNOWN;
    t.text = last.text;
    t.lastTs = last.ts;
    // "since" is when the task entered the status it has now, not when its newest block was written.
    let i = t.blocks.length - 1;
    while (i > 0 && t.blocks[i - 1].status === t.status) i--;
    t.since = t.blocks[i].ts;
    t.first = t.blocks[0].ts;
    t.closed = t.status === 'landed' || t.status === 'dropped';
    // Each decision of the build as it stands, and the choices that still wait in the record: the
    // one whose wait ends first comes first, then one with no end (an irreversible step), then one
    // whose wait is over with no timeout written. Only the first two wait for the owner: after the
    // wait the recommended action stands, and his answer is a late one (decisions.py). A task that
    // is landed or dropped has none that waits (decisions.py pending).
    const over = d => !d.irreversible && d.deadline != null && d.deadline <= now;
    const rank = d => (over(d) ? 2 : d.irreversible ? 1 : 0);
    t.choices = [...t.decisions.values()].sort((a, b) => a.id - b.id);
    t.waiting = t.closed ? [] : t.choices.filter(d => d.kind === 'asked' && d.state === 'waits')
      .sort((a, b) => rank(a) - rank(b) || (rank(a) === 1 ? 0 : (a.deadline ?? 0) - (b.deadline ?? 0)) || a.id - b.id);
    t.asks = t.waiting.filter(d => !over(d));
    // stages/new.md and stages/plan.md write this line for stories that wait for his yes
    t.storiesWait = t.status === 'held' && /\bstories wait\b/.test([last.text, ...last.lines].join(' '));
    // A planned task waits for the owner only when its lead said the owner reads the plan.
    // A proposed task waits for the owner's merge, and a task with a choice for him waits for him
    // while the rest of its plan goes on.
    t.forOwner = t.asks.length > 0 || t.status === 'held' || t.status === 'drafted' || t.status === 'open' || (t.status === 'planned' && /\bowner\b/.test(t.text));
    if (t.forOwner && t.info.actor !== 'you') t.info = {...t.info, actor: 'you', who: 'You'};
    t.ownerRank = OWNER_ORDER.indexOf(t.asks.length ? 'choice' : t.status);

    t.segments = [];
    for (const [k, b] of t.blocks.entries()) {
      const end = t.blocks[k + 1]?.ts ?? (t.closed ? b.ts : now);
      const prev = t.segments.at(-1);
      if (prev && prev.status === b.status) prev.end = end;
      else t.segments.push({status: b.status, start: b.ts, end, open: k === t.blocks.length - 1 && !t.closed});
    }

    // owner or is blocked stays at the phase it reached.
    t.reached = t.blocks.findLast(b => !['held', 'blocked'].includes(b.status))?.status ?? t.status;
    t.planCommitted = t.blocks.some(b => b.status === 'planned' || b.status === 'drafted' || /\bplan committed\b/.test([b.text, ...b.lines].join(' ')));
    t.gateBad = t.gates.filter(g => g.exit !== 0).length;
  }

  const by = status => list.filter(t => t.status === status).sort((a, b) => a.since - b.since);
  const m = {
    now, list, limit,
    // proposed: a pull request is open or the branch is ready to land, and it waits for the merge
    proposed: by('open'),
    building: by('building'), queued: by('queued'), ready: by('ready'), landing: by('landing'), blocked: by('blocked'),
    // A choice runs out, a held decision stops work, a plan and a night draft only wait: in that
    // order, the oldest first.
    forOwner: list.filter(t => t.forOwner).sort((a, b) => a.ownerRank - b.ownerRank || a.since - b.since),
    landedToday: list.filter(t => t.status === 'landed' && dayKey(t.since) === dayKey(now)),
    // What project.py may-start counts: a task that builds, and the one the gate runs on.
    places: list.filter(t => t.status === 'building' || t.status === 'landing').length,
    unknown: list.filter(t => !STATUS[t.status]),
    task: view ? tasks.get(view) ?? null : null,
  };
  return m;
}

// One line of decisions.py's record, as project.py logged it. `at` is the record's own time.
function decisionEvent(t, e) {
  const kind = String(e.event).slice('decision.'.length);
  const ts = e.at ? new Date(e.at).getTime() : at(e);
  if (kind === 'story') {
    t.changes.push({ts, change: e.change, how: e.how, story: e.story, was: e.was ?? null, now: e.now ?? null, why: e.why, choice: e.choice ?? null, by: e.by ?? null, said: e.said ?? null});
    return;
  }
  if (kind === 'taken' || kind === 'asked') {
    t.decisions.set(e.id, {
      id: e.id, kind, ts, what: e.what, chose: e.chose ?? null, why: e.why, by: e.by ?? null, said: e.said ?? null, undo: e.undo ?? null,
      options: e.options ?? [], recommended: e.recommended ?? null, irreversible: e.irreversible ?? null,
      wait: e.wait_minutes ?? null, deadline: e.deadline ? new Date(e.deadline).getTime() : null,
      state: kind === 'taken' ? 'taken' : 'waits', ended: null, late: null,
    });
    return;
  }
  const d = t.decisions.get(e.id);
  // An outcome whose question is not in the log is shown as such, never dropped.
  if (!d || d.kind !== 'asked') { t.orphans.push({ts, kind, id: e.id, chose: e.chose}); return; }
  if (kind === 'answered') Object.assign(d, {state: 'answered', chose: e.chose, by: 'owner', ended: ts, words: e.words ?? null, ownerWhy: e.why ?? null, instead: e.instead === true});
  else if (kind === 'timeout') Object.assign(d, {state: 'timeout', chose: e.chose, by: 'timeout', ended: ts});
  else if (kind === 'late') d.late = {ts, chose: e.chose, words: e.words ?? null, why: e.why ?? null, instead: e.instead === true};
  else t.orphans.push({ts, kind, id: e.id, chose: e.chose});
}

// ---- blocks shared by both views ----

const jump = (target, label) => h('button', {class: 'jump', type: 'button', 'data-jump': target}, label, ' ', icon('arrow'));
const open = (slug, ...kids) => h('button', {class: 'rlink', type: 'button', 'data-open': slug}, ...kids);

function paneOf(id) {
  if (!id || !sessions) return null;
  return sessions.find(x => x.id.toUpperCase() === id.toUpperCase() || x.id.toUpperCase().startsWith(id.toUpperCase()) || x.name === id) ?? null;
}

function statusPill(t) {
  return h('span', {class: `pill a-${t.info.actor}${t.info.live ? ' live' : ''}`}, h('i'), t.info.label, ' ', h('span', {}, live(t.since)));
}

function tags(t) {
  const out = [];
  for (const c of t.waiting) out.push(h('span', {class: `tag c-you${t.asks.includes(c) ? ' live' : ''}`, title: `${c.what}\nrecommended: ${c.recommended}`}, icon('help'),
    h('span', {}, `choice ${c.id}: `, c.irreversible ? 'no end' : t.asks.includes(c) ? until(c.deadline) : 'wait over')));
  if (t.lead) out.push(h('span', {class: `tag c-lead${t.status === 'building' ? ' live' : ''}`, title: t.lead === 'session' ? 'A session of its own leads this task, with a reviewer in its other pane' : 'One builder leads this task'},
    icon(t.lead === 'session' ? 'split' : 'code'), h('span', {}, t.lead === 'session' ? 'session' : 'builder')));
  if (t.progress && t.status === 'building') out.push(h('span', {class: 'tag', title: 'The task of the plan the lead is on'}, icon('layers'), h('span', {}, `task ${t.progress.n} of ${t.progress.of}`)));
  if (t.commit) out.push(h('span', {class: 'tag mono', title: `${t.commit.head} ${t.commit.subject}${t.branch ? ` · ${t.branch}` : ''}`}, icon('commit'), h('span', {}, `${t.commit.head} ${t.commit.subject}`)));
  if (t.stories) out.push(h('span', {class: 'tag', title: t.stories.list.map(st => `${st.n}. ${st.text}`).join('\n')}, icon('file'),
    h('span', {}, t.stories.kind === 'correction' ? 'a correction: 1 story' : plural(t.stories.list.length, 'story').replace('storys', 'stories'))));
  if (t.gates.length) out.push(h('span', {class: `tag ${t.gateBad ? 'c-bad' : 'c-ok'}`, title: t.gates.map(g => `${g.exit === 0 ? 'green' : `exit ${g.exit}`}  ${g.command}  ${g.last ?? ''}`).join('\n')},
    icon(t.gateBad ? 'alert' : 'check'), h('span', {}, t.gateBad ? `gate red: ${t.gateBad} of ${t.gates.length}` : `gate green: ${t.gates.length}`)));
  const r = t.reviews.at(-1);
  if (r) out.push(h('span', {class: `tag ${r.verdict === 'clean' ? 'c-ok' : 'c-bad'}`, title: t.reviews.map(reviewLine).join('\n')},
    icon('eye'), h('span', {}, r.verdict === 'clean' ? `review ${r.round}: clean` : r.verdict === 'must-fix' ? `review ${r.round}: ${r.must_fix} must-fix` : `review ${r.round}: not reviewed`)));
  if (t.proposal) out.push(h('span', {class: `tag ${t.proposal.green ? 'c-ok' : 'c-you'}`, title: t.proposal.green ? 'The checks passed with the bar where it was, the review left no must-fix, no story changed' : t.proposal.reasons.join('\n')},
    icon(t.proposal.green ? 'check' : 'alert'), h('span', {}, t.proposal.green ? 'green' : 'not green')));
  return out;
}

// Where the owner answers what waits for them. Lem is the one voice to the owner, so the answer is
// always given in Lem's session; what differs is what the owner does there.
function answerOf(t, c = t.asks[0]) {
  if (c) {
    return c.irreversible
      ? `Lem puts choice ${c.id} to you as a page in its session. Answer it there: it waits for your word, with no end.`
      : `Lem puts choice ${c.id} to you as a page in its session. Answer it there before its wait ends; then the lead takes the recommended action.`;
  }
  if (t.status === 'open') return /^pull request\b/.test(t.text) ? 'Merge the pull request, or tell Lem in its session to land it.' : 'Tell Lem in its session to land it.';
  if (t.storiesWait) return 'Lem shows you the stories, with the personas’ read on top, as a page in its session. Approve or change them there.';
  if (t.status === 'held') return 'Lem puts this question to you in its session, as a page. Answer it there.';
  if (t.status === 'planned') return 'Read the plan, then tell Lem in its session: build it or drop it.';
  return `Tell Lem in its session: /lem build ${t.slug}, or drop it.`;
}
const toLem = () => { const lem = paneOf(meta.session); return lem ? jump(lem.id, 'Go to Lem') : null; };

function buildBanners(m) {
  const out = [];
  if (meta.demo) out.push(keyed('demo', h('div', {class: 'banner demo'}, icon('alert'),
    h('span', {}, h('b', {}, 'Demo data. '), 'These tasks are examples and not real work. Nothing on this page waits for you.'))));
  // A banner is for what stops work or runs out: a choice whose wait runs, a held decision and a
  // blocked task. A draft waits in its lane.
  for (const t of view ? [] : m.forOwner.filter(x => x.asks.length)) {
    for (const c of t.asks) {
      out.push(keyed(`choice:${t.slug}:${c.id}:${c.irreversible ? 'forever' : 'runs'}`, h('div', {class: 'banner attention'}, icon('help'),
        h('span', {}, h('b', {}, `Choice ${c.id} waits for you: `), open(t.slug, t.title), h('span', {class: 'sub'}, ` · ${c.what} · `,
          c.irreversible ? 'no end: no timeout takes it' : until(c.deadline)),
        h('span', {class: 'sub where'}, answerOf(t, c))), toLem())));
    }
  }
  for (const t of view ? [] : m.forOwner.filter(x => x.status === 'held' && !x.asks.length)) {
    out.push(keyed(`you:${t.slug}:${t.status}`, h('div', {class: 'banner attention'}, icon('user'),
      h('span', {}, h('b', {}, `${t.info.label}: `), open(t.slug, t.title), h('span', {class: 'sub'}, ` · ${t.text} · `, live(t.since)),
        h('span', {class: 'sub where'}, answerOf(t))), toLem())));
  }
  for (const t of view ? [] : m.blocked) {
    out.push(keyed(`blocked:${t.slug}`, h('div', {class: 'banner problem'}, icon('alert'),
      h('span', {}, h('b', {}, 'Blocked: '), open(t.slug, t.title), h('span', {class: 'sub'}, ` · ${t.text} · `, live(t.since))))));
  }
  for (const t of m.unknown) {
    out.push(keyed(`unknown:${t.slug}`, h('div', {class: 'banner problem'}, icon('alert'),
      h('span', {}, `${t.title} has the status "${t.status}", which no stage writes; nobody acts on it`))));
  }
  if (view && !m.task) out.push(keyed('notask', h('div', {class: 'banner problem'}, icon('alert'), h('span', {}, `No state block was written yet for the task "${view}"`))));
  return out;
}

function buildTimeline(m, tasks, width) {
  const rows = tasks.filter(t => t.segments.length);
  if (!rows.length) return keyed('tl', h('div', {class: 'tl-empty'}, 'A lane appears with a task’s first state block'));
  const padL = view ? 14 : Math.min(230, Math.max(120, Math.round(width * 0.2))), padR = 14, rowH = 26, top = 6;
  const t0 = Math.min(...rows.map(t => t.first));
  // Drawn to a coarser clock than the page's, so the markup holds still between steps. When every
  // task shown is closed, the axis ends at the last block: time after that is nobody's.
  const anyOpen = rows.some(t => !t.closed);
  const coarse = anyOpen ? Math.ceil(m.now / 15000) * 15000 : Math.max(...rows.map(t => t.lastTs));
  const span0 = niceCeil(Math.max(60000, coarse - t0));
  const W = Math.max(320, width), H = top + rows.length * rowH + 22;
  const x = ms => padL + ((W - padL - padR) * Math.min(span0, Math.max(0, ms - t0))) / span0;
  const svg = s('svg', {class: 'tl-svg', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'What each task waited on, over time'});
  const steps = 6;
  for (let i = 0; i <= steps; i++) {
    const ms = t0 + (span0 * i) / steps, gx = x(ms);
    svg.append(s('line', {class: 'grid', x1: gx, x2: gx, y1: top, y2: H - 20}));
    svg.append(s('text', {class: 'axis', x: gx, y: H - 6, 'text-anchor': i === 0 ? 'start' : i === steps ? 'end' : 'middle'}, stamp(ms, m.now)));
  }
  rows.forEach((t, r) => {
    const y = top + r * rowH;
    const label = t.title.length > 30 ? `${t.title.slice(0, 29)}…` : t.title;
    if (!view) svg.append(s('a', {'data-open': t.slug}, s('text', {class: 'lane-label', x: 0, y: y + 15}, label, s('title', {}, t.title))));
    svg.append(s('rect', {class: 'track', x: padL, y: y + 5, width: W - padL - padR, height: 14, rx: 4}));
    for (const g of t.segments) {
      const info = STATUS[g.status] ?? UNKNOWN;
      const x1 = x(g.start), x2 = x(g.open ? coarse : g.end);
      if (g.end === g.start && !g.open) {
        svg.append(s('circle', {class: `end a-${info.actor}`, cx: x1, cy: y + 12, r: 5}, s('title', {}, `${info.label} at ${stamp(g.start, m.now)}`)));
        continue;
      }
      svg.append(s('rect', {class: `seg s-${g.status} a-${info.actor}${g.open && info.live ? ' live' : ''}`, x: x1, y: y + 5, width: Math.max(2, x2 - x1), height: 14, rx: 4},
        s('title', {}, `${info.label} · ${info.who} · ${stamp(g.start, m.now)} to ${g.open ? 'now' : stamp(g.end, m.now)} · ${span((g.open ? m.now : g.end) - g.start)}`)));
    }
  });
  if (anyOpen && coarse - t0 <= span0) svg.append(s('line', {class: 'nowline', x1: x(coarse), x2: x(coarse), y1: top, y2: H - 20}));
  return keyed('tl', h('div', {}, svg));
}

function buildLegend(m, tasks) {
  const total = new Map();
  for (const t of tasks) for (const g of t.segments) total.set(g.status, (total.get(g.status) ?? 0) + (g.open ? m.now : g.end) - g.start);
  return Object.keys(STATUS).filter(k => total.get(k) > 0).map(k => keyed(`lg:${k}`, h('span', {class: `a-${STATUS[k].actor}`, title: `${STATUS[k].who} acts`}, h('i'), STATUS[k].label)));
}

// ---- where the time of one task went ----

const taskLine = b => b.status === 'building' && [b.text, ...b.lines].join(' ').match(/\btask (\d+) of (\d+)\b/);
const CHECKS = ['gate', 'task.red', 'review', 'review.filed', 'proposed'];

// The spans of one task, each on the row of who held the work, the marks of what logged only its
// end, and the bands of the stages behind them. `end` is where the drawing stops: the last event of
// a closed task, the page's coarse clock for an open one. Nothing here is a guess at a time no
// event holds.
function timeOf(t, end) {
  const spans = [], marks = [], bands = [];
  const t0 = Math.min(at(t.events[0]), t.first);
  const add = (row, from, to, head, sub = '', live = false) => { if (to > from || live) spans.push({row, from, to: Math.max(from, to), head, sub, live}); };

  // the landing, cut by the events of its checks and its review: each piece belongs to the event that ends it
  function landing(from, to, open) {
    const inside = t.events.filter(e => CHECKS.includes(e.event) && at(e) >= from && (open || at(e) < to));
    let prev = from, before = null;
    const repair = e => before?.event === 'review' && before.verdict === 'must-fix' && (e.event === 'gate' || e.event === 'task.red');
    for (const e of inside) {
      const x = at(e);
      if (repair(e)) add('builders', prev, x, 'A repair after the review’s must-fix, and the checks again', 'no event tells the repair from the checks');
      else if (e.event === 'gate') add('checks', prev, x, `The checks: ${e.command ?? 'a gate command'}`, e.exit === 0 ? `green · ${e.last ?? ''}` : `exit ${e.exit} · ${e.last ?? ''}`);
      else if (e.event === 'task.red') add('checks', prev, x, 'The stories’ tests, on the branch and on the base commit', e.ok ? 'each test holds its story' : 'a test does not hold its story');
      else if (e.event === 'review') add('review', prev, x, `Review round ${e.round ?? '?'}: ${KIND[e.kind] ?? e.kind}`, `${e.verdict}${(e.answered ?? []).length ? ` · answered: ${e.answered.join(', ')}` : ''}`);
      else if (e.event === 'review.filed') add('lem', prev, x, 'Lem files the defects outside the change', plural((e.items ?? []).length, 'item'));
      else add('lem', prev, x, 'Lem writes the pull request', e.green ? 'green' : 'not green');
      prev = x; before = e;
    }
    const last = before?.event;
    if (open) {
      const [row, head] = !last || last === 'gate' ? ['checks', 'The checks run'] : last === 'task.red' ? ['review', 'The review runs; its event comes when it is written down']
        : last === 'review' && before.verdict === 'must-fix' ? ['builders', 'A repair after the review’s must-fix'] : ['lem', 'Lem files and proposes'];
      add(row, prev, end, head, '', true);
    } else add('lem', prev, to, last ? 'Lem, after the checks and the review' : 'The landing, with no check on record');
  }

  let sawTask = false, stage = null;
  const stageOf = b => {
    const task = taskLine(b);
    if (task) { sawTask = true; return {key: `task-${task[1]}`, label: `Task ${task[1]}`, short: `T${task[1]}`, sub: `of ${task[2]}`}; }
    if (b.status === 'building') return sawTask ? {key: 'build', label: 'Build', short: 'Build'} : {key: 'plan', label: 'Plan', short: 'Plan'};
    if (b.status === 'planned' || b.status === 'drafted') return {key: 'plan', label: 'Plan', short: 'Plan'};
    if (b.status === 'queued') return {key: 'queued', label: 'Queued', short: 'Queued'};
    if (b.status === 'ready' || b.status === 'landing') return {key: 'checks', label: 'Checks and review', short: 'Checks'};
    if (b.status === 'open') return {key: 'pr', label: 'Pull request', short: 'PR'};
    // a held or blocked task stays in the stage it was in; stories that wait come before any plan
    return stage ?? {key: 'stories', label: 'Stories', short: 'Stories'};
  };
  const band = (st, from, to, live) => {
    const prev = bands.at(-1);
    if (prev && prev.key === st.key && prev.to === from) { prev.to = to; prev.live = live; } else bands.push({...st, from, to, live});
  };
  if (t0 < t.first) band({key: 'stories', label: 'Stories', short: 'Stories'}, t0, t.first, false);

  t.blocks.forEach((b, k) => {
    const next = t.blocks[k + 1]?.ts;
    const open = next == null && !t.closed;
    const from = b.ts, to = next ?? (open ? end : b.ts);
    const task = taskLine(b);
    const what = [b.text, ...b.lines].join(' · ');
    if (b.status !== 'landed' && b.status !== 'dropped' && STATUS[b.status]) { stage = stageOf(b); band(stage, from, to, open); }
    if (b.status === 'queued') add('lem', from, to, 'Queued: it waits for a free place', what, open);
    else if (b.status === 'building' && task) add('builders', from, to, `Task ${task[1]} of ${task[2]}`, what, open);
    else if (b.status === 'building') add('lead', from, to, 'The lead', what, open);
    else if (b.status === 'planned') add(/\bowner\b/.test(b.text) ? 'you' : 'lem', from, to, /\bowner\b/.test(b.text) ? 'The plan waits for you' : 'The plan waits for a session', what, open);
    else if (b.status === 'held') add('you', from, to, /\bstories wait\b/.test(what) ? 'The stories wait for your yes' : 'Held: it waits for you', what, open);
    else if (b.status === 'blocked') add('lem', from, to, 'Blocked: Lem has to settle it', what, open);
    else if (b.status === 'drafted') add('you', from, to, 'A night draft waits for your word', what, open);
    else if (b.status === 'ready') add('lem', from, to, 'Ready: it waits for its checks', what, open);
    else if (b.status === 'landing') landing(from, to, open);
    else if (b.status === 'open') add('you', from, to, 'It waits for your merge', what, open);
  });

  // The stories wait for his yes from the personas' read to his approval after it. A yes he gave
  // before the read was in, and a correction Lem approved in his name, cost him no wait.
  let since = -Infinity;
  for (const a of t.approvals) {
    const read = t.reads.filter(r => r.ts > since && r.ts <= a.ts).at(-1);
    if (a.by === 'owner' && read) add('you', read.ts, a.ts, 'The stories waited for your yes', `from the personas’ read to your approval${read.flagged || read.split ? ' · the read found a doubt' : ''}`);
    since = a.ts;
  }
  // a choice for him, from its question to its outcome; one with none runs to now while the task is open
  for (const c of t.choices.filter(d => d.kind === 'asked')) {
    const stop = c.ended ?? (t.closed ? Math.max(c.ts, t.lastTs) : null);
    const how = c.state === 'answered' ? `you answered: ${c.chose}` : c.state === 'timeout' ? `taken by the timeout: ${c.chose}`
      : t.closed ? `the task is ${t.status}: it no longer waits` : c.irreversible ? 'it waits for your word, with no end' : c.deadline <= end ? 'its wait is over, and no timeout is written' : 'it waits for you';
    add('you', c.ts, stop ?? end, `Choice ${c.id}: ${c.what}`, how, stop == null);
  }
  for (const r of t.reads) {
    marks.push({row: 'personas', at: r.ts, head: 'The personas’ read of the stories ended', sub: `${r.answered} of ${r.asked} answered, ${FAMILIES[r.families.length] ?? `${r.families.length} model families`} · ${r.flagged ? `${r.flagged} flagged` : 'nobody confused'}${r.split ? ' · the families split' : ''} · its start is not logged`});
  }
  if (t.talk) marks.push({row: 'review', at: t.talk.ts, head: 'The plan talk ended', sub: `with ${t.talk.reviewer}: ${plural(t.talk.turns, 'turn')}, ${t.talk.settled} settled, ${t.talk.open} open · its start is not logged`});
  for (const e of t.events.filter(x => x.event === 'task.red')) {
    // the check the lead runs before the task is ready; the landing's own is a span above
    const inBuild = t.blocks.findLast(b => b.ts <= at(e))?.status !== 'landing';
    if (inBuild) marks.push({row: 'checks', at: at(e), head: 'The stories’ tests, checked by the lead', sub: e.ok ? 'each test holds its story' : 'a test does not hold its story'});
  }

  // the total of each row is the time it held the work: two spans of one row that overlap count once
  const totals = {};
  for (const row of ROWS) {
    const parts = spans.filter(x => x.row === row.key).map(x => [Math.max(t0, x.from), Math.min(end, x.live ? end : x.to)]).filter(([a, b]) => b > a).sort((a, b) => a[0] - b[0]);
    let sum = 0, reach = -Infinity;
    for (const [a, b] of parts) { if (b > reach) { sum += b - Math.max(a, reach); reach = b; } }
    totals[row.key] = sum;
  }
  return {t0, end, spans, marks: marks.filter(x => x.at >= t0 && x.at <= end), bands, totals, whole: Math.max(1, end - t0)};
}

function buildTimeCard(m, t, width) {
  const model = timeOf(t, t.closed ? Math.max(t.lastTs, at(t.events.at(-1))) : Math.ceil(m.now / 15000) * 15000);
  const rows = ROWS.filter(r => r.key === 'you' || model.spans.some(x => x.row === r.key) || model.marks.some(x => x.row === r.key));
  const W = Math.max(320, Math.floor(width)), padL = W < 560 ? 104 : 124, padR = 14, top = 26, laneH = 16, gap = 9, axisH = 22;
  const H = top + rows.length * (laneH + gap) - gap + 8 + axisH, bottom = H - axisH;
  const span0 = niceCeil(Math.max(60000, model.end - model.t0));
  const x = ms => padL + ((W - padL - padR) * Math.min(span0, Math.max(0, ms - model.t0))) / span0;
  const tip = (head, sub, from, to, fill) => ({'data-head': head, 'data-sub': sub || null, 'data-from': from, 'data-to': to, 'data-fill': fill || null});
  const svg = s('svg', {class: 'tl-svg', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Who held the work of this task, over time'});
  model.bands.forEach((b, i) => {
    const a = x(b.from), z = x(b.live ? model.end : b.to);
    svg.append(s('rect', {class: `band${i % 2 ? ' odd' : ''}${b.live ? ' hot' : ''}`, x: a, y: 2, width: Math.max(1, z - a), height: bottom - 2, rx: 5,
      ...tip(b.label, b.sub ?? '', b.from, b.live ? 'now' : b.to)}));
    if (z - a > 8 * b.short.length + 10) svg.append(s('text', {class: 'band-label', x: a + 6, y: 15}, b.short));
  });
  for (let i = 0; i <= 6; i++) {
    const ms = model.t0 + (span0 * i) / 6, gx = x(ms);
    svg.append(s('line', {class: 'grid', x1: gx, x2: gx, y1: top - 4, y2: bottom}));
    svg.append(s('text', {class: 'axis', x: gx, y: H - 6, 'text-anchor': i === 0 ? 'start' : i === 6 ? 'end' : 'middle'}, stamp(ms, m.now)));
  }
  rows.forEach((r, i) => {
    const y = top + i * (laneH + gap);
    svg.append(s('rect', {x: 0, y: y + 4, width: 8, height: 8, rx: 2.5, style: `fill:${r.fill}`}));
    svg.append(s('text', {class: 'lane-label', x: 14, y: y + 12}, r.label));
    svg.append(s('rect', {class: 'track', x: padL, y, width: W - padL - padR, height: laneH, rx: 4}));
    for (const g of model.spans.filter(z => z.row === r.key)) {
      const a = x(g.from), z = x(g.live ? model.end : g.to);
      svg.append(s('rect', {class: `seg${g.live ? ' live' : ''}`, x: a, y, width: Math.max(2, z - a), height: laneH, rx: 3, style: `fill:${r.fill}`,
        ...tip(`${r.label} · ${g.head}`, g.sub, g.from, g.live ? 'now' : g.to, r.fill)}));
    }
    for (const g of model.marks.filter(z => z.row === r.key)) {
      svg.append(s('circle', {class: 'mark', cx: x(g.at), cy: y + laneH / 2, r: 5, style: `fill:${r.fill}`, ...tip(`${r.label} · ${g.head}`, g.sub, g.at, g.at, r.fill)}));
    }
  });
  if (!t.closed) svg.append(s('line', {class: 'nowline', x1: x(model.end), x2: x(model.end), y1: 2, y2: bottom}));
  return {card: keyed('tl', h('div', {}, svg)), model, rows};
}

// Each row's total and its share of the task's time. A choice that waits for the owner runs while
// the build goes on, so rows overlap and the shares need not add up to 100.
function buildTimeLegend(model, rows) {
  return rows.filter(r => model.totals[r.key] > 0).map(r => keyed(`lt:${r.key}:${Math.round(model.totals[r.key] / 1000)}:${Math.round(model.whole / 1000)}`,
    h('span', {title: `${r.label} held the work for ${span(model.totals[r.key])} of the task’s ${span(model.whole)}`}, h('i', {style: `background:${r.fill}`}), r.label,
      h('em', {}, `${span(model.totals[r.key])} · ${Math.round((100 * model.totals[r.key]) / model.whole)}%`))));
}

// The hover of a band, a span or a mark: what it is, how long it took and its two clock times.
function showTip(ev) {
  const tipBox = $('tip');
  const node = view && ev ? ev.target.closest?.('[data-head]') : null;
  if (!node) { tipBox.hidden = true; return; }
  const from = Number(node.dataset.from), to = node.dataset.to === 'now' ? Date.now() : Number(node.dataset.to);
  const when = from === to ? `at ${hms(from)}` : `${span(to - from)} · ${hms(from)} → ${node.dataset.to === 'now' ? 'now' : hms(to, from)}`;
  tipBox.replaceChildren(
    h('div', {class: 'tt'}, node.dataset.fill ? h('i', {style: `background:${node.dataset.fill}`}) : null, node.dataset.head),
    node.dataset.sub ? h('div', {class: 'ts'}, node.dataset.sub) : null,
    h('div', {class: 'td'}, when));
  tipBox.hidden = false;
  const box = $('tl-wrap').getBoundingClientRect();
  const px = ev.clientX - box.left, py = ev.clientY - box.top;
  const w = tipBox.offsetWidth, hgt = tipBox.offsetHeight;
  tipBox.style.left = `${px + 14 + w > box.width ? Math.max(0, px - 14 - w) : px + 14}px`;
  tipBox.style.top = `${Math.max(0, Math.min(py + 14, box.height - hgt))}px`;
}

// What each event of the scripts says, in the feed's words; an event not named here is shown as its fields.
const SAYS = {
  'task.stories': e => ({info: {actor: 'lead', icon: 'file'}, head: 'Stories recorded', text: `${e.kind}: ${plural((e.stories ?? []).length, 'story').replace('storys', 'stories')}`}),
  'task.red': e => ({info: {actor: e.ok ? 'done' : 'bad', icon: e.ok ? 'check' : 'alert'}, head: e.ok ? 'The stories’ tests hold' : 'A test does not hold its story', text: `on ${e.tip ?? '?'}, against ${e.base ?? 'the base'}`}),
  'stories.approved': e => ({info: {actor: e.by === 'owner' ? 'you' : 'lem', icon: 'check'}, head: e.by === 'owner' ? 'You approved the stories' : 'Taken as a correction in your name', text: `${e.kind}: ${plural((e.stories ?? []).length, 'story').replace('storys', 'stories')}`}),
  'stories.read': e => ({info: {actor: e.split || e.flagged ? 'you' : 'done', icon: 'users'}, head: 'The personas read the stories',
    text: `${e.split ? 'the families split · ' : ''}${e.flagged ? `${e.flagged} flagged` : 'nobody confused'} · ${e.answered} of ${e.asked} answered`}),
  'review': e => ({info: {actor: e.verdict === 'clean' ? 'done' : 'bad', icon: 'eye'}, head: 'Review', text: reviewLine(e)}),
  'review.filed': e => ({info: {actor: 'lem', icon: 'file'}, head: 'Filed in the backlog', text: plural((e.items ?? []).length, 'item')}),
  'proposed': e => ({info: {actor: e.green ? 'done' : 'you', icon: e.green ? 'check' : 'alert'}, head: e.green ? 'Proposed: green' : 'Proposed: not green', text: (e.not_green ?? []).join(' · ')}),
  'plan.talk': e => ({info: {actor: 'gate', icon: 'split'}, head: 'Plan talk', text: `with ${e.reviewer}: ${plural(e.turns, 'turn')}, ${e.settled} settled, ${e.open} open`}),
  'careful.missed': e => ({info: {actor: 'bad', icon: 'alert'}, head: 'A careful path the plan missed', text: `${e.path} (${e.pattern})`}),
  'decision.taken': e => ({info: {actor: 'done', icon: 'check'}, head: `Decision ${e.id}, by ${BY_WHOM[e.by] ?? e.by}`, text: `${e.what} → ${e.chose}`}),
  'decision.asked': e => ({info: {actor: 'you', icon: 'help'}, head: `Choice ${e.id} asked`, text: e.what, sub: e.irreversible ? 'it waits for your answer, with no end' : `its wait ends at ${hhmm(new Date(e.deadline).getTime())}`}),
  'decision.answered': e => ({info: {actor: 'you', icon: 'user'}, head: `You answered choice ${e.id}`, text: e.chose}),
  'decision.timeout': e => ({info: {actor: 'bad', icon: 'clock'}, head: `Choice ${e.id} taken by the timeout`, text: e.chose}),
  'decision.late': e => ({info: {actor: 'you', icon: 'user'}, head: `Your answer to choice ${e.id} came after its wait`, text: e.chose}),
  'decision.story': e => ({info: {actor: 'you', icon: 'alert'}, head: `Story ${e.story} ${e.how === 'changed' ? 'changed' : e.how === 'added' ? 'was added' : 'was removed'}`, text: e.why}),
};

function describe(e, m) {
  const title = titleOf(e.task);
  if (e.event === 'task.state') {
    const info = STATUS[e.status] ?? UNKNOWN;
    return {info, head: info.label, text: e.text, sub: (e.lines ?? []).join(' · '), title};
  }
  if (e.event === 'gate') {
    const ok = e.exit === 0;
    return {info: {actor: ok ? 'done' : 'bad', icon: ok ? 'check' : 'alert'}, head: ok ? 'Gate green' : `Gate red, exit ${e.exit}`, text: e.command, sub: e.last ?? '', title, mono: true};
  }
  const said = SAYS[e.event]?.(e);
  if (said) return {title, sub: '', ...said};
  const rest = Object.entries(e).filter(([k]) => !['ts', 'event', 'task'].includes(k)).map(([k, v]) => `${k} ${typeof v === 'string' ? v : JSON.stringify(v)}`).join(' · ');
  return {info: {actor: 'quiet', icon: 'dot'}, head: e.event, text: rest, sub: '', title};
}

function buildFeed(m, list) {
  if (!list.length) return [keyed('empty', h('div', {class: 'empty'}, 'No events yet'))];
  return list.slice(-200).reverse().map((e, i) => {
    const d = describe(e, m);
    return keyed(`f:${e.ts}:${e.task}:${list.length - i}`, h('div', {class: `row a-${d.info.actor}`},
      h('span', {class: 'fi'}, icon(d.info.icon)),
      h('div', {class: 'rtext'}, view ? '' : [open(e.task, d.title), ' · '], h('b', {}, d.head), d.text ? ' · ' : '', h('span', {class: d.mono ? 'cmd' : ''}, d.text),
        d.sub ? h('span', {class: 'sub'}, d.sub) : ''),
      h('span', {class: 'rtime'}, stamp(at(e), m.now))));
  });
}

// The three kinds of review, in the words of land.py.
const KIND = {read: 'one read', round: 'a round with the profiles that fit', full: "the project's full set"};
const reviewLine = r => `round ${r.round}, ${KIND[r.kind] ?? r.kind}: ${r.verdict === 'not reviewed' ? 'not reviewed' : `${r.verdict}, ${r.must_fix} must-fix, ${r.should} should, ${r.nit} nit`}`;

// The reviews of one task's change, each with who answered and what was run or left out, and
// under them what the proposal said: green, or each reason it is not.
function buildReview(t, now) {
  if (!t.reviews.length && !t.proposal) return [keyed('empty', h('div', {class: 'empty'}, 'The review comes after the machine checks, before anything is proposed'))];
  const rows = t.reviews.map((r, k) => keyed(`r:${k}:${r.verdict}`, h('div', {class: `row a-${r.verdict === 'clean' ? 'done' : 'bad'}`},
    h('span', {class: 'fi'}, icon(r.verdict === 'clean' ? 'check' : 'eye')),
    h('div', {class: 'rtext'}, h('b', {}, reviewLine(r)),
      h('span', {class: 'sub'}, r.answered.length ? `answered: ${r.answered.join(', ')}` : 'no source answered', r.silent.map(x => ` · no answer from ${x.name} (${x.why})`).join(''),
        r.ran.length ? ` · ran ${r.ran.map(x => x.name).join(', ')}` : '', r.left_out.length ? ` · left out ${r.left_out.map(x => x.name).join(', ')}` : '', r.tip ? ` · on ${r.tip}` : '')),
    h('span', {class: 'rtime'}, stamp(r.ts, now)))));
  if (t.proposal) rows.push(keyed(`p:${t.proposal.ts}`, h('div', {class: `row a-${t.proposal.green ? 'done' : 'you'}`},
    h('span', {class: 'fi'}, icon(t.proposal.green ? 'check' : 'alert')),
    h('div', {class: 'rtext'}, h('b', {}, t.proposal.green ? 'Proposed: green' : 'Proposed: not green'),
      h('span', {class: 'sub'}, t.proposal.green ? 'the checks passed with the bar where it was, the review left no must-fix, no story changed' : t.proposal.reasons.join(' · '))),
    h('span', {class: 'rtime'}, stamp(t.proposal.ts, now)))));
  return rows;
}

// ---- the board of all tasks ----

function focusOf(m) {
  const t = m.forOwner[0] ?? m.blocked[0] ?? m.landing[0] ?? m.building[0] ?? m.ready[0] ?? m.queued[0] ?? null;
  if (!t) return null;
  const others = (m.forOwner.includes(t) ? m.forOwner : m[t.status] ?? []).length - 1;
  return {t, others};
}

function buildBoardNow(m) {
  const f = focusOf(m);
  if (!f) {
    return keyed('now:idle', h('div', {class: 'still'}, h('div', {class: 'now-in'},
      h('div', {class: 'avatar'}, icon('check')),
      h('div', {class: 'now-body'}, h('div', {class: 'now-eyebrow'}, 'Lem'), h('div', {class: 'now-head'}, m.list.length ? 'Nothing runs' : 'No task was opened yet'),
        h('div', {class: 'now-ctx'}, m.list.length ? 'Every task has landed or was dropped.' : 'Type /lem and an ask in Lem’s session.')))));
  }
  const {t, others} = f;
  const pane = paneOf(t.session);
  // A choice that waits for the owner is the news of its task: its question and its count-down.
  const c = t.asks[0];
  return keyed(`now:${t.slug}:${t.status}:${t.text}:${others}:${pane?.status ?? ''}:${c?.id ?? ''}`, h('div', {class: t.info.live || c ? '' : 'still'},
    h('div', {class: 'now-in'},
      h('div', {class: 'avatar'}, icon(c ? 'help' : t.info.icon)),
      h('div', {class: 'now-body'},
        h('div', {class: 'now-eyebrow'}, c ? `You · choice ${c.id} of the task` : `${t.info.who} · ${t.info.label}`),
        h('div', {class: 'now-head'}, t.title),
        h('div', {class: 'now-status'}, c ? c.what : t.text),
        c ? h('div', {class: 'now-ctx'}, h('b', {}, 'Where you answer: '), answerOf(t, c)) : t.ask ? h('div', {class: 'now-ctx'}, t.ask) : '',
        h('div', {class: 'timer-row'}, h('span', {class: 'timer'}, c && !c.irreversible ? until(c.deadline, 'clock') : live(c ? c.ts : t.since, 'clock')),
          h('span', {class: 'note'}, c ? (c.irreversible ? 'since it was asked; it waits with no end' : `left of the wait, until ${hhmm(c.deadline)}`) : 'in this state',
            others > 0 ? ` · ${plural(others, 'more task')} like it` : '')))),
    h('div', {class: 'now-spacer'}),
    h('div', {class: 'now-next'}, h('span', {class: 'lbl'}, 'Last block'), h('span', {}, h('span', {'data-ago': t.lastTs})),
      h('span', {class: 'right'}, h('button', {class: 'jump', type: 'button', 'data-open': t.slug}, 'Open the task', ' ', icon('arrow'))))));
}

function ring(done, current, total, big, small) {
  const R = 48, C = 2 * Math.PI * R, safe = Math.max(1, total);
  const arc = (cls, from, n) => n > 0 ? s('circle', {class: cls, cx: 58, cy: 58, r: R, 'stroke-dasharray': `${(C * n) / safe} ${C}`, 'stroke-dashoffset': -(C * from) / safe, transform: 'rotate(-90 58 58)'}) : null;
  return h('div', {class: 'ring-wrap'},
    s('svg', {class: 'ring', width: 116, height: 116, viewBox: '0 0 116 116'}, s('circle', {class: 'todo', cx: 58, cy: 58, r: R}), arc('done', 0, done), arc('cur', done, current)),
    h('div', {class: 'ring-center'}, h('b', {}, big), h('span', {}, small)));
}
const stat = (label, value, sub, cls = '') => h('div', {class: `stat ${cls}`, title: sub ?? ''}, h('div', {class: 'sk'}, label), h('div', {class: 'sv'}, value), h('div', {class: 'ss'}, sub ?? ''));

function buildBoardProgress(m) {
  const limit = m.limit ?? '?';
  const n = m.places;
  const notGreen = m.proposed.filter(t => t.proposal && !t.proposal.green).length;
  return keyed(`prog:${n}:${m.building.length}:${limit}:${m.queued.length}:${m.ready.length}:${m.landing.length}:${m.forOwner.length}:${m.landedToday.length}:${m.proposed.length}:${notGreen}:${m.blocked.length}`,
    h('div', {class: 'prog'},
      ring(0, n, typeof limit === 'number' ? limit : Math.max(n, 1), `${n}/${limit}`, 'places'),
      h('div', {},
        h('div', {class: 'now-head'}, n ? `${plural(n, 'place')} taken` : 'No place is taken'),
        h('div', {class: 'dim'}, n ? `${m.building.length} build${m.building.length === 1 ? 's' : ''}, ${m.landing.length} land${m.landing.length === 1 ? 's' : ''}. ` : '',
          typeof limit === 'number' ? `The project lets ${plural(limit, 'task')} build or land at one time (flow.max_tasks).` : 'The limit comes with the first state block.')),
      h('div', {class: 'stats'},
        stat('Waits for you', m.forOwner.length, m.forOwner.length ? 'a choice, the stories, a held decision, a plan, a draft or a merge' : 'nothing', m.forOwner.length ? 'you' : ''),
        stat('Queued', m.queued.length, 'asks that wait for a place'),
        stat('Checks and review', m.ready.length + m.landing.length, m.landing.length ? 'the checks or the review run on one' : 'one branch is checked at a time'),
        stat('Landed today', m.landedToday.length, 'on the base branch', m.landedToday.length ? 'ok' : ''),
        stat('Proposed', m.proposed.length, m.proposed.length ? (notGreen ? `${notGreen} not green` : 'all green') : 'none waits for the merge', notGreen ? 'you' : ''),
        stat('Blocked', m.blocked.length, 'Lem has to settle these', m.blocked.length ? 'bad' : ''))));
}

function taskCard(t) {
  const pane = paneOf(t.session);
  return keyed(`c:${t.slug}`, h('button', {class: `tcard s-${t.status} a-${t.info.actor}`, type: 'button', 'data-open': t.slug, title: 'Open the board of this task'},
    h('div', {class: 'tc-top'}, h('div', {class: 'tc-title'}, t.title), h('div', {class: 'tc-time'}, t.closed ? '' : live(t.since))),
    t.ask ? h('div', {class: 'tc-ask'}, t.ask) : '',
    h('div', {class: 'tc-text'}, `${t.info.label}: ${t.text}`),
    t.waiting.map(c => h('div', {class: 'tc-text'}, t.asks.includes(c) ? `Choice ${c.id} waits for you: ${c.what} · ` : `Choice ${c.id}, its wait is over: ${c.what}`,
      c.irreversible ? 'no end' : t.asks.includes(c) ? until(c.deadline) : '')),
    t.forOwner ? h('div', {class: 'tc-where'}, answerOf(t)) : '',
    t.progress && t.status === 'building' ? h('div', {class: 'mini'}, h('span', {style: `width:${(100 * (t.progress.n - 1)) / t.progress.of}%`}),
      h('span', {class: 'cur', style: `left:${(100 * (t.progress.n - 1)) / t.progress.of}%;width:${100 / t.progress.of}%`})) : '',
    h('div', {class: 'tc-row'}, tags(t), pane?.status ? h('span', {class: 'tag', title: 'The agent status agterm shows for the task’s session'}, icon('cpu'), h('span', {}, `session ${pane.status}`)) : '')));
}

function buildLanes(m) {
  return LANES.map(lane => {
    let tasks = m.list.filter(t => t.lane === lane.key);
    // The task that has waited longest comes first, except where the newest is the news.
    tasks.sort(lane.key === 'done' ? (a, b) => b.since - a.since : (a, b) => (a.status === b.status ? a.since - b.since : Object.keys(STATUS).indexOf(a.status) - Object.keys(STATUS).indexOf(b.status)));
    if (lane.key === 'you') tasks.sort((a, b) => a.ownerRank - b.ownerRank || a.since - b.since);
    if (lane.key === 'checks') tasks.sort((a, b) => (a.status === 'landing' ? -1 : b.status === 'landing' ? 1 : a.since - b.since));
    const hidden = lane.key === 'done' ? Math.max(0, tasks.length - DONE_SHOWN) : 0;
    if (hidden) tasks = tasks.slice(0, DONE_SHOWN);
    return keyed(`lane:${lane.key}`, h('div', {class: `lane a-${lane.actor}`},
      h('div', {class: 'lane-head'}, h('i'), lane.title, h('em', {}, lane.key === 'build' && tasks.some(t => t.status !== 'building')
        ? `${m.building.length} of ${tasks.length}` : tasks.length + hidden)),
      tasks.length ? tasks.map(taskCard).map(c => { phase(c); return c; }) : h('div', {class: 'lane-empty'}, lane.empty),
      hidden ? h('div', {class: 'more'}, `and ${plural(hidden, 'older task')}`) : ''));
  });
}

// ---- the board of one task ----

function buildTaskNow(t) {
  const pane = paneOf(t.session);
  const c = t.asks[0];
  if (c) {
    // A choice for the owner is what this task waits on, while the rest of its plan goes on: its
    // count-down is the timer here.
    return keyed(`now:${t.slug}:choice:${c.id}:${t.asks.length}:${t.status}:${pane?.status ?? ''}`, h('div', {},
      h('div', {class: 'now-in'},
        h('div', {class: 'avatar'}, icon('help')),
        h('div', {class: 'now-body'},
          h('div', {class: 'now-eyebrow'}, 'You act'),
          h('div', {class: 'now-head'}, t.asks.length > 1 ? `${t.asks.length} choices wait for you` : `Choice ${c.id} waits for you`),
          h('div', {class: 'now-status'}, c.what),
          h('div', {class: 'now-ctx'}, `recommended: ${c.recommended} · ${STATUS[t.status]?.label ?? t.status}: ${t.text}`),
          h('div', {class: 'now-ctx'}, h('b', {}, 'Where you answer: '), answerOf(t)),
          h('div', {class: 'timer-row'}, h('span', {class: 'timer'}, c.irreversible ? live(c.ts, 'clock') : until(c.deadline, 'clock')),
            h('span', {class: 'note'}, c.irreversible ? `since it was asked · it waits for your answer, with no end: ${IRREVERSIBLE[c.irreversible] ?? c.irreversible}`
              : `left of the wait, until ${hhmm(c.deadline)}; then the lead takes the recommended action`)))),
      h('div', {class: 'now-spacer'}),
      h('div', {class: 'now-next'}, h('span', {class: 'lbl'}, 'Last block'), h('span', {}, h('span', {'data-ago': t.lastTs})),
        pane?.status ? h('span', {}, `· the session is ${pane.status}`) : '',
        pane ? h('span', {class: 'right'}, jump(pane.id, 'Go to the session')) : '')));
  }
  const head = {
    queued: 'Waits for a free place', building: t.lead === 'session' ? 'Its session builds it' : 'Its builder builds it', planned: t.forOwner ? 'The plan waits for you' : 'The plan waits for a session',
    held: t.storiesWait ? 'The stories wait for your yes' : 'Waits for you', blocked: 'The lead stopped; Lem has to settle it', ready: 'Waits for its checks', landing: 'The checks and the review run on it', open: 'Proposed: it waits for the merge', landed: 'Landed', drafted: 'A night draft waits for your word', dropped: 'Dropped',
  }[t.status] ?? `Status "${t.status}"`;
  return keyed(`now:${t.slug}:${t.status}:${t.text}:${t.lastTs}:${pane?.status ?? ''}`, h('div', {class: t.info.live ? '' : 'still'},
    h('div', {class: 'now-in'},
      h('div', {class: 'avatar'}, icon(t.info.icon)),
      h('div', {class: 'now-body'},
        h('div', {class: 'now-eyebrow'}, t.info.who === 'You' ? 'You act' : t.info.who === 'Nobody' ? 'Closed' : `${t.info.who} acts`),
        h('div', {class: 'now-head'}, head),
        h('div', {class: 'now-status'}, t.text),
        t.blocks.at(-1).lines.length ? h('div', {class: 'now-ctx'}, t.blocks.at(-1).lines.join(' · ')) : '',
        t.forOwner ? h('div', {class: 'now-ctx'}, h('b', {}, 'Where you answer: '), answerOf(t)) : '',
        h('div', {class: 'timer-row'}, h('span', {class: 'timer'}, t.closed ? stamp(t.since, Date.now()) : live(t.since, 'clock')),
          h('span', {class: 'note'}, t.closed ? `after ${span(t.since - t.first)}` : 'in this state')))),
    h('div', {class: 'now-spacer'}),
    h('div', {class: 'now-next'}, h('span', {class: 'lbl'}, 'Last block'), h('span', {}, h('span', {'data-ago': t.lastTs})),
      pane?.status ? h('span', {}, `· the session is ${pane.status}`) : '',
      pane ? h('span', {class: 'right'}, jump(pane.id, 'Go to the session')) : '')));
}

// The step of the flow the task reached: the stories, the plan, the build, the machine checks, the
// review, the pull request. A task that waits for the owner or is blocked stays where it got to.
function phaseIndex(t) {
  const reached = t.reached;
  if (reached === 'landed') return PHASES.length;
  if (reached === 'open') return 5;
  if (reached === 'landing') return t.reviews.length ? 4 : 3;
  if (reached === 'ready') return 3;
  if (reached === 'building') return t.planCommitted || t.progress ? 2 : 1;
  if (reached === 'planned' || reached === 'drafted') return 1;
  return 0;
}

function buildTaskProgress(t) {
  const at_ = phaseIndex(t);
  const p = t.progress;
  const done = ['landed', 'ready', 'landing', 'open'].includes(t.reached);
  const total = p?.of ?? 0, finished = done ? total : Math.max(0, (p?.n ?? 1) - 1), current = !done && p && t.status === 'building' ? 1 : 0;
  const review = t.reviews.at(-1);
  const sub = k => (k === 2 && p ? `task ${done ? p.of : p.n} of ${p.of}` : k === 3 && t.gates.length ? (t.gateBad ? `${t.gateBad} red` : `${t.gates.length} green`)
    : k === 4 && review ? review.verdict : k === 5 && t.proposal ? (t.proposal.green ? 'green' : 'not green') : '');
  const taken = t.choices.filter(d => d.state !== 'waits').length, timeouts = t.choices.filter(d => d.state === 'timeout').length;
  return keyed(`prog:${t.slug}:${at_}:${p?.n}:${p?.of}:${t.status}:${t.gates.length}:${t.gateBad}:${t.reviews.map(r => r.verdict).join()}:${t.proposal?.green}:${t.commit?.head}:${t.asks.length}:${taken}:${timeouts}`,
    h('div', {class: 'prog'},
      ring(finished, current, total || 1, total ? `${finished}/${total}` : '–', 'plan tasks'),
      h('div', {class: `phases a-${t.info.actor}`}, PHASES.map((name, k) => h('div', {class: `phase ${k < at_ ? 'past' : k === at_ ? 'cur' : ''}`}, h('i'), name, h('small', {}, sub(k))))),
      h('div', {class: 'stats'},
        stat('Lead', t.lead ?? '–', t.lead === 'session' ? 'a session with a reviewer' : t.lead === 'builder' ? 'one builder plans and builds' : 'no lead was started yet'),
        stat('Last commit', t.commit?.head ?? '–', t.commit ? t.commit.subject : 'no commit on its branch yet'),
        stat('Open for', t.closed ? span(t.since - t.first) : live(t.first), `first block ${stamp(t.first, Date.now())}`),
        stat('Gate', t.gates.length ? (t.gateBad ? 'red' : 'green') : '–', t.gates.length ? `${plural(t.gates.length, 'command')} in the last run` : 'it runs at the landing', t.gates.length ? (t.gateBad ? 'bad' : 'ok') : ''),
        stat('Review', review ? review.verdict : '–', review ? `round ${review.round}, ${KIND[review.kind] ?? review.kind}` : 'after the checks, before the proposal', review ? (review.verdict === 'clean' ? 'ok' : 'bad') : ''),
        stat('Decisions', t.asks.length ? `${t.asks.length} wait${t.asks.length === 1 ? 's' : ''}` : taken, t.choices.length ? `${taken} taken${timeouts ? `, ${timeouts} by the timeout` : ''}` : 'none yet',
          t.asks.length ? 'you' : timeouts ? 'bad' : ''))));
}

function buildStates(t, now) {
  return t.blocks.map((b, k) => ({b, k})).reverse().map(({b, k}) => {
    const info = STATUS[b.status] ?? UNKNOWN;
    const next = t.blocks[k + 1]?.ts;
    return keyed(`s:${k}:${next ?? 'open'}`, h('div', {class: `row a-${info.actor}`},
      h('span', {class: 'fi'}, icon(info.icon)),
      h('div', {class: 'rtext'}, h('b', {}, info.label), ' · ', b.text, b.lines.length ? h('span', {class: 'sub'}, b.lines.join(' · ')) : ''),
      h('span', {class: 'rtime'}, stamp(b.ts, now), h('br'), next ? span(next - b.ts) : t.closed ? '' : live(b.ts))));
  });
}

function buildGate(t, now) {
  if (!t.gates.length) return [keyed('empty', h('div', {class: 'empty'}, 'The gate runs when the task takes the landing line'))];
  return t.gates.map((g, k) => keyed(`g:${k}:${g.exit}`, h('div', {class: `row a-${g.exit === 0 ? 'done' : 'bad'}`},
    h('span', {class: 'fi'}, icon(g.exit === 0 ? 'check' : 'alert')),
    h('div', {class: 'rtext'}, h('b', {}, g.exit === 0 ? 'green' : `exit ${g.exit}`), ' · ', h('span', {class: 'cmd'}, g.command ?? ''),
      h('span', {class: 'sub cmd'}, g.last ?? '', g.tip ? ` · on ${g.tip}` : '')),
    h('span', {class: 'rtime'}, stamp(g.ts, now)))));
}

// The stories are the owner's document: each as the lead wrote it, with the tests that hold it and
// what the last check of those tests gave. A word stands beside each mark, never a color alone.
function buildStories(t, now) {
  const head = storiesHead(t, now);
  const approved = t.approvals.at(-1);
  if (!t.stories && approved) {
    // approved before the lead wrote the plan: the stories as he approved them, with no tests yet
    return [...head, ...approved.stories.map(st => keyed(`story:${st.n}:approved:${st.text.length}`, h('div', {class: 'row a-quiet'},
      h('span', {class: 'fi'}, icon('file')),
      h('div', {class: 'rtext'}, h('b', {}, `${st.n}. `), st.text, h('span', {class: 'sub'}, 'no test yet: the lead adds its tests in the plan')),
      h('span', {class: 'rtime'}, ''))))];
  }
  if (!t.stories) return head.length ? head : [keyed('empty', h('div', {class: 'empty'}, 'The lead writes the stories at the top of the plan'))];
  return [...head, ...storyRows(t)];
}

// What happened to the stories before the build: his approval, or Lem's in his name for a
// correction, and the personas' read, with a split between the model families said first. Then
// each change of an approved story during the build, from its own record.
function storiesHead(t, now) {
  const rows = [];
  const a = t.approvals.at(-1), r = t.reads.at(-1);
  const kind = t.stories?.kind ?? a?.kind;
  if (r) {
    const doubt = r.split || r.flagged > 0;
    const stale = a && r.digest && a.digest && r.digest !== a.digest;
    rows.push(keyed(`read:${r.ts}:${stale}`, h('div', {class: `row a-${doubt ? 'you' : 'done'}`},
      h('span', {class: 'fi'}, icon('users')),
      h('div', {class: 'rtext'},
        r.split ? h('b', {}, 'The two model families split on a story. ') : '',
        h('b', {}, r.flagged ? `${r.flagged} of ${plural(r.stories, 'story').replace('storys', 'stories')} flagged` : 'Nobody confused'),
        ` · read by ${r.answered} of ${r.asked} personas, ${FAMILIES[r.families.length] ?? `${r.families.length} model families`} (${r.families.join(', ')}), run by ${r.by === 'lead' ? 'the lead' : 'Lem'}`,
        r.silent.map(x => h('span', {class: 'sub'}, `no answer from ${x.name} (${x.why})`)),
        stale ? h('span', {class: 'sub'}, 'The stories read are not the ones approved: the change after the read was not read.') : ''),
      h('span', {class: 'rtime'}, stamp(r.ts, now)))));
  } else if (kind === 'correction') {
    rows.push(keyed('read:none:correction', h('div', {class: 'row a-quiet'}, h('span', {class: 'fi'}, icon('users')),
      h('div', {class: 'rtext'}, 'The personas do not read a correction’s one story.'), h('span', {class: 'rtime'}, ''))));
  } else if (kind) {
    rows.push(keyed('read:none', h('div', {class: 'row a-quiet'}, h('span', {class: 'fi'}, icon('users')),
      h('div', {class: 'rtext'}, 'The personas have not read these stories yet.'), h('span', {class: 'rtime'}, ''))));
  }
  if (a) {
    const yours = a.by === 'owner';
    rows.push(keyed(`approved:${a.ts}:${a.by}`, h('div', {class: `row a-${yours ? 'done' : 'quiet'}`},
      h('span', {class: 'fi'}, icon(yours ? 'check' : 'user')),
