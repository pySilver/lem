<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lem board</title>
<link rel="stylesheet" href="lem.css">
<style>
  .top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; border: 1px solid var(--line); background: var(--card); color: var(--ink); white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.live i { animation: ping 2s ease-out infinite; }
  .pill span { color: var(--fg); }
  .jump {
    appearance: none; font-size: 12px; font-weight: 600; color: var(--fg); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 8px;
    background: color-mix(in srgb, var(--fg) 7%, transparent); border: 1px solid var(--line-strong);
  }
  .jump:hover { background: color-mix(in srgb, var(--fg) 13%, transparent); }
  .jump .ic { width: 13px; height: 13px; }
  .jump.back .ic { transform: rotate(180deg); }

  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; border: 1px solid; font-weight: 550; }
  .banner .ic { width: 16px; height: 16px; }
  .banner.attention { color: color-mix(in srgb, var(--you) 58%, var(--fg)); border-color: color-mix(in srgb, var(--you) 60%, transparent); background: color-mix(in srgb, var(--you) 14%, transparent); }
  .banner.problem { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); border-color: color-mix(in srgb, var(--bad) 65%, transparent); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .banner span { color: var(--fg); flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .banner .sub { color: var(--dim); font-weight: 400; }
  .banner .where { display: block; }
  .banner.demo { color: var(--fg); border-style: dashed; border-color: var(--line-strong); background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--fg) 7%, transparent) 0 12px, transparent 12px 24px); }
  .tc-where { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .banners { display: flex; flex-direction: column; gap: 8px; }
  .banners:empty { display: none; }

  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 12px; }
  h2 { margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }

  .hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  @media (max-width: 1080px) { .hero, .cols { grid-template-columns: minmax(0, 1fr); } }

  /* now */
  .now { overflow: hidden; border-color: color-mix(in srgb, var(--actor) 38%, var(--line)); display: flex; flex-direction: column; }
  .now > div { flex: 1; display: flex; flex-direction: column; }
  .now::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 160% at 0% 0%, color-mix(in srgb, var(--actor) 15%, transparent), transparent 58%);
  }
  .now.a-you, .now.a-bad { background: color-mix(in srgb, var(--actor) 7%, var(--card)); }
  .now-in { position: relative; display: flex; gap: 18px; align-items: flex-start; }
  .avatar {
    width: 58px; height: 58px; border-radius: 17px; flex: none; display: grid; place-items: center;
    color: var(--ink); background: color-mix(in srgb, var(--actor) 20%, transparent);
    border: 1px solid color-mix(in srgb, var(--actor) 48%, transparent);
    animation: halo 2s ease-out infinite;
  }
  .avatar .ic { width: 27px; height: 27px; }
  .still .avatar { animation: none; }
  .now-body { min-width: 0; flex: 1; }
  .now-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink); }
  .now-head { font-size: 19px; line-height: 1.3; font-weight: 680; margin-top: 2px; overflow-wrap: anywhere; }
  .now-status { margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
  .now-ctx { margin-top: 3px; color: var(--dim); overflow-wrap: anywhere; }
  .timer-row { display: flex; align-items: baseline; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .timer { font: 680 42px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .a-you .timer, .a-bad .timer { color: var(--ink); }
  .note { font-size: 12px; color: var(--dim); }
  .now-next { position: relative; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  .now-next .lbl { font-size: 10.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  .now-next .right { margin-left: auto; }
  .now-spacer { height: 16px; }

  /* progress */
  .prog { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 20px; align-items: center; }
  .ring-wrap { position: relative; width: 116px; height: 116px; }
  .ring { display: block; }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .done { stroke: var(--ok); }
  .ring .cur { stroke: var(--lead); animation: breathe 2s ease-in-out infinite; }
  .ring .todo { stroke: color-mix(in srgb, var(--fg) 12%, transparent); }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-center b { font: 700 25px/1 var(--mono); letter-spacing: -.03em; }
  .ring-center span { font-size: 10.5px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
  .phases { display: flex; align-items: flex-start; }
  .phase { flex: 1; min-width: 0; position: relative; padding-top: 20px; font-size: 11.5px; color: var(--faint); }
  .phase::before { content: ""; position: absolute; top: 6px; left: 14px; right: 0; height: 2px; background: var(--line); }
  .phase:last-child { flex: 0 0 auto; }
  .phase:last-child::before { display: none; }
  .phase i { position: absolute; top: 0; left: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--card); }
  .phase.past { color: var(--dim); } .phase.past::before { background: color-mix(in srgb, var(--ok) 60%, transparent); }
  .phase.past i { background: var(--ok); border-color: var(--ok); }
  .phase.cur { color: var(--fg); font-weight: 600; }
  .phase.cur i { border-color: var(--actor); background: color-mix(in srgb, var(--actor) 35%, var(--card)); animation: halo 2s ease-out infinite; }
  .phase small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
  .stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .stat { min-width: 0; }
  .stat .sk { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 650; }
  .stat .sv { font: 650 16px/1.3 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 1px; }
  .stat .ss { font-size: 11px; line-height: 1.35; color: var(--dim); }
  .stat.ok .sv { color: color-mix(in srgb, var(--ok) 58%, var(--fg)); } .stat.you .sv { color: color-mix(in srgb, var(--you) 58%, var(--fg)); } .stat.bad .sv { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); }

  /* timeline */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; background: var(--actor); }
  .tl-svg { display: block; overflow: visible; }
  .tl-svg .lane-label { font: 550 11.5px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; fill: var(--dim); }
  .tl-svg .track { fill: color-mix(in srgb, var(--fg) 4%, transparent); }
  .tl-svg .grid { stroke: var(--line); stroke-dasharray: 2 4; }
  .tl-svg .axis { font: 10.5px var(--mono); fill: var(--dim); }
  .tl-svg .seg { fill: var(--actor); }
  .tl-svg .seg.s-queued { fill: color-mix(in srgb, var(--quiet) 45%, transparent); }
  .tl-svg .seg.s-ready { fill: color-mix(in srgb, var(--gate) 45%, transparent); }
  .tl-svg .seg.live { animation: breathe 2s ease-in-out infinite; }
  .tl-svg .end { fill: var(--actor); stroke: var(--card); stroke-width: 1.5; }
  .tl-svg .nowline { stroke: var(--line-strong); stroke-width: 1.5; }
  .tl-svg a { cursor: pointer; }
  .tl-empty, .empty { padding: 22px 0; text-align: center; color: var(--faint); }

  /* the board's columns */
  .lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 1180px) { .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .lanes { grid-template-columns: minmax(0, 1fr); } }
  .lane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lane-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
  .lane-head i { width: 8px; height: 8px; border-radius: 3px; background: var(--actor); }
  .lane-head em { margin-left: auto; font: 600 11.5px var(--mono); font-style: normal; letter-spacing: 0; color: var(--fg); }
  .lane-empty { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 18px 14px; text-align: center; color: var(--faint); font-size: 12px; }
  .tcard {
    appearance: none; text-align: left; cursor: pointer; width: 100%; display: flex; flex-direction: column; gap: 8px;
    background: var(--card); border: 1px solid color-mix(in srgb, var(--actor) 30%, var(--line)); border-radius: 14px; padding: 13px 14px 12px;
    position: relative; overflow: hidden;
  }
  .tcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--actor); }
  .tcard:hover { background: var(--card-hi); }
  .tcard.s-queued, .tcard.s-dropped { border-style: dashed; }
  .tcard.s-queued::before, .tcard.s-dropped::before { background: transparent; }
  .tcard.s-dropped .tc-title { color: var(--faint); text-decoration: line-through; }
  .tc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tc-title { font-weight: 640; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; min-width: 0; }
  .tc-time { flex: none; font: 12px var(--mono); color: var(--dim); white-space: nowrap; padding-top: 1px; }
  .tc-ask { color: var(--dim); font-size: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .tc-text { font-size: 12.5px; color: var(--ink); font-weight: 560; overflow-wrap: anywhere; }
  .tc-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    --c: var(--quiet);
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 11.5px; max-width: 100%;
    background: color-mix(in srgb, var(--c) 11%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag .ic { width: 12px; height: 12px; color: color-mix(in srgb, var(--c) 58%, var(--fg)); }
  .tag.c-lead { --c: var(--lead); } .tag.c-ok { --c: var(--ok); } .tag.c-bad { --c: var(--bad); } .tag.c-gate { --c: var(--gate); } .tag.c-you { --c: var(--you); } .tag.c-lem { --c: var(--lem); }
  .tag.live {
    border-color: var(--c);
    background-image: linear-gradient(45deg,
      color-mix(in srgb, var(--c) 24%, transparent) 25%, color-mix(in srgb, var(--c) 9%, transparent) 25%,
      color-mix(in srgb, var(--c) 9%, transparent) 50%, color-mix(in srgb, var(--c) 24%, transparent) 50%,
      color-mix(in srgb, var(--c) 24%, transparent) 75%, color-mix(in srgb, var(--c) 9%, transparent) 75%);
    background-size: 20px 20px;
    animation: stripes 1s linear infinite;
  }
  .tag span { overflow: hidden; text-overflow: ellipsis; }
  .mini { position: relative; height: 5px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--fg) 6%, transparent); }
  .mini span { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ok); border-radius: 3px; }
  .mini span.cur { background: var(--lead); animation: breathe 2s ease-in-out infinite; }
  .more { padding: 0 4px; font-size: 12px; color: var(--faint); }

  /* lists: state blocks, gate commands, review items, activity */
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 6px 0; position: relative; }
  .row + .row { border-top: 1px solid var(--line); }
  .fi { position: relative; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: var(--ink); background: color-mix(in srgb, var(--actor) 18%, var(--card)); border: 1px solid color-mix(in srgb, var(--actor) 32%, transparent); }
  .fi .ic { width: 12px; height: 12px; }
  .rtext { font-size: 12.5px; line-height: 1.4; padding-top: 3px; min-width: 0; overflow-wrap: anywhere; }
  .rtext b { color: var(--ink); }
  .rtext .sub { display: block; color: var(--dim); }
  .rtext .cmd { font-family: var(--mono); font-size: 11.5px; }
  .rtime { font: 11px var(--mono); color: var(--dim); white-space: nowrap; padding-top: 5px; text-align: right; }
  .rlink { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 2px; }
  .feed { max-height: 460px; overflow: auto; margin: 0 -10px; padding: 0 10px; }

  .foot { display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); }
  .foot .error { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); font-weight: 600; }

  /* the two tabs, and the backlog */
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); padding: 0 2px; }
  .tab {
    appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 8px; font-size: 13px; font-weight: 600; color: var(--dim);
  }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--you); }
  .tab em { font: 600 11.5px var(--mono); font-style: normal; color: var(--dim); }
  kbd { font: 600 10.5px var(--mono); padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--dim); background: var(--card); }
  .backlog { display: flex; flex-direction: column; gap: 14px; }
  .bl-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .bl-bar input {
    flex: 1 1 260px; min-width: 0; font: inherit; color: var(--fg); padding: 7px 11px; border-radius: 9px;
    background: var(--card); border: 1px solid var(--line-strong);
  }
  .bl-bar input:focus-visible { outline: 2px solid var(--gate); outline-offset: 1px; }
  .bl-group { display: flex; flex-direction: column; gap: 8px; }
  .bl-group.recessive .bl-item { border-style: dashed; }
  .bl-group.recessive .bl-title { color: var(--dim); }
  .bl-item { background: var(--card); border: 1px solid color-mix(in srgb, var(--actor) 26%, var(--line)); border-radius: 12px; overflow: hidden; }
  .bl-item.cur { box-shadow: 0 0 0 2px color-mix(in srgb, var(--gate) 70%, transparent); }
  .bl-head { appearance: none; background: none; border: 0; width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 14px; }
  .bl-head:hover { background: var(--card-hi); }
  .bl-title { font-weight: 640; font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .bl-where { grid-column: 1; font: 12px var(--mono); color: var(--dim); overflow-wrap: anywhere; }
  .bl-where.stale { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); display: flex; align-items: center; gap: 6px; }
  .bl-side { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 5px; max-width: 46ch; }
  .bl-body { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
  .bl-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55; max-width: 96ch; }
  .bl-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 12.5px; }
  .bl-actions code { font: 12px var(--mono); padding: 2px 7px; border-radius: 6px; background: var(--card-hi); border: 1px solid var(--line); overflow-wrap: anywhere; }
  .bl-actions .go { border-color: color-mix(in srgb, var(--you) 60%, transparent); background: color-mix(in srgb, var(--you) 14%, transparent); }
  .bl-note { color: var(--dim); }
  .bl-note.bad { color: color-mix(in srgb, var(--bad) 58%, var(--fg)); }
</style>
</head>
<body>
<main class="page" id="page">
  <div id="banners" class="banners"></div>
  <header class="top">
    <div class="ident">
      <div class="mark">
<!-- lem-mark: a copy of assets/lem-mark.svg; tests/test-lem.sh fails when the two differ -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="8 2 244 244" role="img" aria-labelledby="c2m-title c2m-desc">
<title id="c2m-title">Lem</title>
<desc id="c2m-desc">A tall hooded coat with nothing in its hood stands in a cut field and holds one long line in both hands. Strands hang from the line to four smaller hooded figures.</desc>
<defs>
  <linearGradient id="c2m-sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b5c5c0"/><stop offset="1" stop-color="#eadfbe"/></linearGradient>
  <linearGradient id="c2m-field" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#c7a95a"/><stop offset="1" stop-color="#ddbe6c"/></linearGradient>
  <clipPath id="c2m-clip"><rect x="9.5" y="3.5" width="241" height="241" rx="21"/></clipPath>
</defs>
<rect x="8.75" y="2.75" width="242.5" height="242.5" rx="22" fill="#eadfbe" stroke="#77725a" stroke-width="1.5" stroke-opacity=".7"/>
<g clip-path="url(#c2m-clip)">

  <!-- long shadows fall toward the viewer -->

  <path d="M219 204L233 204L217 216L201 216Z" fill="#6a7559" opacity=".6"/>

  <!-- the coat -->
  <path d="M117 72L105 86L109 112L100 228L111 231L121 228L130 231L140 228L150 231L160 228L151 112L155 86L143 72L130 83Z" fill="#8b9385"/>

  <path d="M130 97L130.500 230" fill="none" stroke="#3d514b" stroke-width="1.200"/>

  <g fill="#e9dfbc"><circle cx="133.500" cy="140" r="1.300"/><circle cx="133.700" cy="164" r="1.300"/><circle cx="134" cy="188" r="1.300"/></g>
  <path d="M118.500 120L113 226M141.500 120L147.500 226M117.500 74L116 108M142.500 74L144 108" fill="none" stroke="#dedbc0" stroke-width=".9" opacity=".7"/>

  <!-- the cowl, with nothing in it -->
  <path d="M131 12C121 16 113 32 113 52C113 60 114 66 117 72L130 83L143 72C146 65 147 58 146.500 50C146 33 140 18 131 12Z" fill="#9da291"/>
  <path d="M131 12C140 18 146 33 146.500 50C147 58 146 65 143 72L130 83L132 46Z" fill="#6e7d74"/>
  <path d="M130.500 23C123.500 28 119.500 40 119.500 52C119.500 58 121 63 124 67L130 73L136.500 67C139.500 62 141 57 140.500 50C140 39 136.500 28 130.500 23Z" fill="#132427"/>

    // "since" is when the task entered the status it has now, not when its newest block was written.
    let i = t.blocks.length - 1;
    while (i > 0 && t.blocks[i - 1].status === t.status) i--;
    t.since = t.blocks[i].ts;
    t.first = t.blocks[0].ts;
    t.closed = t.status === 'landed' || t.status === 'dropped';
    // A planned task waits for the owner only when its lead said the owner reads the plan.
    t.forOwner = t.status === 'held' || t.status === 'drafted' || (t.status === 'planned' && /\bowner\b/.test(t.text));
    if (t.status === 'planned' && t.forOwner) t.info = {...t.info, actor: 'you', who: 'You'};
    t.lane = t.forOwner ? 'you' : t.closed ? 'done' : t.status === 'ready' || t.status === 'landing' ? 'land' : 'build';
    t.segments = [];
    for (const [k, b] of t.blocks.entries()) {
      const end = t.blocks[k + 1]?.ts ?? (t.closed ? b.ts : now);
      const prev = t.segments.at(-1);
      if (prev && prev.status === b.status) prev.end = end;
      else t.segments.push({status: b.status, start: b.ts, end, open: k === t.blocks.length - 1 && !t.closed});
    }
    // Where the task got to: the newest status that is a step forward. A task that waits for the
    // owner or is blocked stays at the phase it reached.
    t.reached = t.blocks.findLast(b => !['held', 'blocked'].includes(b.status))?.status ?? t.status;
    t.planCommitted = t.blocks.some(b => b.status === 'planned' || b.status === 'drafted' || /\bplan committed\b/.test([b.text, ...b.lines].join(' ')));
    t.gateBad = t.gates.filter(g => g.exit !== 0).length;
  }

  const items = new Map();
  for (const r of reviews) items.set(r.id, {...(items.get(r.id) ?? {}), ...r});
  const open = [...items.values()].filter(r => r.outcome == null)
    .map(r => ({...r, added_ms: new Date(r.added).getTime()}))
    // review_queue.py compares UTC dates; the page must give the same answer near midnight.
    .map(r => ({...r, due: r.risk !== 'high' ? 'when the day allows' : new Date(r.added_ms).toISOString().slice(0, 10) === new Date(now).toISOString().slice(0, 10) ? 'today' : 'overdue'}))
    .sort((a, b) => (a.risk === b.risk ? a.added_ms - b.added_ms : a.risk === 'high' ? -1 : 1));
  const closed = [...items.values()].filter(r => r.outcome != null);
  for (const t of list) t.review = [...items.values()].filter(r => r.slug === t.slug);

  const by = status => list.filter(t => t.status === status).sort((a, b) => a.since - b.since);
  const m = {
    now, list, limit, open, closed,
    building: by('building'), queued: by('queued'), ready: by('ready'), landing: by('landing'), blocked: by('blocked'),
    // A held decision stops work, a plan and a night draft only wait: in that order, the oldest first.
    forOwner: list.filter(t => t.forOwner).sort((a, b) => OWNER_ORDER.indexOf(a.status) - OWNER_ORDER.indexOf(b.status) || a.since - b.since),
    landedToday: list.filter(t => t.status === 'landed' && dayKey(t.since) === dayKey(now)),
    due: open.filter(r => r.due !== 'when the day allows'),
    // What project.py may-start counts: a task that builds, and the one the gate runs on.
    places: list.filter(t => t.status === 'building' || t.status === 'landing').length,
    unknown: list.filter(t => !STATUS[t.status]),
    task: view ? tasks.get(view) ?? null : null,
  };
  return m;
}

// ---- blocks shared by both views ----

const jump = (target, label) => h('button', {class: 'jump', type: 'button', 'data-jump': target}, label, ' ', icon('arrow'));
const open = (slug, ...kids) => h('button', {class: 'rlink', type: 'button', 'data-open': slug}, ...kids);

function paneOf(id) {
  if (!id || !sessions) return null;
  return sessions.find(x => x.id.toUpperCase() === id.toUpperCase() || x.id.toUpperCase().startsWith(id.toUpperCase()) || x.name === id) ?? null;
}

function statusPill(t) {

}

function tags(t) {

    icon(t.lead === 'session' ? 'split' : 'code'), h('span', {}, t.lead === 'session' ? 'session' : 'builder')));
  if (t.progress && t.status === 'building') out.push(h('span', {class: 'tag', title: 'The task of the plan the lead is on'}, icon('layers'), h('span', {}, `task ${t.progress.n} of ${t.progress.of}`)));
  if (t.commit) out.push(h('span', {class: 'tag mono', title: `${t.commit.head} ${t.commit.subject}${t.branch ? ` · ${t.branch}` : ''}`}, icon('commit'), h('span', {}, `${t.commit.head} ${t.commit.subject}`)));
  if (t.stories) out.push(h('span', {class: 'tag', title: t.stories.list.map(st => `${st.n}. ${st.text}`).join('\n')}, icon('file'),
    h('span', {}, t.stories.kind === 'correction' ? 'a correction: 1 story' : plural(t.stories.list.length, 'story').replace('storys', 'stories'))));
  if (t.gates.length) out.push(h('span', {class: `tag ${t.gateBad ? 'c-bad' : 'c-ok'}`, title: t.gates.map(g => `${g.exit === 0 ? 'green' : `exit ${g.exit}`}  ${g.command}  ${g.last ?? ''}`).join('\n')},

      icon('eye'), h('span', {}, closed ? `review: ${r.outcome}` : `review ${r.risk}, open`)));

  return out;

// Where the owner answers what waits for them. Lem is the one voice to the owner, so the answer is
// always given in Lem's session; what differs is what the owner does there.
function answerOf(t) {
  if (t.status === 'held' && /\bowner lands\b/.test(t.text)) return 'Land the branch, then tell Lem in its session that it landed.';
  if (t.status === 'held') return 'Lem puts this question to you in its session, as a page. Answer it there.';
  if (t.status === 'planned') return 'Read the plan, then tell Lem in its session: build it or drop it.';
  return `Tell Lem in its session: /lem build ${t.slug}, or drop it.`;
}
const toLem = () => { const lem = paneOf(meta.session); return lem ? jump(lem.id, 'Go to Lem') : null; };

function buildTimeline(m, tasks, width) {
  const rows = tasks.filter(t => t.segments.length);
  if (!rows.length) return keyed('tl', h('div', {class: 'tl-empty'}, 'A lane appears with a task’s first state block'));
  const padL = view ? 14 : Math.min(230, Math.max(120, Math.round(width * 0.2))), padR = 14, rowH = 26, top = 6;
  const t0 = Math.min(...rows.map(t => t.first));
  // Drawn to a coarser clock than the page's, so the markup holds still between steps. When every
  // task shown is closed, the axis ends at the last block: time after that is nobody's.
  const anyOpen = rows.some(t => !t.closed);
  const coarse = anyOpen ? Math.ceil(m.now / 15000) * 15000 : Math.max(...rows.map(t => t.lastTs));
  const span0 = niceCeil(Math.max(60000, coarse - t0));
  const W = Math.max(320, width), H = top + rows.length * rowH + 22;
  const x = ms => padL + ((W - padL - padR) * Math.min(span0, Math.max(0, ms - t0))) / span0;
  const svg = s('svg', {class: 'tl-svg', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'What each task waited on, over time'});
  const steps = 6;
  for (let i = 0; i <= steps; i++) {
    const ms = t0 + (span0 * i) / steps, gx = x(ms);
    svg.append(s('line', {class: 'grid', x1: gx, x2: gx, y1: top, y2: H - 20}));
    svg.append(s('text', {class: 'axis', x: gx, y: H - 6, 'text-anchor': i === 0 ? 'start' : i === steps ? 'end' : 'middle'}, stamp(ms, m.now)));
  }
  rows.forEach((t, r) => {
    const y = top + r * rowH;
    const label = t.title.length > 30 ? `${t.title.slice(0, 29)}…` : t.title;
    if (!view) svg.append(s('a', {'data-open': t.slug}, s('text', {class: 'lane-label', x: 0, y: y + 15}, label, s('title', {}, t.title))));
    svg.append(s('rect', {class: 'track', x: padL, y: y + 5, width: W - padL - padR, height: 14, rx: 4}));
    for (const g of t.segments) {
      const info = STATUS[g.status] ?? UNKNOWN;
      const x1 = x(g.start), x2 = x(g.open ? coarse : g.end);
      if (g.end === g.start && !g.open) {
        svg.append(s('circle', {class: `end a-${info.actor}`, cx: x1, cy: y + 12, r: 5}, s('title', {}, `${info.label} at ${stamp(g.start, m.now)}`)));
        continue;
      }
      svg.append(s('rect', {class: `seg s-${g.status} a-${info.actor}${g.open && info.live ? ' live' : ''}`, x: x1, y: y + 5, width: Math.max(2, x2 - x1), height: 14, rx: 4},
        s('title', {}, `${info.label} · ${info.who} · ${stamp(g.start, m.now)} to ${g.open ? 'now' : stamp(g.end, m.now)} · ${span((g.open ? m.now : g.end) - g.start)}`)));
    }
  });
  if (anyOpen && coarse - t0 <= span0) svg.append(s('line', {class: 'nowline', x1: x(coarse), x2: x(coarse), y1: top, y2: H - 20}));
  return keyed('tl', h('div', {}, svg));
}

function buildLegend(m, tasks) {
  const total = new Map();
  for (const t of tasks) for (const g of t.segments) total.set(g.status, (total.get(g.status) ?? 0) + (g.open ? m.now : g.end) - g.start);
  return Object.keys(STATUS).filter(k => total.get(k) > 0).map(k => keyed(`lg:${k}`, h('span', {class: `a-${STATUS[k].actor}`, title: `${STATUS[k].who} acts`}, h('i'), STATUS[k].label)));
}

function describe(e, m) {
  const title = titleOf(e.task);
  if (e.event === 'task.state') {
    const info = STATUS[e.status] ?? UNKNOWN;
    return {info, head: info.label, text: e.text, sub: (e.lines ?? []).join(' · '), title};
  }
  if (e.event === 'gate') {
    const ok = e.exit === 0;
    return {info: {actor: ok ? 'done' : 'bad', icon: ok ? 'check' : 'alert'}, head: ok ? 'Gate green' : `Gate red, exit ${e.exit}`, text: e.command, sub: e.last ?? '', title, mono: true};
  }
  const rest = Object.entries(e).filter(([k]) => !['ts', 'event', 'task'].includes(k)).map(([k, v]) => `${k} ${typeof v === 'string' ? v : JSON.stringify(v)}`).join(' · ');
  return {info: {actor: 'quiet', icon: 'dot'}, head: e.event, text: rest, sub: '', title};
}

function buildFeed(m, list) {
  if (!list.length) return [keyed('empty', h('div', {class: 'empty'}, 'No events yet'))];
  return list.slice(-200).reverse().map((e, i) => {

    return keyed(`f:${e.ts}:${e.task}:${list.length - i}`, h('div', {class: `row a-${d.info.actor}`},
      h('span', {class: 'fi'}, icon(d.info.icon)),
      h('div', {class: 'rtext'}, view ? '' : [open(e.task, d.title), ' · '], h('b', {}, d.head), d.text ? ' · ' : '', h('span', {class: d.mono ? 'cmd' : ''}, d.text),
        d.sub ? h('span', {class: 'sub'}, d.sub) : ''),
      h('span', {class: 'rtime'}, stamp(at(e), m.now))));
  });
}

function buildReview(m, items) {
  if (!items.length) return [keyed('empty', h('div', {class: 'empty'}, view ? 'This task has no review item yet' : 'No landed change waits for a review'))];
  return items.map(r => {
    const closed = r.outcome != null;
    const actor = closed ? (r.outcome === 'not reviewed' ? 'bad' : 'done') : r.due === 'when the day allows' ? 'gate' : 'you';
    return keyed(`r:${r.id}:${r.outcome ?? ''}`, h('div', {class: `row a-${actor}`},
      h('span', {class: 'fi'}, icon(closed ? 'check' : 'eye')),
      h('div', {class: 'rtext'}, view ? '' : [open(r.slug, titleOf(r.slug)), ' · '], h('b', {}, closed ? r.outcome : `${r.risk}, due ${r.due}`),

}

}

function ring(done, current, total, big, small) {

}

function taskCard(t) {
  const pane = paneOf(t.session);

    h('div', {class: 'tc-row'}, tags(t), pane?.status ? h('span', {class: 'tag', title: 'The agent status agterm shows for the task’s session'}, icon('cpu'), h('span', {}, `session ${pane.status}`)) : '')));
}

function buildLanes(m) {
  return LANES.map(lane => {
    let tasks = m.list.filter(t => t.lane === lane.key);
    // The task that has waited longest comes first, except where the newest is the news.
    tasks.sort(lane.key === 'done' ? (a, b) => b.since - a.since : (a, b) => (a.status === b.status ? a.since - b.since : Object.keys(STATUS).indexOf(a.status) - Object.keys(STATUS).indexOf(b.status)));
    if (lane.key === 'land') tasks.sort((a, b) => (a.status === 'landing' ? -1 : b.status === 'landing' ? 1 : a.since - b.since));
    const hidden = lane.key === 'done' ? Math.max(0, tasks.length - DONE_SHOWN) : 0;
    if (hidden) tasks = tasks.slice(0, DONE_SHOWN);
    return keyed(`lane:${lane.key}`, h('div', {class: `lane a-${lane.actor}`},
      h('div', {class: 'lane-head'}, h('i'), lane.title, h('em', {}, lane.key === 'build' && tasks.some(t => t.status !== 'building')
        ? `${m.building.length} of ${tasks.length}` : tasks.length + hidden)),
      tasks.length ? tasks.map(taskCard).map(c => { phase(c); return c; }) : h('div', {class: 'lane-empty'}, lane.empty),
      hidden ? h('div', {class: 'more'}, `and ${plural(hidden, 'older task')}`) : ''));
  });
}

        t.forOwner ? h('div', {class: 'now-ctx'}, h('b', {}, 'Where you answer: '), answerOf(t)) : '',
        h('div', {class: 'timer-row'}, h('span', {class: 'timer'}, t.closed ? stamp(t.since, Date.now()) : live(t.since, 'clock')),
          h('span', {class: 'note'}, t.closed ? `after ${span(t.since - t.first)}` : 'in this state')))),
    h('div', {class: 'now-spacer'}),
    h('div', {class: 'now-next'}, h('span', {class: 'lbl'}, 'Last block'), h('span', {}, h('span', {'data-ago': t.lastTs})),
      pane?.status ? h('span', {}, `· the session is ${pane.status}`) : '',
      pane ? h('span', {class: 'right'}, jump(pane.id, 'Go to the session')) : '')));
}

function phaseIndex(t) {
  const reached = t.reached;
  if (reached === 'landed') return PHASES.length;
  if (reached === 'landing') return 4;
  if (reached === 'ready') return 3;
  if (reached === 'queued' && !t.planCommitted) return 0;
  return t.planCommitted && reached !== 'planned' && reached !== 'drafted' ? 2 : 1;
}

function buildTaskProgress(t) {
  const at_ = phaseIndex(t);
  const p = t.progress;
  const done = ['landed', 'ready', 'landing'].includes(t.reached);
  const total = p?.of ?? 0, finished = done ? total : Math.max(0, (p?.n ?? 1) - 1), current = !done && p && t.status === 'building' ? 1 : 0;
  const sub = k => (k === 2 && p ? `task ${done ? p.of : p.n} of ${p.of}` : k === 4 && t.gates.length ? (t.gateBad ? `${t.gateBad} red` : `${t.gates.length} green`) : '');
  const openReview = t.review.filter(r => r.outcome == null);
  return keyed(`prog:${t.slug}:${at_}:${p?.n}:${p?.of}:${t.status}:${t.gates.length}:${t.gateBad}:${t.review.map(r => r.outcome).join()}:${t.commit?.head}`,
    h('div', {class: 'prog'},
      ring(finished, current, total || 1, total ? `${finished}/${total}` : '–', 'plan tasks'),
      h('div', {class: `phases a-${t.info.actor}`}, PHASES.map((name, k) => h('div', {class: `phase ${k < at_ ? 'past' : k === at_ ? 'cur' : ''}`}, h('i'), name, h('small', {}, sub(k))))),
      h('div', {class: 'stats'},
        stat('Lead', t.lead ?? '–', t.lead === 'session' ? 'a session with a reviewer' : t.lead === 'builder' ? 'one builder plans and builds' : 'no lead was started yet'),
        stat('Last commit', t.commit?.head ?? '–', t.commit ? t.commit.subject : 'no commit on its branch yet'),
        stat('Open for', t.closed ? span(t.since - t.first) : live(t.first), `first block ${stamp(t.first, Date.now())}`),
        stat('Gate', t.gates.length ? (t.gateBad ? 'red' : 'green') : '–', t.gates.length ? `${plural(t.gates.length, 'command')} in the last run` : 'it runs at the landing', t.gates.length ? (t.gateBad ? 'bad' : 'ok') : ''),
        stat('Review', t.review.length ? (openReview.length ? 'open' : t.review.at(-1).outcome) : '–', t.review.length ? `risk ${t.review.at(-1).risk}` : 'queued when it lands', openReview.length ? 'you' : ''),
        stat('State blocks', t.blocks.length, `the newest at ${stamp(t.lastTs, Date.now())}`))));
}

function buildStates(t, now) {
  return t.blocks.map((b, k) => ({b, k})).reverse().map(({b, k}) => {
    const info = STATUS[b.status] ?? UNKNOWN;
    const next = t.blocks[k + 1]?.ts;
    return keyed(`s:${k}:${next ?? 'open'}`, h('div', {class: `row a-${info.actor}`},
      h('span', {class: 'fi'}, icon(info.icon)),
      h('div', {class: 'rtext'}, h('b', {}, info.label), ' · ', b.text, b.lines.length ? h('span', {class: 'sub'}, b.lines.join(' · ')) : ''),
      h('span', {class: 'rtime'}, stamp(b.ts, now), h('br'), next ? span(next - b.ts) : t.closed ? '' : live(b.ts))));
  });
}

function buildGate(t, now) {
  if (!t.gates.length) return [keyed('empty', h('div', {class: 'empty'}, 'The gate runs when the task lands'))];
  return t.gates.map((g, k) => keyed(`g:${k}:${g.exit}`, h('div', {class: `row a-${g.exit === 0 ? 'done' : 'bad'}`},
    h('span', {class: 'fi'}, icon(g.exit === 0 ? 'check' : 'alert')),
    h('div', {class: 'rtext'}, h('b', {}, g.exit === 0 ? 'green' : `exit ${g.exit}`), ' · ', h('span', {class: 'cmd'}, g.command ?? ''),
      h('span', {class: 'sub cmd'}, g.last ?? '', g.tip ? ` · on ${g.tip}` : '')),
    h('span', {class: 'rtime'}, stamp(g.ts, now)))));
}

// The stories are the owner's document: each as the lead wrote it, with the tests that hold it and
// what the last check of those tests gave. A word stands beside each mark, never a color alone.
function buildStories(t, now) {
  if (!t.stories) return [keyed('empty', h('div', {class: 'empty'}, 'The lead writes the stories at the top of the plan'))];
  // A result counts only for the stories and tests it ran on: a story or a test that changed
  // since has no check yet. The row names the commit the check ran on, because the page cannot
  // know of a commit that came after it.
  const current = Boolean(t.red?.digest) && t.red.digest === t.stories.digest;
  const results = new Map((current ? t.red.tests : []).map(r => [`${r.story}|${r.command}`, r]));
  return t.stories.list.map(st => {
    const checked = (st.tests ?? []).map(test => results.get(`${st.n}|${test.command}`));
    const bad = checked.some(r => r?.problem);
    const held = (st.tests ?? []).length > 0 && checked.every(r => r && !r.problem);
    const state = bad ? 'bad' : held ? 'done' : 'quiet';
    return keyed(`story:${st.n}:${state}:${st.text.length}:${(st.tests ?? []).length}`, h('div', {class: `row a-${state}`},
      h('span', {class: 'fi'}, icon(bad ? 'alert' : held ? 'check' : 'file')),
      h('div', {class: 'rtext'}, h('b', {}, `${st.n}. `), st.text,
        (st.tests ?? []).map((test, k) => h('span', {class: 'sub cmd'}, test.command, ' · ',
          checked[k]?.problem ?? (checked[k] ? `passes on the branch, fails on the base commit${t.red.tip ? ` (checked on ${t.red.tip})` : ''}` : 'not checked yet'))),
        st.no_test ? h('span', {class: 'sub'}, `no test: ${st.no_test}`) : '',
        !(st.tests ?? []).length && !st.no_test ? h('span', {class: 'sub'}, 'no test yet') : ''),
      h('span', {class: 'rtime'}, bad ? 'not held' : held ? 'held by its tests' : '')));
  });
}

// ---- render ----

const $ = id => document.getElementById(id);
let lastTitle = '';

// ---- the backlog tab ----

// Who can act next, when the backlog skill's sorting has judged the items; the item's own `worth`
// otherwise. A color never stands alone here: each group has its word and its count beside its
// mark, and the one for what is decided against is the quiet one, with a dashed edge.
const BY_WHO = [
  {key: 'owner', name: 'Needs you', actor: 'you', test: it => it.worth !== 'no' && it.who === 'owner'},
  {key: 'agent', name: 'An agent can take it', actor: 'lead', test: it => it.worth !== 'no' && it.who === 'agent'},
  {key: 'waiting', name: 'Waits for something', actor: 'gate', test: it => it.worth !== 'no' && it.who === 'waiting'},
  {key: 'unjudged', name: 'Not judged yet', actor: 'quiet', test: it => it.worth !== 'no' && !it.who},
  {key: 'decided', name: 'Decided against', actor: 'quiet', recessive: true, test: it => it.worth === 'no'},
];
const BY_WORTH = [
  {key: 'yes', name: 'Worth doing', actor: 'gate', test: it => it.worth === 'yes'},
  {key: 'later', name: 'Later', actor: 'you', test: it => it.worth === 'later'},
  {key: 'unset', name: 'No verdict in the item', actor: 'quiet', test: it => it.worth === 'unset'},
  {key: 'no', name: 'Decided against', actor: 'quiet', recessive: true, test: it => it.worth === 'no'},
];
const WHO = {owner: 'needs you', agent: 'an agent can take it', waiting: 'waits'};
// A path is typed into a session as text. Anything but plain path characters is refused, so that
// no file name can be read as more than a name there.
const SAFE_PATH = /^[A-Za-z0-9._\/-]+$/;
const commandFor = it => `/lem new ${it.path}`;
// Whether the agent runs in a session, from the argv agterm reports for its foreground. Only the
// program counts: the first word is the `claude` command, or a shell whose `-c` line starts with
// it. A file named claude that a pager or an editor shows is an argument, not the program, and a
// typed line would land in that program.
function agentRuns(pane) {
  const argv = pane?.foreground ?? [];
  const program = String(argv[0] ?? '').split('/').at(-1);
  if (program === 'claude') return true;
  const line = argv.indexOf('-c');
  return /^(fish|zsh|bash|sh)$/.test(program) && line > 0 && /^claude(\s|$)/.test(String(argv[line + 1] ?? ''));
}
const daysOld = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso) ? Math.max(0, Math.round((Date.now() - new Date(`${iso}T12:00:00`).getTime()) / 86400000)) : null;

function shownItems() {
  const words = bl.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const all = backlog?.items ?? [];
  if (!words.length) return all;
  return all.filter(it => { const hay = `${it.title} ${it.slug} ${it.where} ${it.body}`.toLowerCase(); return words.every(w => hay.includes(w)); });
}
const groupsOf = items => (backlog?.judged ? BY_WHO : BY_WORTH).map(g => ({...g, items: items.filter(g.test)})).filter(g => g.items.length);
const orderOf = items => groupsOf(items).flatMap(g => g.items.map(it => it.slug));

function itemActions(it) {
  const cmd = commandFor(it);
  const sent = bl.sent.get(it.slug);
  const lem = paneOf(meta.session);
  if (sent?.ok) return [h('span', {class: 'bl-note'}, `Typed into Lem’s session at ${hhmm(sent.at)}: `), h('code', {}, cmd), lem ? jump(lem.id, 'Go to Lem') : null];
  if (sent?.pending) return [h('span', {class: 'bl-note'}, 'Typing into Lem’s session… '), h('code', {}, cmd)];
  if (!SAFE_PATH.test(it.path)) return [h('span', {class: 'bl-note bad'}, 'The name of this file has a character that is not typed into a session. Start the task yourself in Lem’s session.')];
  const failed = sent ? h('span', {class: 'bl-note bad'}, `It was not typed (${sent.why}). Type it yourself in Lem’s session: `) : null;
  if (failed) return [failed, h('code', {}, cmd)];
  // typed only into a session where an agent runs: at a bare shell prompt the line would be a shell command
  const ready = typeof agterm !== 'undefined' && agentRuns(lem);
  if (!ready) return [h('span', {class: 'bl-note'}, lem ? 'No agent runs in Lem’s session now. To start a task, type there: ' : 'Lem’s session is not open in this window. To start a task, type in it: '), h('code', {}, cmd)];
  if (bl.confirm === it.slug) return [
    h('span', {}, 'This types ', h('code', {}, cmd), ' into Lem’s session, and Lem opens a task for the item.'),
    h('button', {class: 'jump go', type: 'button', 'data-bl-start': it.slug}, 'Start'),
    h('button', {class: 'jump', type: 'button', 'data-bl-cancel': it.slug}, 'Cancel ', h('kbd', {}, 'Esc')),
  ];
  return [h('button', {class: 'jump', type: 'button', 'data-bl-ask': it.slug}, 'Start a task ', h('kbd', {}, 'S')), h('span', {class: 'bl-note'}, 'as '), h('code', {}, cmd)];
}

function itemRow(it) {
  const days = daysOld(it.added);
  const open = bl.open.has(it.slug);
  const tag = (text, title, c) => h('span', {class: 'tag', title, style: c ? `--c: var(--${c})` : null}, h('span', {}, text));
  return h('div', {class: `bl-item${bl.cursor === it.slug ? ' cur' : ''}`, 'data-bl-item': it.slug},
    h('button', {class: 'bl-head', type: 'button', 'data-bl-toggle': it.slug, 'aria-expanded': String(open)},
      h('span', {class: 'bl-title'}, it.title),
      h('span', {class: 'bl-side'},
        it.state === 'unreadable' ? tag('cannot be read', 'The file of this item is a link to nothing, a folder, or not readable', 'bad')
          : it.state ? tag(it.state === 'new' ? 'new, not committed' : 'edited, not committed', 'git does not have this version of the item yet', 'gate') : null,
        backlog.judged && it.who ? tag(WHO[it.who] + (it.confidence != null ? ` · ${Number(it.confidence).toFixed(2)}` : ''), 'Who can act next, as the backlog’s sorting judged it. A number near 0.5 is close to a coin toss.') : null,
        backlog.judged ? tag(`worth: ${it.worth}`, 'The verdict in the item itself') : null,
        days != null ? tag(days === 0 ? 'today' : `${days} d`, `added ${it.added}`) : null),
      it.where ? (it.where_problem
        ? h('span', {class: 'bl-where stale', title: 'The place this item points at is not there any more. The item may be done, or the code moved.'}, icon('alert'), h('span', {}, `${it.where} · ${it.where_problem}`))
        : h('span', {class: 'bl-where'}, it.where)) : h('span', {class: 'bl-where'}, 'no place in the code named')),
    open ? h('div', {class: 'bl-body'},
      h('div', {class: 'bl-text'}, it.body || 'The item has no text below its title.'),
      h('div', {class: 'bl-actions'}, ...itemActions(it))) : null);
}

function renderBacklog() {
  const all = backlog?.items ?? [];
  const items = shownItems();
  const order = orderOf(items);
  if (bl.cursor && !order.includes(bl.cursor)) bl.cursor = null;
  const stale = all.filter(it => it.where_problem).length;
  const broken = all.filter(it => it.state === 'unreadable').length;
  $('bl-sum').replaceChildren(
    bl.reading ? 'reading… ' : '',
    backlogProblem ? h('span', {class: 'error'}, `${backlogProblem} · `) : '',
    backlog ? `${bl.q.trim() ? `${items.length} of ${all.length}` : plural(all.length, 'item')} in ${backlog.folder} · ${stale ? `${stale} point${stale === 1 ? 's' : ''} at a place that is gone` : 'every place named is there'} ${broken ? ` · ${broken} cannot be read` : ''} · ${backlog.judged ? 'sorted by who can act' : 'sorted by the verdict in each item'} · read ${stamp(new Date(backlog.read).getTime(), Date.now())}` : '');
  const groups = groupsOf(items).map(g => h('div', {class: `bl-group a-${g.actor}${g.recessive ? ' recessive' : ''}`},
    h('div', {class: 'lane-head'}, h('i', {}), g.name, h('em', {}, g.items.length)),
    g.items.map(itemRow)));
  $('bl-groups').replaceChildren(...(groups.length ? groups : [h('div', {class: 'lane-empty'},
    !backlog ? (backlogProblem ?? 'The backlog was not read yet.') : all.length ? 'No item has these words.' : `No item in ${backlog.folder}. The closing pass of a landing proposes items, and /lem backlog adds one.`)]));
}

async function readBacklog() {
  bl.reading = true;
  bl.confirm = null;
  if (tab === 'backlog') renderBacklog();
  const got = await readScript('backlog.js', 'lemBacklog', 0);
  bl.reading = false;
  if (got.records?.length) { backlog = got.records.at(-1); backlogProblem = null; }
  else backlogProblem = got.problem ?? 'backlog.js is missing: open the board with board.py again';
  // drawn again whatever the read gave: the same file a second time still ends the "reading" note
  blDrawn = null;
  render();
}

function setTab(next) {
  if (view || tab === next) return;
  tab = next;
  history.replaceState(null, '', next === 'backlog' ? '#backlog' : location.pathname + location.search);
  if (next === 'backlog') readBacklog(); else render();
  window.scrollTo(0, 0);
}

function askToStart(slug) {
  if (bl.sent.get(slug)?.ok || bl.sent.get(slug)?.pending) return;
  bl.open.add(slug);
  bl.cursor = slug;
  bl.confirm = slug;
  renderBacklog();
  // The Start button takes the focus: Enter then starts, Tab and Enter on Cancel cancels, and a
  // key press anywhere else starts nothing.
  document.querySelector('[data-bl-start]')?.focus();
}

function moveCursor(step) {
  const order = orderOf(shownItems());
  if (!order.length) return;
  const at = order.indexOf(bl.cursor);
  bl.cursor = order[at < 0 ? (step > 0 ? 0 : order.length - 1) : Math.min(order.length - 1, Math.max(0, at + step))];
  bl.confirm = null;
  renderBacklog();
  document.querySelector(`[data-bl-item="${CSS.escape(bl.cursor)}"]`)?.scrollIntoView({block: 'nearest'});
}

async function startTask(slug) {
  const it = backlog?.items.find(x => x.slug === slug);
  const lem = paneOf(meta.session);
  // only the item whose question is open, and one time: a second key press must not open a second task
  const before = bl.sent.get(slug);
  if (!it || !SAFE_PATH.test(it.path) || bl.confirm !== slug || before?.ok || before?.pending) return;
  bl.confirm = null;
  // marked before the request goes out: until agterm answers, a second key press finds the item taken
  bl.sent.set(slug, {pending: true});
  renderBacklog();
  try {
    if (typeof agterm === 'undefined' || !agentRuns(lem)) throw new Error('no agent runs in Lem’s session');
    await agterm.request('session.type', {target: lem.id, args: {text: `${commandFor(it)}\n`}});
    bl.sent.set(slug, {ok: true, at: Date.now()});
  } catch (err) {
    bl.sent.set(slug, {ok: false, why: err?.message ?? String(err)});
  }
  renderBacklog();
}

function render() {
  const now = Date.now();
  const m = derive(now);
  const t = m.task;
  const trouble = [...Object.values(problems), treeProblem].filter(Boolean);
  const repo = meta.repo ?? 'this repository';
  const page = $('page');
  page.className = `page a-${t ? t.info.actor : focusOf(m)?.t.info.actor ?? 'quiet'}`;
  $('beacon').className = `beacon${trouble.length ? ' bad' : ''}`;
  $('eyebrow').textContent = (meta.demo ? 'Demo data · ' : '') + (view ? `Lem · ${repo} · one task` : `Lem · ${repo}`);
  patch($('banners'), buildBanners(m));

  if (view) tab = 'tasks';
  const tabButton = (key, label, count) => keyed(`${key}:${tab === key}:${count ?? ''}`, h('button', {class: 'tab', type: 'button', role: 'tab', 'aria-selected': String(tab === key), 'data-tab': key}, label, count != null ? h('em', {}, count) : null));
  patch($('tabs'), view ? [] : [tabButton('tasks', 'Tasks', m.list.filter(x => !x.closed).length), tabButton('backlog', 'Backlog', backlog ? backlog.items.filter(it => it.worth !== 'no').length : null)]);
  $('tabs').hidden = Boolean(view);
  $('backlog').hidden = tab !== 'backlog';
  for (const n of document.querySelectorAll('[data-tasks]')) n.hidden = tab === 'backlog';
  // The backlog is drawn again only when what it shows from outside changed: this function runs
  // every second, and a redraw takes the focus and a text selection away from the reader.
  const lemNow = paneOf(meta.session);
  const outside = tab === 'backlog' ? `${backlog?.read}|${backlogProblem}|${bl.reading}|${lemNow?.id}|${agentRuns(lemNow)}` : '';
  if (tab === 'backlog' && outside !== blDrawn) renderBacklog();
  blDrawn = outside;

  const lem = paneOf(meta.session);
  const right = [];
  if (view) right.push(keyed('back', h('button', {class: 'jump back', type: 'button', 'data-open': ''}, icon('arrow'), ' ', 'All tasks')));
  if (lem) right.push(keyed(`lem:${lem.status ?? ''}`, jump(lem.id, `Go to Lem${lem.status ? ` (${lem.status})` : ''}`)));
  patch($('top-right'), right);

  const chip = (key, name, cls, ...kids) => keyed(key, h('span', {class: `chip ${cls}`}, icon(name), ...kids));
  if (view) {
    $('title').textContent = t?.title ?? titleOf(view);
    $('ask').textContent = t?.ask ?? '';
    patch($('meta'), t ? [
      keyed(`st:${t.status}`, statusPill(t)),
      t.branch ? chip('branch', 'branch', 'mono', t.branch) : null,
      meta.base ? chip('base', 'flag', '', 'lands on ', h('b', {}, meta.base)) : null,
      ...tags(t).map((n, i) => keyed(`tag:${i}`, n)),
    ] : []);
    $('now').className = `card now a-${t?.info.actor ?? 'quiet'}`;
    patch($('now'), t ? [buildTaskNow(t)] : []);
    patch($('progress'), t ? [buildTaskProgress(t)] : []);
    patch($('stories'), t ? buildStories(t, now) : []);
    $('stories-sum').textContent = t?.stories ? `${t.stories.kind}, because ${t.stories.why}` : '';
    patch($('states'), t ? buildStates(t, now) : []);
    $('states-sum').textContent = t ? plural(t.blocks.length, 'block') : '';
    patch($('gate'), t ? buildGate(t, now) : []);
    $('gate-sum').textContent = t?.gates.length ? (t.gateBad ? `${t.gateBad} of ${t.gates.length} red` : `${plural(t.gates.length, 'command')} green`) : '';
  } else {
    const parts = [m.forOwner.length && `${m.forOwner.length} wait${m.forOwner.length === 1 ? 's' : ''} for you`, m.building.length && `${m.building.length} build${m.building.length === 1 ? 's' : ''}`,
      (m.ready.length + m.landing.length) && `${m.ready.length + m.landing.length} in the landing line`, m.queued.length && `${m.queued.length} queued`].filter(Boolean);
    $('title').textContent = parts.length ? parts.join(', ') : m.list.length ? 'Nothing runs' : 'Waiting for the first task';
    $('ask').textContent = '';
    patch($('meta'), [
      meta.base ? chip('base', 'branch', '', 'tasks land on ', h('b', {}, meta.base)) : null,
      chip(`limit:${m.places}`, 'layers', '', h('b', {}, `${m.places} of ${m.limit ?? '?'}`), ' places taken'),
      chip(`review:${m.open.length}:${m.due.length}`, 'eye', m.due.length ? 'you' : '', h('b', {}, m.open.length), ` review ${m.open.length === 1 ? 'item' : 'items'} open`, m.due.length ? `, ${m.due.length} due` : ''),
      m.blocked.length ? chip('blocked', 'alert', 'bad', h('b', {}, m.blocked.length), ' blocked') : null,
    ]);
    $('now').className = `card now a-${focusOf(m)?.t.info.actor ?? 'done'}`;
    patch($('now'), [buildBoardNow(m)]);
    patch($('progress'), [buildBoardProgress(m)]);
    patch($('lanes'), buildLanes(m));
  }
  $('lanes-section').hidden = Boolean(view) || tab === 'backlog';
  $('stories-card').hidden = !view;
  $('states-card').hidden = !view;
  $('gate-card').hidden = !view;

  // On the board the timeline holds the tasks that are open and the ones that closed today.
  const shown = view ? (t ? [t] : []) : m.list.filter(x => !x.closed || dayKey(x.since) === dayKey(now)).sort((a, b) => a.first - b.first);
  patch($('legend'), buildLegend(m, shown));
  patch($('timeline'), [buildTimeline(m, shown, $('tl-wrap').clientWidth)]);

  const reviewItems = view ? (t?.review ?? []).map(r => ({...r, due: m.open.find(o => o.id === r.id)?.due})) : m.open;
  patch($('review'), buildReview(m, reviewItems));
  $('review-sum').textContent = view ? '' : `${m.open.length} open · ${m.due.length} due · ${m.closed.length} closed`;
  const feed = view ? events.filter(e => e.task === view) : events;
  patch($('feed'), buildFeed(m, feed));
  $('feed-sum').textContent = plural(feed.length, 'event');

  patch($('foot'), [
    keyed(`f:${trouble.join()}:${events.length}`, h('span', {}, trouble.length ? h('span', {class: 'error'}, `${trouble.join(' · ')} · `) : '',
      'events.js last read cleanly ', h('span', {'data-ago': lastGoodRead}), ` · ${plural(events.length, 'event')}`)),
    keyed('rates', h('span', {}, `files read every ${FEED_EVERY_MS / 1000}s · sessions every ${TREE_EVERY_MS / 1000}s`)),
  ]);
  tick(now);

  const title = (trouble.length ? 'PROBLEM · ' : '') + (meta.demo ? 'DEMO · ' : '') + (tab === 'backlog' ? `Backlog · ${repo} · ` : '') + (view ? `${t?.title ?? view} · ${t?.info.label ?? 'no state'}` : `Lem · ${m.building.length} build · ${m.forOwner.length} for you`);
  if (title !== lastTitle) document.title = lastTitle = title;
}

function tick(now) {
  for (const n of document.querySelectorAll('[data-since]')) {
    const ms = now - Number(n.dataset.since);
    n.textContent = n.dataset.fmt === 'clock' ? clock(ms) : span(ms);
  }
  for (const n of document.querySelectorAll('[data-ago]')) n.textContent = Number(n.dataset.ago) ? ago(now - Number(n.dataset.ago)) : 'never';
}

async function pollFiles() {
  const feed = await readScript('events.js', 'lemEvent', events.length);
  if (feed.records) { events = feed.records; lastGoodRead = Date.now(); delete problems.events; }
  else problems.events = feed.missing ? 'events.js is missing: no state block was written yet' : feed.problem;
  // No landing yet means no review queue: a missing file is an empty queue, a broken one a problem.
  const queue = await readScript('review-queue.js', 'lemReview', reviews.length);
  if (queue.records) { reviews = queue.records; delete problems.reviews; } else if (queue.missing) { reviews = []; delete problems.reviews; } else problems.reviews = queue.problem;
  const about = await readScript('meta.js', 'lemMeta', 0);
  if (about.records?.length) { meta = about.records.at(-1); delete problems.meta; }
  else problems.meta = about.problem ?? 'meta.js is missing or empty: open the board with board.py';
  render();
  setTimeout(pollFiles, FEED_EVERY_MS);
}

// The agent status of Lem's session and of each task's session, from agterm. A page opened outside
// agterm has no bridge: it shows the files and no session.
async function pollTree() {
  if (typeof agterm === 'undefined') return;
  try {
    const reply = await agterm.request('tree');
    sessions = (reply?.tree?.workspaces ?? []).flatMap(w => w.sessions ?? []);
    treeProblem = null;
  } catch (err) {
    // An old status beside a failed read would pass for a current one.
    sessions = null;
    treeProblem = `tree failed: ${err?.message ?? err}`;
  }
}

document.addEventListener('click', async ev => {
  const to = ev.target.closest('[data-jump]');
  if (to) {
    try { await agterm.request('session.select', {target: to.dataset.jump}); } catch (err) { treeProblem = `could not switch: ${err?.message ?? err}`; render(); }
    return;
  }
  const pick = (name, fn) => { const node = ev.target.closest(`[data-bl-${name}]`); if (node) fn(node.dataset[`bl${name[0].toUpperCase()}${name.slice(1)}`]); return Boolean(node); };
  if (ev.target.closest('[data-tab]')) return setTab(ev.target.closest('[data-tab]').dataset.tab);
  if (ev.target.closest('#bl-read')) return void readBacklog();
  if (pick('ask', askToStart)) return;
  if (pick('cancel', () => { bl.confirm = null; renderBacklog(); })) return;
  if (pick('start', slug => startTask(slug))) return;
  if (pick('toggle', slug => { bl.open.has(slug) ? bl.open.delete(slug) : bl.open.add(slug); bl.cursor = slug; bl.confirm = null; renderBacklog(); })) return;
  const task = ev.target.closest('[data-open]');
  if (task) {
    view = task.dataset.open || null;
    window.scrollTo(0, 0);
    render();
  }
});
window.addEventListener('resize', render);
$('bl-q').addEventListener('input', ev => { bl.q = ev.target.value; bl.confirm = null; renderBacklog(); });
// Letters go by the physical key (code), so they work in every keyboard layout.
document.addEventListener('keydown', ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey || view) return;
  const q = $('bl-q');
  if (!(ev.target instanceof Element)) return;
  if (ev.target === q) {
    if (ev.key === 'Escape') { ev.preventDefault(); if (q.value) { q.value = ''; bl.q = ''; renderBacklog(); } else q.blur(); }
    else if (ev.key === 'Enter' || ev.key === 'ArrowDown') { ev.preventDefault(); q.blur(); moveCursor(1); }
    return;
  }
  if (ev.target.closest('input, select, textarea')) return;
  if (tab !== 'backlog') { if (ev.code === 'KeyB') { ev.preventDefault(); setTab('backlog'); } return; }
  const act = fn => { ev.preventDefault(); fn(); };
  if (bl.confirm && ev.key === 'Escape') return act(() => { bl.confirm = null; renderBacklog(); });
  // a focused button or link answers Enter and Space itself
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest('button, a')) return;
  // while the question is open, Enter belongs to its two buttons and does nothing anywhere else
  if (bl.confirm && ev.key === 'Enter') return void ev.preventDefault();
  if (ev.code === 'KeyT') act(() => setTab('tasks'));
  else if (ev.code === 'KeyR') act(readBacklog);
  else if (ev.key === '/' || ev.code === 'Slash') act(() => { q.focus(); q.select(); });
  else if (ev.code === 'KeyJ' || ev.key === 'ArrowDown') act(() => moveCursor(1));
  else if (ev.code === 'KeyK' || ev.key === 'ArrowUp') act(() => moveCursor(-1));
  else if (ev.key === 'Enter' && bl.cursor && !ev.target.closest('button, a')) act(() => { bl.open.has(bl.cursor) ? bl.open.delete(bl.cursor) : bl.open.add(bl.cursor); renderBacklog(); });
  else if (ev.code === 'KeyS' && bl.cursor) act(() => askToStart(bl.cursor));
});

await pollFiles();
await pollTree();
// once at the start, for the count on the tab; after that only when the tab opens or on its key
if (!view) await readBacklog();
render();
setInterval(pollTree, TREE_EVERY_MS);
setInterval(render, 1000);
</script>
</body>
</html>
