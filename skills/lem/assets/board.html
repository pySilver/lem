    h('span', {title: `${r.label} held the work for ${span(model.totals[r.key])} of the task’s ${span(model.whole)}`}, h('i', {style: `background:${r.fill}`}), r.label,
      h('em', {}, `${span(model.totals[r.key])} · ${share(r)}%`)))),
    over ? keyed(`lt:over:${shown}`, h('span', {class: 'over'}, `the shares add up to ${shown}%, as two rows can hold the same minutes`)) : null];
}

// The hover of a band, a span or a mark: what it is, how long it took and its two clock times.
function showTip(ev) {
  const tipBox = $('tip');
  const node = view && ev ? ev.target.closest?.('[data-head]') : null;
  if (!node) { tipBox.hidden = true; return; }
  const from = Number(node.dataset.from), to = node.dataset.to === 'now' ? Date.now() : Number(node.dataset.to);
  const when = from === to ? `at ${hms(from)}` : `${span(to - from)} · ${hms(from)} → ${node.dataset.to === 'now' ? 'now' : hms(to, from)}`;
  tipBox.replaceChildren(
    h('div', {class: 'tt'}, node.dataset.fill ? h('i', {style: `background:${node.dataset.fill}`}) : null, node.dataset.head),
    node.dataset.sub ? h('div', {class: 'ts'}, node.dataset.sub) : null,
    h('div', {class: 'td'}, when));
  tipBox.hidden = false;
  const box = $('tl-wrap').getBoundingClientRect();
  const px = ev.clientX - box.left, py = ev.clientY - box.top;
  const w = tipBox.offsetWidth, hgt = tipBox.offsetHeight;
  tipBox.style.left = `${px + 14 + w > box.width ? Math.max(0, px - 14 - w) : px + 14}px`;
  tipBox.style.top = `${Math.max(0, Math.min(py + 14, box.height - hgt))}px`;
}

// The place of an investigation's cause, and for a bug whether it was reproduced.
const investigationSub = x => [x.where, x.kind === 'bug' && x.reproduced != null ? (x.reproduced ? 'reproduced' : 'not reproduced') : ''].filter(Boolean).join(' · ');

// What each event of the scripts says, in the feed's words; an event not named here is shown as its fields.
const SAYS = {
  'task.stories': e => ({info: {actor: 'lead', icon: 'file'}, head: 'Stories recorded', text: `${storyKind(e.kind)}: ${plural((e.stories ?? []).length, 'story').replace('storys', 'stories')}`}),
  'task.red': e => ({info: {actor: e.ok ? 'done' : 'bad', icon: e.ok ? 'check' : 'alert'}, head: e.ok ? 'The stories’ tests hold' : 'A test does not hold its story', text: `on ${e.tip ?? '?'}, against ${e.base ?? 'the base'}`}),
  'stories.approved': e => ({info: {actor: e.by === 'owner' ? 'you' : 'lem', icon: 'check'},
    head: {owner: 'You approved the stories', correction: 'Taken as a small change in your name', read: 'The personas’ read froze the stories'}[e.by] ?? `Stories approved by ${e.by}`,
    text: `${e.number ? `approval ${e.number} · ` : ''}${storyKind(e.kind)}: ${plural((e.stories ?? []).length, 'story').replace('storys', 'stories')}`}),
  'stories.read': e => !e.answered ? {info: {actor: 'bad', icon: 'users'}, head: 'Nobody answered the personas’ read of the stories', text: `0 of ${e.asked} answered`}
    : {info: {actor: e.split || e.flagged ? 'you' : 'done', icon: 'users'}, head: 'The personas read the stories',
      text: `${e.split ? 'the families split · ' : ''}${e.flagged ? `${e.flagged} flagged` : 'nobody confused'} · ${e.answered} of ${e.asked} answered`},
  'review': e => ({info: {actor: e.verdict === 'clean' ? 'done' : 'bad', icon: 'eye'}, head: 'Review', text: reviewLine(e)}),
  'review.filed': e => ({info: {actor: 'lem', icon: 'file'}, head: 'Filed in the backlog', text: plural((e.items ?? []).length, 'item')}),
  'proposed': e => ({info: {actor: e.green ? 'done' : 'you', icon: e.green ? 'check' : 'alert'}, head: e.green ? 'Proposed: green' : 'Proposed: not green', text: (e.not_green ?? []).join(' · ')}),
  'plan.talk.start': e => ({info: {actor: 'gate', icon: 'split'}, head: 'The plan talk started', text: `with ${e.reviewer}`}),
  'plan.talk': e => ({info: {actor: 'gate', icon: 'split'}, head: 'The plan talk ended', text: `with ${e.reviewer}: ${talkCounts(e)}`}),
  'careful.missed': e => ({info: {actor: 'bad', icon: 'alert'}, head: 'Careful by the review, not by the plan', text: e.why != null ? `round ${e.round ?? '?'}: ${e.why}` : `${e.path} (${e.pattern})`}),  // an older event named a path and its pattern
  'investigation': e => ({info: {actor: e.call === 'not-reproduced' ? 'you' : 'done', icon: 'eye'}, head: CALLS[e.call]?.head ?? `The investigation: ${e.call}`,
    text: e.line, sub: investigationSub(e)}),
  'polish': e => ({info: {actor: 'lead', icon: 'code'}, head: 'The polish pass',
    text: `${plural(e.commits ?? 0, 'commit')}, ${(e.filed ?? []).length ? plural(e.filed.length, 'item') : 'no item'} filed in the backlog`,
    sub: [`${e.before ?? '?'} → ${e.after ?? '?'}`, ...(e.filed ?? [])].join(' · ')}),
  // the start of a stage (SKILL.md): the time card draws it to the event that ends it
  'interview.start': () => ({info: {actor: 'you', icon: 'user'}, head: 'The interview started', text: 'Lem asks you one question at a time'}),
  'scout.start': () => ({info: {actor: 'lead', icon: 'eye'}, head: 'The scout started', text: 'it reads the code for the facts the stories need'}),
  'scout': () => ({info: {actor: 'lead', icon: 'file'}, head: 'The scout’s report is in', text: ''}),
  'stories.read.start': e => ({info: {actor: 'quiet', icon: 'users'}, head: 'The personas’ read of the stories started', text: `run by ${e.by === 'lead' ? 'the agent' : 'Lem'}`}),
  'investigation.start': e => ({info: {actor: 'lead', icon: 'eye'}, head: 'The investigation started', text: e.kind === 'bug' ? 'a builder reproduces the bug and finds its cause' : 'a builder finds the answer'}),
  'builder.start': e => ({info: {actor: 'lead', icon: 'code'}, head: 'A builder started', text: e.job}),
  'polish.start': e => ({info: {actor: 'lead', icon: 'code'}, head: 'The polish pass started', text: `on ${e.before ?? '?'}`}),
  'gate.start': e => ({info: {actor: 'gate', icon: 'play'}, head: 'The checks started', text: `${plural(e.commands ?? 0, 'command')} on ${e.tip ?? '?'}`}),
  'review.start': e => ({info: {actor: 'gate', icon: 'eye'}, head: 'The review started', text: `attempt ${e.attempt ?? '?'} · ${KIND[e.floor] ?? e.floor}`}),
  'decision.taken': e => ({info: {actor: 'done', icon: 'check'}, head: `Decision ${e.id}, by ${BY_WHOM[e.by] ?? e.by}`, text: `${e.what} → ${e.chose}`}),
  'decision.asked': e => ({info: {actor: 'you', icon: 'help'}, head: `Choice ${e.id} asked`, text: e.what, sub: e.irreversible ? 'it waits for your answer, with no end' : `its wait ends at ${hhmm(new Date(e.deadline).getTime())}`}),
  'decision.answered': e => ({info: {actor: 'you', icon: 'user'}, head: `You answered choice ${e.id}`, text: e.chose}),
  'decision.advised': e => ({info: {actor: 'quiet', icon: 'users'}, head: `${expertName(e.expert)} advised on choice ${e.id}`, text: e.none ? 'none of the options fits' : `picks “${e.pick}”`, sub: e.why}),
  'decision.settled': e => ({info: {actor: 'bad', icon: 'clock'}, head: `Choice ${e.id} taken by the experts while you were away`, text: e.chose, sub: reasonsOf(e.experts)}),
  'decision.timeout': e => (e.by === 'experts'
    ? {info: {actor: 'bad', icon: 'clock'}, head: `Choice ${e.id} taken by the experts at the end of its wait`, text: e.chose, sub: reasonsOf(e.experts)}
    : {info: {actor: 'bad', icon: 'clock'}, head: `Choice ${e.id} taken by the timeout`, text: e.chose}),
  'decision.late': e => ({info: {actor: 'you', icon: 'user'}, head: `Your answer to choice ${e.id} came after it was taken`, text: e.chose}),
  'decision.story': e => ({info: {actor: 'you', icon: 'alert'}, head: `Story ${e.story} ${e.how === 'changed' ? 'changed' : e.how === 'added' ? 'was added' : 'was removed'}`, text: e.why}),
};

function describe(e, m) {
  const title = titleOf(e.task);
  if (e.event === 'task.state') {
    const info = STATUS[e.status] ?? UNKNOWN;
    const t = m.list.find(x => x.slug === e.task);
    const lines = saidOf(e, t ? talkedBefore(t, at(e)) : false);
    return {info, head: info.label, text: lines[0] ?? '', sub: lines.slice(1).join(' · '), title};
  }
  if (e.event === 'gate') {
    const ok = e.exit === 0;
    return {info: {actor: ok ? 'done' : 'bad', icon: ok ? 'check' : 'alert'}, head: ok ? 'Check passed' : `Check failed, exit ${e.exit}`, text: e.command, sub: e.last ?? '', title, mono: true};
  }
  const said = SAYS[e.event]?.(e);
  if (said) return {title, sub: '', ...said};
  const rest = Object.entries(e).filter(([k]) => !['ts', 'event', 'task'].includes(k)).map(([k, v]) => `${k} ${typeof v === 'string' ? v : JSON.stringify(v)}`).join(' · ');
  return {info: {actor: 'quiet', icon: 'dot'}, head: e.event, text: rest, sub: '', title};
}

// The activity is in time order, the newest first. A log is written in time order, but one whose
// events were moved (a fixture) or written by two clocks need not be: the time sorts, and the order
// of the log breaks a tie, the later first. The newest 200 are shown.
function buildFeed(m, list) {
  if (!list.length) return [keyed('empty', h('div', {class: 'empty'}, 'No events yet'))];
  const newest = list.map((e, i) => ({e, i, ms: at(e)})).sort((a, b) => b.ms - a.ms || b.i - a.i).slice(0, 200);
  // On a task's own board the activity is its history: every state block with its time. The newest
  // block's words are the large card's, so its row here names only the status and says them once.
  const current = view ? list.findLastIndex(e => e.event === 'task.state') : -1;
  return newest.map(({e, i}) => {
    const d = i === current ? {...describe(e, m), text: '', sub: ''} : describe(e, m);
    return keyed(`f:${e.ts}:${e.task}:${i}`, h('div', {class: `row a-${d.info.actor}`, 'data-at': at(e)},
      h('span', {class: 'fi'}, icon(d.info.icon)),
      h('div', {class: 'rtext'}, view ? '' : [open(e.task, d.title), ' · '], h('b', {}, d.head), d.text ? ' · ' : '', h('span', {class: d.mono ? 'cmd' : ''}, d.text),
        d.sub ? h('span', {class: 'sub'}, d.sub) : ''),
      h('span', {class: 'rtime'}, stamp(at(e), m.now))));
  });
}

// The three kinds of review, in the words of land.py.
const KIND = {read: 'one read', round: 'a round with the profiles that fit', full: "the project's full set"};
const reviewLine = r => `round ${r.round}, ${KIND[r.kind] ?? r.kind}: ${r.verdict === 'not reviewed' ? 'not reviewed' : `${r.verdict}, ${r.must_fix} must-fix, ${r.should} should, ${r.nit} nit`}`;

// The reviews of one task's change, each with who answered and what was run or left out, and
// under them what the proposal said: green, or each reason it is not.
function buildReview(t, now) {
  if (!t.reviews.length && !t.proposal) return [keyed('empty', h('div', {class: 'empty'}, 'The review comes after the machine checks, before anything is proposed'))];
  const rows = t.reviews.map((r, k) => keyed(`r:${k}:${r.verdict}`, h('div', {class: `row a-${r.verdict === 'clean' ? 'done' : 'bad'}`},
    h('span', {class: 'fi'}, icon(r.verdict === 'clean' ? 'check' : 'eye')),
    h('div', {class: 'rtext'}, h('b', {}, reviewLine(r)),
      h('span', {class: 'sub'}, r.answered.length ? `answered: ${r.answered.join(', ')}` : 'no source answered', r.silent.map(x => ` · no answer from ${x.name} (${x.why})`).join(''),
        r.ran.length ? ` · ran ${r.ran.map(x => x.name).join(', ')}` : '', r.left_out.length ? ` · left out ${r.left_out.map(x => x.name).join(', ')}` : '', r.tip ? ` · on ${r.tip}` : '')),
    h('span', {class: 'rtime'}, stamp(r.ts, now)))));
  if (t.proposal) rows.push(keyed(`p:${t.proposal.ts}`, h('div', {class: `row a-${t.proposal.green ? 'done' : 'you'}`},
    h('span', {class: 'fi'}, icon(t.proposal.green ? 'check' : 'alert')),
    h('div', {class: 'rtext'}, h('b', {}, t.proposal.green ? 'Proposed: green' : 'Proposed: not green'),
      h('span', {class: 'sub'}, t.proposal.green ? GREEN.toLowerCase() : t.proposal.reasons.join(' · '))),
    h('span', {class: 'rtime'}, stamp(t.proposal.ts, now)))));
  return rows;
}

// ---- the board of all tasks ----

function focusOf(m) {
  const t = m.forOwner[0] ?? m.blocked[0] ?? m.landing[0] ?? m.building[0] ?? m.ready[0] ?? m.queued[0] ?? null;
  if (!t) return null;
  // "like it": a wait of the same kind (a choice, a held task, a plan, a draft, a pull request), or the same status
  const others = (m.forOwner.includes(t) ? m.forOwner.filter(x => x.ownerRank === t.ownerRank) : m[t.status] ?? []).length - 1;
  return {t, others};
}

// The large card of the board of all tasks: the one most pressing thing, and for a wait of yours
// where you answer it. It is one band high, so that the lanes start in the upper third of a window
// (on a 1400 x 900 window they started at 621 px before, measured with tests/board-showcase.py).
function buildBoardNow(m) {
  const f = focusOf(m);
  if (!f) {
    return keyed('now:idle', h('div', {class: 'still'}, h('div', {class: 'now-in'},
      h('div', {class: 'avatar'}, icon('check')),
      h('div', {class: 'now-body'}, h('div', {class: 'now-eyebrow'}, 'Lem'), h('div', {class: 'now-head'}, m.list.length ? 'Nothing runs' : 'No task was opened yet'),
        h('div', {class: 'now-ctx'}, m.list.length ? 'Every task has landed, was answered or was dropped.' : 'Type /lem and an ask in Lem’s session.')))));
  }
  const {t, others} = f;
  const pane = paneOf(t.session);
  // A choice that waits for the owner is the news of its task: its question and its count-down.
  const c = t.asks[0];
  return keyed(`now:${t.slug}:${t.status}:${t.text}:${others}:${pane?.status ?? ''}:${c?.id ?? ''}`, h('div', {class: t.info.live || c ? '' : 'still'},
    h('div', {class: 'now-in'},
      h('div', {class: 'avatar'}, icon(c ? 'help' : t.info.icon)),
      h('div', {class: 'now-body'},
        h('div', {class: 'now-eyebrow'}, c ? `You · choice ${c.id} of the task` : `${t.info.who} · ${t.info.label}`),
        h('div', {class: 'now-head'}, t.title, h('span', {class: 'now-what'}, ` · ${c ? c.what : cap(t.shown)}`)),
        t.forOwner ? h('div', {class: 'now-ctx'}, h('b', {}, 'Where you answer: '), answerOf(t, c)) : t.ask ? h('div', {class: 'now-ctx'}, t.ask) : ''),
      h('div', {class: 'now-side'},
        h('div', {class: 'timer-row'}, h('span', {class: 'timer'}, c && !c.irreversible ? until(c.deadline, 'span') : live(c ? c.ts : t.since)),
          h('span', {class: 'note'}, c ? (c.irreversible ? 'since it was asked; no end' : `left, until ${hhmm(c.deadline)}`) : 'in this state',
            others > 0 ? ` · ${plural(others, 'more task')} like it` : '')),
        h('button', {class: 'jump', type: 'button', 'data-open': t.slug}, 'Open the task', ' ', icon('arrow'))))));
}

function ring(done, current, total, big, small) {
  const R = 48, C = 2 * Math.PI * R, safe = Math.max(1, total);
  const arc = (cls, from, n) => n > 0 ? s('circle', {class: cls, cx: 58, cy: 58, r: R, 'stroke-dasharray': `${(C * n) / safe} ${C}`, 'stroke-dashoffset': -(C * from) / safe, transform: 'rotate(-90 58 58)'}) : null;
  return h('div', {class: 'ring-wrap'},
    s('svg', {class: 'ring', width: 116, height: 116, viewBox: '0 0 116 116'}, s('circle', {class: 'todo', cx: 58, cy: 58, r: R}), arc('done', 0, done), arc('cur', done, current)),
    h('div', {class: 'ring-center'}, h('b', {}, big), h('span', {}, small)));
}
const stat = (label, value, sub, cls = '') => h('div', {class: `stat ${cls}`, title: sub ?? ''}, h('div', {class: 'sk'}, label), h('div', {class: 'sv'}, value), h('div', {class: 'ss'}, sub ?? ''));

// The one line of a card, in words: the first choice that waits for you with its count-down, the
// answer of an answered task, or what the newest state block says. The lane's title is not said
// again: in "Building" a card says "Task 2 of 3", not "Building: task 2 of 3".
function cardLine(t, lane) {
  const c = t.asks[0];
  if (c) return [`Choice ${c.id} waits for you: ${c.what} · `, c.irreversible ? 'no end' : until(c.deadline)];
  if (t.status === 'answered' && t.investigation) return `${CALLS[t.investigation.call]?.card ?? t.investigation.call}: ${t.investigation.line}`;
  const label = t.info.label === lane.title ? '' : t.info.label;
  if (!t.shown) return t.info.label;
  // a pull request is its number here; the task's own board has its whole address
  const said = t.shown.replace(/\bhttps?:\/\/\S+\/pull\/(\d+)\b/g, '#$1');
  return label ? `${label}: ${said}` : cap(said);
}

// A card is short: the task's name, its ask in one line, one line of where it is, and the tags.
// Where you answer is on the large card for the most pressing wait and on the task's own board.
function taskCard(t, lane) {
  const pane = paneOf(t.session);
  return keyed(`c:${t.slug}`, h('button', {class: `tcard s-${t.status} a-${t.info.actor}`, type: 'button', 'data-open': t.slug, title: 'Open the board of this task'},
    h('div', {class: 'tc-top'}, h('div', {class: 'tc-title'}, t.title), h('div', {class: 'tc-time'}, t.closed ? '' : live(t.since))),
    t.ask ? h('div', {class: 'tc-ask', title: t.ask}, t.ask) : '',
    h('div', {class: 'tc-text'}, cardLine(t, lane)),
    t.progress && t.status === 'building' ? h('div', {class: 'mini'}, h('span', {style: `width:${(100 * (t.progress.n - 1)) / t.progress.of}%`}),
      h('span', {class: 'cur', style: `left:${(100 * (t.progress.n - 1)) / t.progress.of}%;width:${100 / t.progress.of}%`})) : '',
    h('div', {class: 'tc-row'}, tags(t, true), pane?.status ? h('span', {class: 'tag', title: 'The agent status agterm shows for the task’s session'}, icon('cpu'), h('span', {}, `session ${pane.status}`)) : '')));
}

function buildLanes(m) {
  return LANES.map(lane => {
    let tasks = m.list.filter(t => t.lane === lane.key);
    // The task that has waited longest comes first, except where the newest is the news.
    tasks.sort(lane.key === 'done' ? (a, b) => b.since - a.since : (a, b) => (a.status === b.status ? a.since - b.since : Object.keys(STATUS).indexOf(a.status) - Object.keys(STATUS).indexOf(b.status)));
    if (lane.key === 'you') tasks.sort((a, b) => a.ownerRank - b.ownerRank || a.since - b.since);
    if (lane.key === 'checks') tasks.sort((a, b) => (a.status === 'landing' ? -1 : b.status === 'landing' ? 1 : a.since - b.since));
    const hidden = lane.key === 'done' ? Math.max(0, tasks.length - DONE_SHOWN) : 0;
    if (hidden) tasks = tasks.slice(0, DONE_SHOWN);
    return keyed(`lane:${lane.key}`, h('div', {class: `lane a-${lane.actor}`},
      h('div', {class: 'lane-head'}, h('i'), lane.title, h('em', {}, tasks.length + hidden)),
      tasks.length ? tasks.map(t => taskCard(t, lane)).map(c => { phase(c); return c; }) : h('div', {class: 'lane-empty'}, lane.empty),
      hidden ? h('div', {class: 'more'}, `and ${plural(hidden, 'older task')}`) : ''));
  });
}

// ---- the board of one task ----

function buildTaskNow(t) {
  const pane = paneOf(t.session);
  const c = t.asks[0];
  if (c) {
    // A choice for the owner is what this task waits on, while the rest of its plan goes on: its
    // count-down is the timer here.
    return keyed(`now:${t.slug}:choice:${c.id}:${t.asks.length}:${t.status}:${pane?.status ?? ''}`, h('div', {},
      h('div', {class: 'now-in'},
        h('div', {class: 'avatar'}, icon('help')),
        h('div', {class: 'now-body'},
          h('div', {class: 'now-eyebrow'}, 'You act'),
          h('div', {class: 'now-head'}, t.asks.length > 1 ? `${t.asks.length} choices wait for you` : `Choice ${c.id} waits for you`),
          h('div', {class: 'now-status'}, c.what),
          h('div', {class: 'now-ctx'}, `recommended: ${c.recommended} · ${STATUS[t.status]?.label ?? t.status}${t.shown ? `: ${t.shown}` : ''}`),
          Object.keys(c.advice).length ? h('div', {class: 'now-ctx'}, `the experts: ${Object.keys(EXPERTS).filter(key => c.advice[key])
            .map(key => `${expertName(key)} ${c.advice[key].pick != null ? `“${c.advice[key].pick}”` : 'none fits'}`).join(' · ')}`) : '',
          h('div', {class: 'now-ctx'}, h('b', {}, 'Where you answer: '), answerOf(t)),
          h('div', {class: 'timer-row'}, h('span', {class: 'timer'}, c.irreversible ? live(c.ts) : until(c.deadline, 'span')),
            h('span', {class: 'note'}, c.irreversible ? `since it was asked · it waits for your answer, with no end: ${IRREVERSIBLE[c.irreversible] ?? c.irreversible}`
              : `left of the wait, until ${hhmm(c.deadline)}; then the build goes on with ${sharedPick(c) != null ? 'the experts’ shared pick' : 'the recommended action'}`)))),
      h('div', {class: 'now-spacer'}),
      h('div', {class: 'now-next'}, h('span', {class: 'lbl'}, 'Last update'), h('span', {}, h('span', {'data-ago': t.lastTs})),
        pane?.status ? h('span', {}, `· the session is ${pane.status}`) : '',
        pane ? h('span', {class: 'right'}, jump(pane.id, 'Go to the session')) : '')));
  }
  const head = {
    queued: t.waitsAfter ? 'Waits for the task it needs and a free place' : 'Waits for a free place', building: t.investigating ? 'Its investigator examines it, before any story' : LEAD[leadOf(t)].head,
    planned: t.forOwner ? 'The plan waits for you' : t.talks.length ? 'The plan talk is done: the plan waits for the agent that builds it' : 'The plan waits for its talk companion',
    held: t.storiesWait ? 'The stories wait for your yes' : 'Waits for you', blocked: 'The agent stopped; Lem has to settle it', ready: 'Waits for its checks',
    landing: startsLanding(t) ? 'It starts its landing: the rebase onto the base, then the polish pass, before the checks' : t.landingStep ? stepRuns(t.landingStep) : 'The checks and the review run on it', open: 'Proposed: it waits for the merge', landed: 'Landed', drafted: 'A night draft waits for your word', dropped: 'Dropped',
    answered: 'Answered: it ended with a report and nothing to merge',
  }[t.status] ?? `Status "${t.status}"`;
  // What the investigation found, on every task that had one: the answer of an answered task, the cause of a fix.
  const x = t.investigation;
  const found = x ? [h('div', {class: 'now-ctx'}, h('b', {}, `${CALLS[x.call]?.now ?? x.call}: `), x.line, investigationSub(x) ? ` · ${investigationSub(x)}` : ''),
    h('div', {class: 'now-ctx'}, 'The report is investigation.md in the task directory')] : [];
  return keyed(`now:${t.slug}:${t.status}:${t.text}:${t.lastTs}:${x?.ts ?? ''}:${pane?.status ?? ''}`, h('div', {class: t.info.live ? '' : 'still'},
    h('div', {class: 'now-in'},
      h('div', {class: 'avatar'}, icon(t.info.icon)),
      h('div', {class: 'now-body'},
        h('div', {class: 'now-eyebrow'}, t.info.who === 'You' ? 'You act' : t.info.who === 'Nobody' ? 'Closed' : `${t.info.who} acts`),
        h('div', {class: 'now-head'}, head),
        t.shown ? h('div', {class: 'now-status'}, t.shown) : '',
        t.more.length ? h('div', {class: 'now-ctx'}, t.more.join(' · ')) : '',
        ...found,
        t.forOwner ? h('div', {class: 'now-ctx'}, h('b', {}, 'Where you answer: '), answerOf(t)) : '',
        h('div', {class: 'timer-row'}, h('span', {class: 'timer'}, t.closed ? stamp(t.since, Date.now()) : live(t.since)),
          h('span', {class: 'note'}, t.closed ? `after ${span(t.since - t.first)}` : 'in this state')))),
    h('div', {class: 'now-spacer'}),
    h('div', {class: 'now-next'}, h('span', {class: 'lbl'}, 'Last update'), h('span', {}, h('span', {'data-ago': t.lastTs})),
      pane?.status ? h('span', {}, `· the session is ${pane.status}`) : '',
      pane ? h('span', {class: 'right'}, jump(pane.id, 'Go to the session')) : '')));
}

// The step of the flow the task reached: the stories, the plan, the build, the machine checks, the
// review, the pull request. A task that waits for the owner or is blocked stays where it got to.
function phaseIndex(t) {
  const reached = t.reached;
  // an answered task ended with a report before any step of the flow that leads to a merge
  if (reached === 'answered') return -1;
  // a small change has no stories to wait in and no plan: its phases start at the change
  if (t.lead === 'small') return reached === 'landed' ? SMALL_PHASES.length : Math.max(0, phaseIndex({...t, lead: null}) - 2);
  if (reached === 'landed') return PHASES.length;
  if (reached === 'open') return 5;
  if (reached === 'landing') return t.reviews.length ? 4 : 3;
  if (reached === 'ready') return 3;
  if (reached === 'building') return t.planCommitted || t.progress ? 2 : 1;
  if (reached === 'planned' || reached === 'drafted') return 1;
  return 0;
}

function buildTaskProgress(t) {
  // A task whose bug or question a builder investigated first has that step before its stories: it
  // is the current one while the investigation runs, and done after it.
  // An answered task ended with its report: its phases are the investigation and the answer, both done.
  const lead = t.investigated ? 1 : 0;
  const answered = t.status === 'answered';
  const small = t.lead === 'small';
  const base = small ? SMALL_PHASES : PHASES;
  const phases = answered ? [...(lead ? ['Investigation'] : []), 'Answered'] : t.investigated ? ['Investigation', ...base] : base;
  const step = t.investigating ? 0 : answered ? -1 : phaseIndex(t) + lead;
  const past = t.investigating ? 0 : answered ? phases.length : step;
  const at_ = step;
  const p = t.progress;
  const done = ['landed', 'ready', 'landing', 'open'].includes(t.reached);
  const total = p?.of ?? 0, finished = done ? total : Math.max(0, (p?.n ?? 1) - 1), current = !done && p && t.status === 'building' ? 1 : 0;
  const review = t.reviews.at(-1);
  // a small change's phases are the full flow's from Build on: the change stands where the build does
  const sub = k => (k < lead ? (t.investigation ? CALLS[t.investigation.call]?.card ?? '' : '') : phaseSub(k - lead + (small ? 2 : 0)));
  const phaseSub = k => (k === 2 && p ? `task ${done ? p.of : p.n} of ${p.of}` : k === 3 && t.gates.length ? (t.gateBad ? `${t.gateBad} red` : `${t.gates.length} green`)
    : k === 4 && review ? review.verdict : k === 5 && t.proposal ? (t.proposal.green ? 'green' : 'not green') : '');
  // A choice the timeout or the experts took keeps the request from green; the two are counted apart.
  const taken = t.choices.filter(d => d.state !== 'waits').length;
  const timeouts = t.choices.filter(d => d.state === 'timeout' && d.by !== 'experts').length, experts = t.choices.filter(d => d.by === 'experts').length;
  return keyed(`prog:${t.slug}:${at_}:${p?.n}:${p?.of}:${t.status}:${t.gates.length}:${t.gateBad}:${t.reviews.map(r => r.verdict).join()}:${t.proposal?.green}:${t.commit?.head}:${t.asks.length}:${taken}:${timeouts}:${experts}`,
    h('div', {class: 'prog'},
      ring(finished, current, total || 1, total ? `${finished}/${total}` : '–', 'plan tasks'),
      h('div', {class: `phases a-${t.info.actor}`}, phases.map((name, k) => h('div', {class: `phase ${k < past ? 'past' : k === at_ ? 'cur' : ''}`}, h('i'), name, h('small', {}, sub(k))))),
      h('div', {class: 'stats'},
        stat('Who works on it', t.lead ? LEAD[leadOf(t)].tag : t.investigated ? 'investigator' : '–', t.lead ? LEAD[leadOf(t)].stat : t.investigated ? 'a builder examined the bug or the question first' : t.closed ? 'no agent was started' : 'no agent was started yet'),
        stat('Last commit', t.commit?.head ?? '–', t.commit ? t.commit.subject : t.closed ? 'no commit of its branch is on record' : 'no commit on its branch yet'),
        stat('Open for', t.closed ? span(t.since - t.first) : live(t.first), `opened ${stamp(t.first, Date.now())}`),
        stat('Checks', t.gates.length ? (t.gateBad ? 'red' : 'green') : '–', t.gates.length ? `${plural(t.gates.length, 'command')} in the last run` : t.status === 'answered' ? 'none: it ended with a report' : 'they run before the pull request', t.gates.length ? (t.gateBad ? 'bad' : 'ok') : ''),
        stat('Review', review ? review.verdict : '–', review ? `round ${review.round}, ${KIND[review.kind] ?? review.kind}` : t.status === 'answered' ? 'none: it ended with a report' : 'after the checks, before the proposal', review ? (review.verdict === 'clean' ? 'ok' : 'bad') : ''),
        stat('Decisions', t.asks.length ? `${t.asks.length} wait${t.asks.length === 1 ? 's' : ''}` : taken,
          t.choices.length ? `${taken} taken${timeouts ? `, ${timeouts} by the timeout` : ''}${experts ? `, ${experts} by the experts` : ''}` : t.closed ? 'none' : 'none yet',
          t.asks.length ? 'you' : timeouts || experts ? 'bad' : ''))));
}

function buildGate(t, now) {
  if (!t.gates.length) return [keyed('empty', h('div', {class: 'empty'}, 'The checks run when the branch’s turn to land comes'))];
  return t.gates.map((g, k) => keyed(`g:${k}:${g.exit}`, h('div', {class: `row a-${g.exit === 0 ? 'done' : 'bad'}`},
    h('span', {class: 'fi'}, icon(g.exit === 0 ? 'check' : 'alert')),
    h('div', {class: 'rtext'}, h('b', {}, g.exit === 0 ? 'green' : `exit ${g.exit}`), ' · ', h('span', {class: 'cmd'}, g.command ?? ''),
      h('span', {class: 'sub cmd'}, g.last ?? '', g.tip ? ` · on ${g.tip}` : '')),
    h('span', {class: 'rtime'}, stamp(g.ts, now)))));
}

// The stories are the owner's document: each as the lead wrote it, with the tests that hold it and
// what the last check of those tests gave. A word stands beside each mark, never a color alone.
// The stories as they stand: the newest approval's, with each change recorded after it applied in
// order (decisions.py `changes`). Texts compare with each run of spaces as one, as stories.py does.
const flat = text => String(text).split(/\s+/).filter(Boolean).join(' ');
function standing(t) {
  const a = t.approvals.at(-1);
  if (!a) return null;
  const texts = a.stories.map(st => st.text);
  const changes = t.changes.filter(c => c.approval === a.number);
  for (const c of changes) {
    if (c.how === 'added') texts.splice(c.story - 1, 0, c.now);
    else if (c.how === 'changed') texts[c.story - 1] = c.now;
    else texts.splice(c.story - 1, 1);
  }
  // The digest stories.py gives these texts, when an approval holds the same ones: a set of texts no
  // approval holds has none the page can name, since the page does not hash.
  const same = x => x.kind === a.kind && x.stories.length === texts.length && x.stories.every((st, i) => flat(st.text) === flat(texts[i]));
  const digest = changes.length ? t.approvals.findLast(same)?.digest ?? null : a.digest;
  return {approval: a, texts, changes, digest};
}

function buildStories(t, now) {
  const head = storiesHead(t, now);
  const current = standing(t);
  // Stories approved after the lead recorded the plan's (or before it wrote any) are the contract
  // now: the plan's older stories and their tests' results no longer stand for them.
  if (current && (!t.stories || current.approval.order > t.stories.order)) {
    const note = t.stories ? (t.closed ? 'approved after the plan’s stories were recorded, which were not recorded again' : 'approved after the plan’s stories were recorded: the agent records them again, with their tests')
      : t.closed ? 'no test of it is on record: the plan’s stories were never recorded' : 'no test yet: the agent adds its tests in the plan';
    return [...head, ...current.texts.map((text, i) => keyed(`story:${i + 1}:approved:${current.approval.number}:${text.length}`, h('div', {class: 'row a-quiet'},
      h('span', {class: 'fi'}, icon('file')),
      h('div', {class: 'rtext'}, h('b', {}, `${i + 1}. `), text, h('span', {class: 'sub'}, note)),
      h('span', {class: 'rtime'}, ''))))];
  }
  if (!t.stories) return head.length ? head : [keyed('empty', h('div', {class: 'empty'}, 'The agent writes the stories at the top of the plan'))];
  return [...head, ...storyRows(t)];
}

// What happened to the stories before the build: his approval, or Lem's in his name for a
// correction, and the personas' read, with a split between the model families said first. Then
// each change of an approved story during the build, from its own record.
function storiesHead(t, now) {
  const rows = [];
  const a = t.approvals.at(-1), r = t.reads.at(-1);
  const kind = t.stories?.kind ?? a?.kind;
  // An approval of his after a change of the build made that change his (decisions.py
  // `taken_over_by`): it is no cause of not green.
  const takenOver = c => t.approvals.find(x => x.number > c.approval && x.by === 'owner')?.number ?? null;
  if (r && r.answered === 0) {
    // A read in which no persona answered is no read: it found nothing, and it says so in the bad color.
    rows.push(keyed(`read:${r.ts}:silent`, h('div', {class: 'row a-bad'},
      h('span', {class: 'fi'}, icon('alert')),
      h('div', {class: 'rtext'}, h('b', {}, 'Nobody answered the personas’ read'), ` (0 of ${r.asked}), run by ${r.by === 'lead' ? 'the agent' : 'Lem'}: it found nothing, either way`,
        r.silent.map(x => h('span', {class: 'sub'}, `no answer from ${x.name} (${x.why})`))),
      h('span', {class: 'rtime'}, stamp(r.ts, now)))));
  } else if (r) {
    const doubt = r.split || r.flagged > 0;
    // As land.py `unread` says it: only when the stories as they stand are not the ones read, and
    // then what changed them, an approval of his with other stories or a change of the build.
    const st = standing(t);
    const read = t.approvals.find(x => x.digest === r.digest);
    const differ = st && (st.digest ? st.digest !== r.digest : !read || read.stories.length !== st.texts.length || read.stories.some((x, i) => flat(x.text) !== flat(st.texts[i])));
    const his = t.approvals.filter(x => x.by === 'owner' && x.order > r.order && x.digest !== r.digest).at(-1);
    const changed = t.changes.some(c => c.order > r.order);
    const stale = differ ? `The stories changed after this read${[his && ` by your approval ${his.number}`, changed && ' by a change of the build'].filter(Boolean).join(' and')}, and the change was not read.` : '';
    rows.push(keyed(`read:${r.ts}:${stale}`, h('div', {class: `row a-${doubt ? 'you' : 'done'}`},
      h('span', {class: 'fi'}, icon('users')),
      h('div', {class: 'rtext'},
        r.split ? h('b', {}, 'The two model families split on a story. ') : '',
        h('b', {}, r.flagged ? `${r.flagged} of ${plural(r.stories, 'story').replace('storys', 'stories')} flagged` : 'Nobody confused'),
        ` · read by ${r.answered} of ${r.asked} personas, ${FAMILIES[r.families.length] ?? `${r.families.length} model families`} (${r.families.join(', ')}), run by ${r.by === 'lead' ? 'the agent' : 'Lem'}`,
        r.silent.map(x => h('span', {class: 'sub'}, `no answer from ${x.name} (${x.why})`)),
        stale ? h('span', {class: 'sub'}, stale) : ''),
      h('span', {class: 'rtime'}, stamp(r.ts, now)))));
  } else if (kind === 'correction') {
    rows.push(keyed('read:none:correction', h('div', {class: 'row a-quiet'}, h('span', {class: 'fi'}, icon('users')),
      h('div', {class: 'rtext'}, 'The personas do not read the one story of a small change.'), h('span', {class: 'rtime'}, ''))));
  } else if (kind) {
    rows.push(keyed('read:none', h('div', {class: 'row a-quiet'}, h('span', {class: 'fi'}, icon('users')),
      h('div', {class: 'rtext'}, t.closed ? 'The personas did not read these stories.' : 'The personas have not read these stories yet.'), h('span', {class: 'rtime'}, ''))));
  }
  if (a) {
    // Who froze the stories: he did; Lem in his name, for a correction; or the personas' read on
    // the rare path, which found nobody confused and never counts as his yes.
    const head = {owner: 'Approved by you', correction: 'Taken as a small change: Lem approved its one story in your name', read: 'Frozen by the personas’ read, with no wait for you'}[a.by] ?? `Approved by ${a.by}`;
    rows.push(keyed(`approved:${a.ts}:${a.by}:${a.number}`, h('div', {class: `row a-${a.by === 'owner' ? 'done' : 'quiet'}`},
      h('span', {class: 'fi'}, icon(a.by === 'owner' ? 'check' : a.by === 'read' ? 'users' : 'user')),
      h('div', {class: 'rtext'}, h('b', {}, head),
        r && a.by === 'owner' ? (r.order < a.order ? ' after the personas’ read' : ' before the personas’ read was in') : '',
        a.by === 'correction' ? h('span', {class: 'sub'}, 'You may still say “this is a feature”: then the personas read it, and your approval replaces this one.') : '',
        a.by === 'read' ? h('span', {class: 'sub'}, 'The whole request was written, and nobody was confused: the build started, and you can still stop it or change a story.') : '',
        a.number > 1 || a.replaces != null ? h('span', {class: 'sub'}, `approval ${a.number}${typeof a.replaces === 'number' ? `; it replaces approval ${a.replaces}` : a.replaces ? '; it replaces an earlier approval' : ''}`) : ''),
      h('span', {class: 'rtime'}, stamp(a.ts, now)))));
  } else if (r && !(r.split || r.flagged > 0) && t.blocks.some(b => b.status === 'building' && b.ts >= r.ts) && !t.storiesWait) {
    // an older log, from before the read froze the stories: the build that started after the read shows it
    rows.push(keyed('approved:none', h('div', {class: 'row a-quiet'}, h('span', {class: 'fi'}, icon('play')),
      h('div', {class: 'rtext'}, 'The build started with no wait for you: nobody was confused.'), h('span', {class: 'rtime'}, ''))));
  }
  for (const c of t.changes) {
    const said = c.how === 'changed' ? `was “${c.was}”, now “${c.now}”` : c.how === 'added' ? `“${c.now}”` : `was “${c.was}”`;
    const who = c.choice != null ? `after choice ${c.choice}` : `by ${BY_WHOM[c.by] ?? c.by}${c.said ? `: ${c.said}` : ''}`;
    const his = takenOver(c);
    rows.push(keyed(`change:${c.change}:${his}`, h('div', {class: `row a-${his ? 'done' : 'you'}`}, h('span', {class: 'fi'}, icon(his ? 'check' : 'alert')),
      h('div', {class: 'rtext'}, h('b', {}, `Story ${c.story} ${c.how === 'changed' ? 'changed' : c.how === 'added' ? 'was added' : 'was removed'} during the build`),
        h('span', {class: 'sub'}, said),
        h('span', {class: 'sub'}, `${c.why} · ${who} · `, his ? `Approved by you afterwards (approval ${his}): it is yours, and no cause of not green` : 'the pull request is not green for it')),
      h('span', {class: 'rtime'}, stamp(c.ts, now)))));
  }
  return rows;
}

// Each decision of the build: the choices that wait for the owner first, each with the time its wait
// ends, then every one in the record's order with what was chosen, by whom and why.
function buildDecisions(t, now) {
  if (!t.choices.length && !t.orphans.length) return [keyed('empty', h('div', {class: 'empty'}, 'Each decision the build takes, and each choice that waits for you, comes here'))];
  const waiting = new Set(t.waiting);
  const rows = [...t.waiting, ...t.choices.filter(d => !waiting.has(d))].map(d => {
    if (waiting.has(d)) {
      const over = !d.irreversible && d.deadline <= now;
      return keyed(`d:${d.id}:waits:${over}`, h('div', {class: `row a-${over ? 'bad' : 'you'}`}, h('span', {class: 'fi'}, icon(over ? 'clock' : 'help')),
        h('div', {class: 'rtext'}, h('b', {}, over ? `Choice ${d.id}, its wait is over: ` : `Choice ${d.id} waits for you: `), d.what,
          h('span', {class: 'sub'}, `options: ${d.options.join(' · ')}`),
          h('span', {class: 'sub'}, `recommended: ${d.recommended}, because ${d.why}`),
          d.said ? h('span', {class: 'sub'}, `the personas: ${d.said}`) : '',
          // the experts' advice, one line each, and a line for one whose advice has not come
          Object.keys(d.advice).length ? Object.keys(EXPERTS).map(key => h('span', {class: 'sub'}, d.advice[key] ? adviceLine(key, d.advice[key], false) : `${expertName(key)}: no advice yet`))
            : h('span', {class: 'sub'}, 'No expert advised on it yet.'),
          h('span', {class: 'sub'}, d.irreversible ? `It waits for your answer, with no end: ${IRREVERSIBLE[d.irreversible] ?? d.irreversible}, so no timeout takes it. The experts advise on it and never take it. The rest of the plan goes on.`
            : over ? `Its wait ended at ${hhmm(d.deadline)}, and no timeout is written yet: the build goes on with ${endOf(d, true)}.`
              : `Its wait ends at ${hhmm(d.deadline)}; then the build goes on with ${endOf(d, false)}.`),
          over ? h('span', {class: 'sub'}, `An answer of yours now comes after the wait: “${sharedPick(d) ?? d.recommended}” stands, and an answer that differs is a correction for the agent that builds it.`)
            : h('span', {class: 'sub'}, h('b', {}, 'Where you answer: '), answerOf(t, d))),
        h('span', {class: 'rtime'}, d.irreversible ? 'no end' : over ? 'wait over' : until(d.deadline))));
    }
    if (d.kind === 'asked' && d.state === 'waits') {
      // a choice of a task that ended with no answer
      return keyed(`d:${d.id}:ended`, h('div', {class: 'row a-quiet'}, h('span', {class: 'fi'}, icon('x')),
        h('div', {class: 'rtext'}, h('b', {}, `${d.id}. `), d.what, h('span', {class: 'sub'}, `The task is ${t.status}: this choice no longer waits, and it needs no answer.`)),
        h('span', {class: 'rtime'}, stamp(d.ts, now))));
    }
    // A choice the timeout or the experts took is marked alike: neither is his answer, and each keeps the request from green.
    const timeout = d.state === 'timeout' || d.state === 'settled';
    const late = d.late ? [h('span', {class: 'sub'}, `Your answer came at ${hhmm(d.late.ts)}, after ${d.state === 'settled' ? 'the experts took it' : 'the wait'}: “${d.late.chose}”${d.late.words ? ` (${d.late.words})` : ''}. `,
      d.late.chose === d.chose ? 'It is what was taken.' : 'It differs from what was taken: a correction for the agent that builds it.')] : [];
    const how = d.kind === 'taken' ? `taken by ${BY_WHOM[d.by] ?? d.by}, because ${d.why}`
      : d.state === 'answered' ? `answered by you${d.instead ? ', with none of the options' : ''}${d.words ? `: “${d.words}”` : ''}${d.ownerWhy ? `, because ${d.ownerWhy}` : ''}`
        : d.state === 'settled' ? `taken by the experts at ${hhmm(d.ended)}, while you were away, before its wait ended: both picked it. The pull request is not green for it.`
          : d.by === 'experts' ? `taken by the experts at the end of the wait, at ${hhmm(d.ended)}: no answer came in ${d.wait ?? '?'} minutes, and both picked it. The pull request is not green for it.`
            : `taken by the timeout at ${hhmm(d.ended)}: no answer came in ${d.wait ?? '?'} minutes. The recommended action stands, and the pull request is not green for it.`;
    // The experts' reasons: from the line that took their pick, else from their advice. Advice that
    // did not decide (a split, or none fits) is shown as theirs, beside what was taken.
    const reasons = d.experts ?? Object.fromEntries(Object.entries(d.advice).map(([key, a]) => [key, a.why]));
    const experts = d.by === 'experts'
      ? Object.entries(reasons).map(([key, why]) => h('span', {class: 'sub'}, adviceLine(key, {pick: d.chose, why}, true)))
      : d.kind === 'asked' && Object.keys(d.advice).length ? [h('span', {class: 'sub'}, `the experts ${sharedPick(d) == null && Object.keys(d.advice).length > 1 ? 'split' : 'advised'}: ${adviceLines(d, true).join(' · ')}`)] : [];
    return keyed(`d:${d.id}:${d.state}:${Boolean(d.late)}`, h('div', {class: `row a-${timeout ? 'bad' : 'done'}`}, h('span', {class: 'fi'}, icon(timeout ? 'clock' : d.by === 'owner' ? 'user' : d.by === 'personas' ? 'users' : 'check')),
      h('div', {class: 'rtext'}, h('b', {}, `${d.id}. `), d.what, ' → ', h('b', {}, d.chose), h('span', {class: 'sub'}, how), experts,
        d.said ? h('span', {class: 'sub'}, `the personas: ${d.said}`) : '', d.undo ? h('span', {class: 'sub'}, `to undo: ${d.undo}`) : '', late),
      h('span', {class: 'rtime'}, stamp(d.ended ?? d.ts, now))));
  });
  for (const o of t.orphans) {
    rows.push(keyed(`orphan:${o.id}:${o.kind}:${o.ts}`, h('div', {class: 'row a-bad'}, h('span', {class: 'fi'}, icon('alert')),
      h('div', {class: 'rtext'}, `An outcome (${o.kind}) of choice ${o.id}, whose question is not in the log`, o.chose ? `: ${o.chose}` : ''), h('span', {class: 'rtime'}, stamp(o.ts, now)))));
  }
  return rows;
}

function storyRows(t) {
  // A result counts only for the stories and tests it ran on: a story or a test that changed
  // since has no check yet. The row names the commit the check ran on, because the page cannot
  // know of a commit that came after it.
  const current = Boolean(t.red?.digest) && t.red.digest === t.stories.digest;
  const results = new Map((current ? t.red.tests : []).map(r => [`${r.story}|${r.command}`, r]));
  return t.stories.list.map(st => {
    const checked = (st.tests ?? []).map(test => results.get(`${st.n}|${test.command}`));
    const bad = checked.some(r => r?.problem);
    const held = (st.tests ?? []).length > 0 && checked.every(r => r && !r.problem);
    const state = bad ? 'bad' : held ? 'done' : 'quiet';
    return keyed(`story:${st.n}:${state}:${st.text.length}:${(st.tests ?? []).length}`, h('div', {class: `row a-${state}`},
      h('span', {class: 'fi'}, icon(bad ? 'alert' : held ? 'check' : 'file')),
      h('div', {class: 'rtext'}, h('b', {}, `${st.n}. `), st.text,
        (st.tests ?? []).map((test, k) => h('span', {class: 'sub cmd'}, test.command, ' · ',
          checked[k]?.problem ?? (checked[k] ? `passes on the branch, fails on the base commit${t.red.tip ? ` (checked on ${t.red.tip})` : ''}` : t.closed ? 'no check of it is on record' : 'not checked yet'))),
        st.no_test ? h('span', {class: 'sub'}, `no test: ${st.no_test}`) : '',
        !(st.tests ?? []).length && !st.no_test ? h('span', {class: 'sub'}, t.closed ? 'no test' : 'no test yet') : ''),
      h('span', {class: 'rtime'}, bad ? 'not held' : held ? 'held by its tests' : '')));
  });
}

// ---- render ----

const $ = id => document.getElementById(id);
let lastTitle = '';

// ---- the backlog tab ----

// Who can act next, when the backlog skill's sorting has judged the items; the item's own `worth`
// otherwise. A color never stands alone here: each group has its word and its count beside its
// mark, and the one for what is decided against is the quiet one, with a dashed edge.
const BY_WHO = [
  {key: 'owner', name: 'Needs you', actor: 'you', test: it => it.worth !== 'no' && it.who === 'owner'},
  {key: 'agent', name: 'An agent can take it', actor: 'lead', test: it => it.worth !== 'no' && it.who === 'agent'},
  {key: 'waiting', name: 'Waits for something', actor: 'gate', test: it => it.worth !== 'no' && it.who === 'waiting'},
  {key: 'unjudged', name: 'Not judged yet', actor: 'quiet', test: it => it.worth !== 'no' && !it.who},
  {key: 'decided', name: 'Decided against', actor: 'quiet', recessive: true, test: it => it.worth === 'no'},
];
const BY_WORTH = [
  {key: 'yes', name: 'Worth doing', actor: 'gate', test: it => it.worth === 'yes'},
  {key: 'later', name: 'Later', actor: 'you', test: it => it.worth === 'later'},
  {key: 'unset', name: 'No verdict in the item', actor: 'quiet', test: it => it.worth === 'unset'},
  {key: 'no', name: 'Decided against', actor: 'quiet', recessive: true, test: it => it.worth === 'no'},
];
const WHO = {owner: 'needs you', agent: 'an agent can take it', waiting: 'waits'};
// A path is typed into a session as text. Anything but plain path characters is refused, so that
// no file name can be read as more than a name there.
const SAFE_PATH = /^[A-Za-z0-9._\/-]+$/;
const commandFor = it => `/lem new ${it.path}`;
// Whether the agent runs in a session, from the argv agterm reports for its foreground. Only the
// program counts: the first word is the `claude` command, or a shell whose `-c` line starts with
// it. A file named claude that a pager or an editor shows is an argument, not the program, and a
// typed line would land in that program.
function agentRuns(pane) {
  const argv = pane?.foreground ?? [];
  const program = String(argv[0] ?? '').split('/').at(-1);
  if (program === 'claude') return true;
  const line = argv.indexOf('-c');
  return /^(fish|zsh|bash|sh)$/.test(program) && line > 0 && /^claude(\s|$)/.test(String(argv[line + 1] ?? ''));
}
const daysOld = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso) ? Math.max(0, Math.round((Date.now() - new Date(`${iso}T12:00:00`).getTime()) / 86400000)) : null;

function shownItems() {
  const words = bl.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const all = backlog?.items ?? [];
  if (!words.length) return all;
  return all.filter(it => { const hay = `${it.title} ${it.slug} ${it.where} ${it.body}`.toLowerCase(); return words.every(w => hay.includes(w)); });
}
const groupsOf = items => (backlog?.judged ? BY_WHO : BY_WORTH).map(g => ({...g, items: items.filter(g.test)})).filter(g => g.items.length);
const orderOf = items => groupsOf(items).flatMap(g => g.items.map(it => it.slug));

function itemActions(it) {
  const cmd = commandFor(it);
  const sent = bl.sent.get(it.slug);
  const lem = paneOf(meta.session);
  if (sent?.ok) return [h('span', {class: 'bl-note'}, `Typed into Lem’s session at ${hhmm(sent.at)}: `), h('code', {}, cmd), lem ? jump(lem.id, 'Go to Lem') : null];
  if (sent?.pending) return [h('span', {class: 'bl-note'}, 'Typing into Lem’s session… '), h('code', {}, cmd)];
  if (!SAFE_PATH.test(it.path)) return [h('span', {class: 'bl-note bad'}, 'The name of this file has a character that is not typed into a session. Start the task yourself in Lem’s session.')];
  const failed = sent ? h('span', {class: 'bl-note bad'}, `It was not typed (${sent.why}). Type it yourself in Lem’s session: `) : null;
  if (failed) return [failed, h('code', {}, cmd)];
  // typed only into a session where an agent runs: at a bare shell prompt the line would be a shell command
  const ready = typeof agterm !== 'undefined' && agentRuns(lem);
  if (!ready) return [h('span', {class: 'bl-note'}, lem ? 'No agent runs in Lem’s session now. To start a task, type there: ' : 'Lem’s session is not open in this window. To start a task, type in it: '), h('code', {}, cmd)];
  if (bl.confirm === it.slug) return [
    h('span', {}, 'This types ', h('code', {}, cmd), ' into Lem’s session, and Lem opens a task for the item.'),
    h('button', {class: 'jump go', type: 'button', 'data-bl-start': it.slug}, 'Start'),
    h('button', {class: 'jump', type: 'button', 'data-bl-cancel': it.slug}, 'Cancel ', h('kbd', {}, 'Esc')),
  ];
  return [h('button', {class: 'jump', type: 'button', 'data-bl-ask': it.slug}, 'Start a task ', h('kbd', {}, 'S')), h('span', {class: 'bl-note'}, 'as '), h('code', {}, cmd)];
}

function itemRow(it) {
  const days = daysOld(it.added);
  const open = bl.open.has(it.slug);
  const tag = (text, title, c) => h('span', {class: 'tag', title, style: c ? `--c: var(--${c})` : null}, h('span', {}, text));
  return h('div', {class: `bl-item${bl.cursor === it.slug ? ' cur' : ''}`, 'data-bl-item': it.slug},
    h('button', {class: 'bl-head', type: 'button', 'data-bl-toggle': it.slug, 'aria-expanded': String(open)},
      h('span', {class: 'bl-title'}, it.title),
      h('span', {class: 'bl-side'},
        it.state === 'unreadable' ? tag('cannot be read', 'The file of this item is a link to nothing, a folder, or not readable', 'bad')
          : it.state ? tag(it.state === 'new' ? 'new, not committed' : 'edited, not committed', 'git does not have this version of the item yet', 'gate') : null,
        backlog.judged && it.who ? tag(WHO[it.who] + (it.confidence != null ? ` · ${Number(it.confidence).toFixed(2)}` : ''), 'Who can act next, as the backlog’s sorting judged it. A number near 0.5 is close to a coin toss.') : null,
        backlog.judged ? tag(`worth: ${it.worth}`, 'The verdict in the item itself') : null,
        days != null ? tag(days === 0 ? 'today' : `${days} d`, `added ${it.added}`) : null),
      it.where ? (it.where_problem
        ? h('span', {class: 'bl-where stale', title: 'The place this item points at is not there any more. The item may be done, or the code moved.'}, icon('alert'), h('span', {}, `${it.where} · ${it.where_problem}`))
        : h('span', {class: 'bl-where'}, it.where)) : h('span', {class: 'bl-where'}, 'no place in the code named')),
    open ? h('div', {class: 'bl-body'},
      h('div', {class: 'bl-text'}, it.body || 'The item has no text below its title.'),
      h('div', {class: 'bl-actions'}, ...itemActions(it))) : null);
}

function renderBacklog() {
  const all = backlog?.items ?? [];
  const items = shownItems();
  const order = orderOf(items);
  if (bl.cursor && !order.includes(bl.cursor)) bl.cursor = null;
  const stale = all.filter(it => it.where_problem).length;
  const broken = all.filter(it => it.state === 'unreadable').length;
  $('bl-sum').replaceChildren(
    bl.reading ? 'reading… ' : '',
    backlogProblem ? h('span', {class: 'error'}, `${backlogProblem} · `) : '',
    backlog ? `${bl.q.trim() ? `${items.length} of ${all.length}` : plural(all.length, 'item')} in ${backlog.folder} · ${stale ? `${plural(stale, 'item')} ${stale === 1 ? 'names' : 'name'} a place that is gone or cannot be read` : 'every place named is there'} ${broken ? ` · ${broken} cannot be read` : ''} · ${backlog.judged ? 'sorted by who can act' : 'sorted by the verdict in each item'} · read ${stamp(new Date(backlog.read).getTime(), Date.now())}` : '');
  const groups = groupsOf(items).map(g => h('div', {class: `bl-group a-${g.actor}${g.recessive ? ' recessive' : ''}`},
    h('div', {class: 'lane-head'}, h('i', {}), g.name, h('em', {}, g.items.length)),
    g.items.map(itemRow)));
  $('bl-groups').replaceChildren(...(groups.length ? groups : [h('div', {class: 'lane-empty'},
    !backlog ? (backlogProblem ?? 'The backlog was not read yet.') : all.length ? 'No item has these words.' : `No item in ${backlog.folder}. The polish pass of a landing files items, and /lem backlog adds one.`)]));
}

async function readBacklog() {
  bl.reading = true;
  bl.confirm = null;
  if (tab === 'backlog') renderBacklog();
  const got = await readScript('backlog.js', 'lemBacklog', 0);
  bl.reading = false;
  if (got.records?.length) { backlog = got.records.at(-1); backlogProblem = null; }
  else backlogProblem = got.problem ?? 'backlog.js is missing: open the board with board.py again';
  // drawn again whatever the read gave: the same file a second time still ends the "reading" note
  blDrawn = null;
  render();
}

function setTab(next) {
  if (view || tab === next) return;
  tab = next;
  history.replaceState(null, '', next === 'backlog' ? '#backlog' : location.pathname + location.search);
  if (next === 'backlog') readBacklog(); else render();
  window.scrollTo(0, 0);
}

function askToStart(slug) {
  if (bl.sent.get(slug)?.ok || bl.sent.get(slug)?.pending) return;
  bl.open.add(slug);
  bl.cursor = slug;
  bl.confirm = slug;
  renderBacklog();
  // The Start button takes the focus: Enter then starts, Tab and Enter on Cancel cancels, and a
  // key press anywhere else starts nothing.
  document.querySelector('[data-bl-start]')?.focus();
}

function moveCursor(step) {
  const order = orderOf(shownItems());
  if (!order.length) return;
  const at = order.indexOf(bl.cursor);
  bl.cursor = order[at < 0 ? (step > 0 ? 0 : order.length - 1) : Math.min(order.length - 1, Math.max(0, at + step))];
  bl.confirm = null;
  renderBacklog();
  document.querySelector(`[data-bl-item="${CSS.escape(bl.cursor)}"]`)?.scrollIntoView({block: 'nearest'});
}

async function startTask(slug) {
  const it = backlog?.items.find(x => x.slug === slug);
  const lem = paneOf(meta.session);
  // only the item whose question is open, and one time: a second key press must not open a second task
  const before = bl.sent.get(slug);
  if (!it || !SAFE_PATH.test(it.path) || bl.confirm !== slug || before?.ok || before?.pending) return;
  bl.confirm = null;
  // marked before the request goes out: until agterm answers, a second key press finds the item taken
  bl.sent.set(slug, {pending: true});
  renderBacklog();
  try {
    if (typeof agterm === 'undefined' || !agentRuns(lem)) throw new Error('no agent runs in Lem’s session');
    await agterm.request('session.type', {target: lem.id, args: {text: `${commandFor(it)}\n`}});
    bl.sent.set(slug, {ok: true, at: Date.now()});
  } catch (err) {
    bl.sent.set(slug, {ok: false, why: err?.message ?? String(err)});
  }
  renderBacklog();
}

function render() {
  const now = Date.now();
  const m = derive(now);
  const t = m.task;
  const trouble = [...Object.values(problems), treeProblem].filter(Boolean);
  const repo = meta.repo ?? 'this repository';
  const page = $('page');
  page.className = `page a-${t ? t.info.actor : focusOf(m)?.t.info.actor ?? 'quiet'}`;
  $('beacon').className = `beacon${trouble.length ? ' bad' : ''}`;
  $('eyebrow').textContent = (meta.demo ? 'Demo data · ' : '') + (view ? `Lem · ${repo} · one task` : `Lem · ${repo}`);
  patch($('banners'), buildBanners(m));

  if (view) tab = 'tasks';
  const tabButton = (key, label, count) => keyed(`${key}:${tab === key}:${count ?? ''}`, h('button', {class: 'tab', type: 'button', role: 'tab', 'aria-selected': String(tab === key), 'data-tab': key}, label, count != null ? h('em', {}, count) : null));
  patch($('tabs'), view ? [] : [tabButton('tasks', 'Tasks', m.list.filter(x => !x.closed).length), tabButton('backlog', 'Backlog', backlog ? backlog.items.filter(it => it.worth !== 'no').length : null)]);
  $('tabs').hidden = Boolean(view);
  $('backlog').hidden = tab !== 'backlog';
  for (const n of document.querySelectorAll('[data-tasks]')) n.hidden = tab === 'backlog';
  // The backlog is drawn again only when what it shows from outside changed: this function runs
  // every second, and a redraw takes the focus and a text selection away from the reader.
  const lemNow = paneOf(meta.session);
  const outside = tab === 'backlog' ? `${backlog?.read}|${backlogProblem}|${bl.reading}|${lemNow?.id}|${agentRuns(lemNow)}` : '';
  if (tab === 'backlog' && outside !== blDrawn) renderBacklog();
  blDrawn = outside;

  const lem = paneOf(meta.session);
  const right = [];
  if (view) right.push(keyed('back', h('button', {class: 'jump back', type: 'button', 'data-open': ''}, icon('arrow'), ' ', 'All tasks')));
  if (lem) right.push(keyed(`lem:${lem.status ?? ''}`, jump(lem.id, `Go to Lem${lem.status ? ` (${lem.status})` : ''}`)));
  patch($('top-right'), right);

  const chip = (key, name, cls, ...kids) => keyed(key, h('span', {class: `chip ${cls}`}, icon(name), ...kids));
  if (view) {
    $('title').textContent = t?.title ?? titleOf(view);
    $('ask').textContent = t?.ask ?? '';
    patch($('meta'), t ? [
      keyed(`st:${t.status}`, statusPill(t)),
      t.branch ? chip('branch', 'branch', 'mono', t.branch) : null,
      // an answered or dropped task lands nowhere
      meta.base && !['answered', 'dropped'].includes(t.status) ? chip('base', 'flag', '', 'lands on ', h('b', {}, meta.base)) : null,
      ...tags(t).map((n, i) => keyed(`tag:${i}`, n)),
    ] : []);
    $('now').className = `card now a-${t?.info.actor ?? 'quiet'}`;
    patch($('now'), t ? [buildTaskNow(t)] : []);
    patch($('progress'), t ? [buildTaskProgress(t)] : []);
    patch($('stories'), t ? buildStories(t, now) : []);
    const approved = t?.approvals.at(-1);
    $('stories-sum').textContent = t?.stories && !(approved && approved.order > t.stories.order) ? `${storyKind(t.stories.kind)}, because ${t.stories.why}` : approved ? `${storyKind(approved.kind)}, because ${approved.why}` : '';
    patch($('decisions'), t ? buildDecisions(t, now) : []);
    const overs = t ? t.waiting.length - t.asks.length : 0;
    $('decisions-sum').textContent = t?.choices.length ? [t.asks.length && `${t.asks.length} wait${t.asks.length === 1 ? 's' : ''} for you`,
      overs && `${overs} with the wait over`, `${t.choices.filter(d => d.state !== 'waits').length} taken`].filter(Boolean).join(' · ') : '';
    patch($('gate'), t ? buildGate(t, now) : []);
    $('gate-sum').textContent = t?.gates.length ? (t.gateBad ? `${t.gateBad} of ${t.gates.length} red` : `${plural(t.gates.length, 'command')} green`) : '';
  } else {
    // counted by lane, so the numbers add up to the cards: a task that builds while a choice waits for you is counted where it waits
    const inBuild = status => m.lane.build.filter(x => x.status === status).length;
    const parts = [m.forOwner.length && `${m.forOwner.length} wait${m.forOwner.length === 1 ? 's' : ''} for you`, inBuild('building') && `${inBuild('building')} build${inBuild('building') === 1 ? 's' : ''}`,
      m.lane.checks.length && `${m.lane.checks.length} in checks and review`, inBuild('queued') && `${inBuild('queued')} queued`,
      inBuild('planned') && `${inBuild('planned')} wait for their plan talk`, inBuild('blocked') && `${inBuild('blocked')} blocked`].filter(Boolean);
    $('title').textContent = parts.length ? parts.join(', ') : m.list.length ? 'Nothing runs' : 'Waiting for the first task';
    $('ask').textContent = '';
    // Each number once: the title counts the lanes, each lane counts its cards, and a chip says only
    // what no other place says: the places, how many proposed requests are not green, what landed today.
    const full = typeof m.limit === 'number' && m.places >= m.limit;
    // green by the proposal's record, or by the line `green` its state block carries (stages/land.md)
    const green = x => (x.proposal ? x.proposal.green : x.blocks.at(-1).lines.some(line => line === 'green'));
    const notGreen = m.proposed.filter(x => !green(x)).length;
    patch($('meta'), [
      meta.base ? chip('base', 'branch', '', 'tasks land on ', h('b', {}, meta.base)) : null,
      keyed(`limit:${m.places}:${m.limit}`, h('span', {class: `chip${full ? ' you' : ''}`, title: `How many tasks build or land at one time, of the ${m.limit ?? '?'} the project lets (flow.max_tasks)${full ? ': the limit is reached, and a new task is queued' : ''}`},
        icon('layers'), h('b', {}, `${m.places} of ${m.limit ?? '?'}`), ' places')),
      m.proposed.length ? chip(`proposed:${m.proposed.length}:${notGreen}`, 'branch', notGreen ? 'you' : '', h('b', {}, m.proposed.length), ' proposed', notGreen ? ` · ${notGreen} not green` : ', green') : null,
      m.landedToday.length ? chip(`today:${m.landedToday.length}`, 'check', 'ok', h('b', {}, m.landedToday.length), ' landed today') : null,
    ]);
    $('now').className = `card now brief a-${focusOf(m)?.t.info.actor ?? 'done'}`;
    patch($('now'), [buildBoardNow(m)]);
    patch($('progress'), []);
    patch($('lanes'), buildLanes(m));
  }
  // the head of a task's board is its name and its ask; the head of the board of all tasks counts them
  $('title').removeAttribute('title');
  if (!view) define($('title'));
  $('lanes-section').hidden = Boolean(view) || tab === 'backlog';
  // the board of all tasks has no progress card: its numbers are in the title, the chips and the lanes
  $('progress').hidden = !view;
  $('hero').classList.toggle('one', !view);
  $('hero').classList.toggle('closed', Boolean(view && t?.closed));
  // The board of all tasks has only the activity in this row, across the page. A card of a task
  // that ended with nothing in it is not drawn: an answered task has no stories, checks or review.
  $('cols').classList.toggle('one', !view);
  $('stack').hidden = !view;
  const empty = id => t?.closed && [...$(id).children].every(n => n.dataset.key === 'empty');
  for (const id of ['stories', 'decisions', 'gate']) { const none = empty(id); if (none) patch($(id), []); $(`${id}-card`).hidden = !view || none; }

  // On the board the timeline holds the tasks that are open and the ones that closed today, a row
  // for each by its state; the board of one task has a row for each actor that held its work.
  if (view && t) {
    const {card, model, rows} = buildTimeCard(m, t, $('tl-wrap').clientWidth);
    patch($('legend'), buildTimeLegend(model, rows));
    patch($('timeline'), [card]);
    // one short line under the card; the rest is the hover of the legend
    $('tl-note').textContent = 'Each row is who held the work; a band is a stage. Hover the legend for how the shares add up.';
    $('legend').title = 'Rows overlap where the build goes on while a choice waits for you, so the shares need not add up to 100. '
      + 'Each stage runs from its logged start to the event that ends it. In a log written before the stages logged their starts, '
      + 'the personas’ read and a plan talk with no start are a dot where they ended, and a polish pass runs from the event before it.';
  } else {
    const shown = view ? [] : m.list.filter(x => !x.closed || dayKey(x.since) === dayKey(now)).sort((a, b) => a.first - b.first);
    patch($('legend'), buildLegend(m, shown));
    patch($('timeline'), [buildTimeline(m, shown, $('tl-wrap').clientWidth)]);
    $('tl-note').textContent = '';
    $('legend').removeAttribute('title');
  }

  patch($('review'), view && t ? buildReview(t, now) : []);
  { const none = empty('review'); if (none) patch($('review'), []); $('review-card').hidden = !view || none; }
  $('review-sum').textContent = view && t?.reviews.length ? plural(t.reviews.length, 'round') : '';
  const feed = view ? events.filter(e => e.task === view) : events;
  patch($('feed'), buildFeed(m, feed));
  $('feed-sum').textContent = plural(feed.length, 'event');

  patch($('foot'), [
    keyed(`f:${trouble.join()}:${events.length}`, h('span', {}, trouble.length ? h('span', {class: 'error'}, `${trouble.join(' · ')} · `) : '',
      'events.js last read cleanly ', h('span', {'data-ago': lastGoodRead}), ` · ${plural(events.length, 'event')}`)),
    keyed('rates', h('span', {}, `files read every ${FEED_EVERY_MS / 1000}s · sessions every ${TREE_EVERY_MS / 1000}s`)),
  ]);
  tick(now);

  const title = (trouble.length ? 'PROBLEM · ' : '') + (meta.demo ? 'DEMO · ' : '') + (tab === 'backlog' ? `Backlog · ${repo} · ` : '') + (view ? `${t?.title ?? view} · ${t?.info.label ?? 'no state'}` : `Lem · ${m.lane.build.filter(x => x.status === 'building').length} build · ${m.forOwner.length} for you`);
  if (title !== lastTitle) document.title = lastTitle = title;
}

function tick(now) {
  for (const n of document.querySelectorAll('[data-since]')) {
    const ms = now - Number(n.dataset.since);
    n.textContent = span(ms);
  }
  for (const n of document.querySelectorAll('[data-ago]')) n.textContent = Number(n.dataset.ago) ? ago(now - Number(n.dataset.ago)) : 'never';
  for (const n of document.querySelectorAll('[data-until]')) {
    const left = Number(n.dataset.until) - now;
    // a large timer says only the time, and the note beside it says "left"
    n.textContent = n.dataset.fmt === 'span' ? span(Math.max(0, left)) : left > 0 ? `${span(left)} left` : 'the wait is over';
  }
}

async function pollFiles() {
  const feed = await readScript('events.js', 'lemEvent', events.length);
  if (feed.records) { events = feed.records; lastGoodRead = Date.now(); delete problems.events; }
  else problems.events = feed.missing ? 'events.js is missing: no state was written yet' : feed.problem;
  const about = await readScript('meta.js', 'lemMeta', 0);
  if (about.records?.length) { meta = about.records.at(-1); delete problems.meta; }
  else problems.meta = about.problem ?? 'meta.js is missing or empty: open the board with board.py';
  render();
  setTimeout(pollFiles, FEED_EVERY_MS);
}

// The agent status of Lem's session and of each task's session, from agterm. A page opened outside
// agterm has no bridge: it shows the files and no session.
async function pollTree() {
  if (typeof agterm === 'undefined') return;
  try {
    const reply = await agterm.request('tree');
    sessions = (reply?.tree?.workspaces ?? []).flatMap(w => w.sessions ?? []);
    treeProblem = null;
  } catch (err) {
    // An old status beside a failed read would pass for a current one.
    sessions = null;
    treeProblem = `tree failed: ${err?.message ?? err}`;
  }
}

document.addEventListener('click', async ev => {
  const to = ev.target.closest('[data-jump]');
  if (to) {
    try { await agterm.request('session.select', {target: to.dataset.jump}); } catch (err) { treeProblem = `could not switch: ${err?.message ?? err}`; render(); }
    return;
  }
  const pick = (name, fn) => { const node = ev.target.closest(`[data-bl-${name}]`); if (node) fn(node.dataset[`bl${name[0].toUpperCase()}${name.slice(1)}`]); return Boolean(node); };
  if (ev.target.closest('[data-tab]')) return setTab(ev.target.closest('[data-tab]').dataset.tab);
  if (ev.target.closest('#bl-read')) return void readBacklog();
  if (pick('ask', askToStart)) return;
  if (pick('cancel', () => { bl.confirm = null; renderBacklog(); })) return;
  if (pick('start', slug => startTask(slug))) return;
  if (pick('toggle', slug => { bl.open.has(slug) ? bl.open.delete(slug) : bl.open.add(slug); bl.cursor = slug; bl.confirm = null; renderBacklog(); })) return;
  if (ev.target.closest('[data-fold]')) { bannersOpen = !bannersOpen; return void render(); }
  const task = ev.target.closest('[data-open]');
  if (task) {
    view = task.dataset.open || null;
    window.scrollTo(0, 0);
    render();
  }
});
window.addEventListener('resize', render);
$('tl-wrap').addEventListener('mousemove', showTip);
$('tl-wrap').addEventListener('mouseleave', () => showTip(null));
$('bl-q').addEventListener('input', ev => { bl.q = ev.target.value; bl.confirm = null; renderBacklog(); });
// Letters go by the physical key (code), so they work in every keyboard layout.
document.addEventListener('keydown', ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey || view) return;
  const q = $('bl-q');
  if (!(ev.target instanceof Element)) return;
  if (ev.target === q) {
    if (ev.key === 'Escape') { ev.preventDefault(); if (q.value) { q.value = ''; bl.q = ''; renderBacklog(); } else q.blur(); }
    else if (ev.key === 'Enter' || ev.key === 'ArrowDown') { ev.preventDefault(); q.blur(); moveCursor(1); }
    return;
  }
  if (ev.target.closest('input, select, textarea')) return;
  if (tab !== 'backlog') { if (ev.code === 'KeyB') { ev.preventDefault(); setTab('backlog'); } return; }
  const act = fn => { ev.preventDefault(); fn(); };
  if (bl.confirm && ev.key === 'Escape') return act(() => { bl.confirm = null; renderBacklog(); });
  // a focused button or link answers Enter and Space itself
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest('button, a')) return;
  // while the question is open, Enter belongs to its two buttons and does nothing anywhere else
  if (bl.confirm && ev.key === 'Enter') return void ev.preventDefault();
  if (ev.code === 'KeyT') act(() => setTab('tasks'));
  else if (ev.code === 'KeyR') act(readBacklog);
  else if (ev.key === '/' || ev.code === 'Slash') act(() => { q.focus(); q.select(); });
  else if (ev.code === 'KeyJ' || ev.key === 'ArrowDown') act(() => moveCursor(1));
  else if (ev.code === 'KeyK' || ev.key === 'ArrowUp') act(() => moveCursor(-1));
  else if (ev.key === 'Enter' && bl.cursor && !ev.target.closest('button, a')) act(() => { bl.open.has(bl.cursor) ? bl.open.delete(bl.cursor) : bl.open.add(bl.cursor); renderBacklog(); });
  else if (ev.code === 'KeyS' && bl.cursor) act(() => askToStart(bl.cursor));
});

await pollFiles();
await pollTree();
// once at the start, for the count on the tab; after that only when the tab opens or on its key
if (!view) await readBacklog();
render();
setInterval(pollTree, TREE_EVERY_MS);
setInterval(render, 1000);
</script>
