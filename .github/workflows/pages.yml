name: Pages

# Started by hand only (the Actions tab, or `gh workflow run Pages`), after the source of Pages is set
# to "GitHub Actions". One run makes the whole site in _site/: Zensical, at the version of uv.lock,
# builds the docs from docs/ into _site/docs/ (zensical.toml), and the landing page of landing/ goes to
# _site/ itself, with the docs' 404 page for every address that is not there and a page at each old
# address of a guide (/lem/NAME/, until 2026-11-27) that leads to /lem/docs/NAME/. The landing page takes its
# pictures from _site/docs/assets/, which the links of docs/assets/ fill. tests/unit/guides/built.py runs
# the lines of the step "Build the site" as written, in a copy of the checkout, and the cases read what
# they make.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's own Pages template. With the upload and the publish in one job, deploy-pages
# looked for the artifact under a second after the upload, found none, and failed three runs in a row on
# 2026-11-23 (actions/deploy-pages#451). Once build has ended, its artifact is listed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build the site
        run: |
          uv sync --locked --only-dev
          .venv/bin/zensical build --clean --strict
          cp landing/index.html landing/style.css _site/
          cp _site/docs/404.html _site/404.html
          .venv/bin/python -I landing/redirects.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v5
