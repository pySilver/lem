name: Pages

# Started by hand only (the Actions tab, or `gh workflow run Pages`), after the source of Pages is set
# to "GitHub Actions". It publishes site/ with the logo, its figure alone (the tab icon), each in its day
# and its night file, and the six board pictures of assets/, copied at the same paths, so the page names
# them as assets/... and site/ holds no picture of its own.
# tests/test-site.sh runs the step "Make the folder to publish" as it is written here.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's own Pages template. With the upload and the publish in one job, deploy-pages
# looked for the artifact under a second after the upload, found none, and failed three runs in a row on
# 2026-11-23 (actions/deploy-pages#451). Once build has ended, its artifact is listed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Make the folder to publish
        run: |
          mkdir -p _site/assets/screens
          cp site/* _site/
          cp assets/lem.svg assets/lem-night.svg assets/lem-mark.svg assets/lem-mark-night.svg _site/assets/
          cp assets/screens/board-light.png assets/screens/board-dark.png assets/screens/phone-light.png assets/screens/phone-dark.png \
             assets/screens/task-light.png assets/screens/task-dark.png _site/assets/screens/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v5
