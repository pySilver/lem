name: Pages

# Started by hand only (the Actions tab, or `gh workflow run Pages`), after the source of Pages is set
# to "GitHub Actions". Zensical, at the version of uv.lock, builds the site from docs/ into _site/
# (zensical.toml), and this publishes that folder. The pictures and Pele come into _site/ through the
# links of overrides/assets/, so the build alone makes the whole site. tests/unit/guides/ runs the
# same build in a copy of the checkout and reads what it makes.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, as in GitHub's own Pages template. With the upload and the publish in one job, deploy-pages
# looked for the artifact under a second after the upload, found none, and failed three runs in a row on
# 2026-11-23 (actions/deploy-pages#451). Once build has ended, its artifact is listed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build the site
        run: |
          uv sync --locked --only-dev
          .venv/bin/zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v5
