name: CI

# Started by hand only (the Actions tab, or `gh workflow run CI`): the levels run on the
# maintainer's Mac are the check for now.
on:
  workflow_dispatch:

jobs:
  test:
    # Lem's users are on macOS, where agterm runs; a project's gate may run on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # the Python Lem is written for, and uv, which installs Lem and its tools from uv.lock into .venv
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: The app and its tools
        run: uv sync --locked
      # ESLint and neostandard at the versions of package-lock.json, for the ESLint gate
      - name: The JavaScript's tools
        run: npm ci
      # Each level prints a line for each case and its total; it passes only when passed and
      # skipped add up to the cases it collected.
      - name: The gates
        run: .venv/bin/python -I -B tests --level gates
      - name: The unit level
        if: ${{ !cancelled() }}
        run: .venv/bin/python -I -B tests --level unit
