name: CI

# Started by hand only (the Actions tab, or `gh workflow run CI`): the local suites, `bash tests/all.sh`,
# are the check for now.
on:
  workflow_dispatch:

jobs:
  test:
    # Lem's users are on macOS, where agterm runs; a project's gate may run on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # the Python Lem is written for, and uv, which installs Lem and its tools from uv.lock into .venv
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Lem installed from the checkout into .venv, with its tools: every suite runs on its Python
      - name: The app
        run: uv sync --locked
      - name: What the suites need
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install shellcheck; else sudo apt-get update -q && sudo apt-get install -y -q shellcheck; fi
          .venv/bin/python --version
          shellcheck --version | sed -n 2p
          git --version
          uv --version
          node --version
          # the page checks load pages in headless Chrome; with none each of them prints a SKIP line
          chrome=""
          for c in google-chrome chromium chromium-browser "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"; do
            if command -v "$c" >/dev/null 2>&1 || [ -x "$c" ]; then chrome=$c; break; fi
          done
          if [ -n "$chrome" ]; then "$chrome" --version; else echo "::warning::no Chrome or Chromium: the page checks are skipped"; fi
      # Every suite at once, each within its time limit; a suite passes only when its results add up
      # to the checks it collected, and the logs of the suites that failed follow the summary.
      - name: The whole suite
        run: bash tests/all.sh
      # The journeys again, against the wheel of this checkout installed outside it, as a user's app
      # is: also when the whole suite failed, so that both results show.
      - name: The journeys on an installed app
        if: ${{ !cancelled() }}
        run: bash tests/all.sh --installed
