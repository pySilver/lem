<title id="c2-title">Lem</title>
<desc id="c2-desc">A tall hooded coat with nothing in its hood stands in a cut field and holds one long line in both hands. Strands hang from the line to four smaller hooded figures and to the word Lem, set in pixel letters with a block cursor.</desc>
