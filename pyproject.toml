# Lem's package and the maintainer's tools. hatchling builds the package: the modules of
# src/lem, and under lem/data the plugin's files that the app reads, at the names they have
# here. uv installs it into .venv as an editable install, with the tools, at the versions of
# uv.lock; ruff formats and lints, pyrefly checks the types.
#
#     uv sync                      the package and the tools into .venv; .venv/bin/lem is the command
#     uv build                     the sdist, and from it the wheel, into dist/
#     uv run ruff format           the one format
#     uv run ruff check --fix      the lint rules below
#     uv run pyrefly check         the types
#     bash tests/lint.sh           all of them, and the JavaScript's, as tests/all.sh runs them

[build-system]
# An exact version, so that a build of one commit is the same build on every machine.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "lem"
description = "Lem coordinates the agents that write code in one repository."
# The release number has one place, .claude-plugin/plugin.json (tests/unit/test_release.py),
# and the build reads it there ([tool.hatch.version]).
dynamic = ["version"]
# The Python Lem's code is written for. ruff takes its target version from this line.
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
lem = "lem.__main__:cli"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "pyrefly>=1.2.0",
    # the build backend's own types, for pyrefly's check of hatch_build.py: the version of
    # [build-system]
    "hatchling==1.33.0",
]

[tool.uv]
# Every input of the build, so that a sync builds again when one changes. uv's own keys are
# pyproject.toml and whether src is there; it never read the manifest, which holds the
# version, nor the files the wheel carries, and a second `uv sync --no-editable` kept the
# build before (2026-11-25: the manifest from 0.3.1 to 0.3.2, and the install said 0.3.1).
# These replace uv's own.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "checkout.pth" },
    { file = ".claude-plugin/plugin.json" },
    # what a formula writes before its build (`lem version`'s commit)
    { file = "src/lem/build-commit" },
    { file = "src/lem/**/*.py" },
    { file = "skills/**/*" },
    { file = "agents/**/*" },
    { file = "hooks/**/*" },
    { file = "assets/lem-mark.svg" },
    { file = "assets/lem-mark-night.svg" },
]

[tool.uv.extra-build-variables]
# hatchling imports hatch_build.py from the checkout, and the build writes no bytecode beside it.
lem = { PYTHONDONTWRITEBYTECODE = "1" }

# ==== hatchling ====
[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
# What a wheel is built from, and nothing else: the package, the plugin's files the app reads,
# the licenses and the build's hook.
only-include = [
    "src/lem",
    "skills",
    "agents",
    "hooks",
    ".claude-plugin/plugin.json",
    "assets/lem-mark.svg",
    "assets/lem-mark-night.svg",
    "LICENSE",
    "NOTICE",
    "hatch_build.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lem"]

# The plugin's files under lem/data, at the names they have here: paths.ROOT is that folder in
# an installed app. The sources stay where they are, one copy in git.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "lem/data/skills"
"agents" = "lem/data/agents"
"hooks" = "lem/data/hooks"
".claude-plugin/plugin.json" = "lem/data/.claude-plugin/plugin.json"
"assets/lem-mark.svg" = "lem/data/assets/lem-mark.svg"
"assets/lem-mark-night.svg" = "lem/data/assets/lem-mark-night.svg"

# hatch_build.py: an editable install takes no copy of the plugin's files, and runs with no
# bytecode written into the checkout.
[tool.hatch.build.targets.wheel.hooks.custom]

# ==== ruff ====
[tool.ruff]
# ruff's own format and its line length of 88, with no option of ours.
# ruff also formats the Python blocks of a Markdown file. The stage files, the plans and the guides
# keep their text as it was written.
extend-exclude = ["*.md"]

# Where an import finds Lem's package and the tests' own modules: each folder that the entry
# or a test puts on `sys.path`.
src = [
    "src",
    "tests/unit",
]

[tool.ruff.per-file-target-version]
# The file the plugin's hooks start under whatever `python3` a machine has, the system's 3.9
# on a Mac, and which finds the newer Python for the rest.
"src/lem/python.py" = "py39"

[tool.ruff.lint]
select = [
    "F", "E", "W", # pyflakes and pycodestyle
    "C90", # mccabe
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "YTT",
    "ANN", # every function says its types
    "ASYNC",
    "S", # bandit
    "BLE",
    "FBT", # no boolean passed by position
    "B", # bugbear
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EXE",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PIE",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TC",
    "INT",
    "PTH", # pathlib
    "PGH",
    "PL", # pylint
    "TRY",
    "FLY",
    "PERF",
    "FURB",
    "RUF",
]
# The size rules (C901 and PLR0911 to PLR0917) have ruff's own limits. A function that was over one
# when the rules came, on 2026-11-24, carries `# noqa: RULE - over the limit before the limit was
# set`. A new function gets no such mark; it is written under the limits, and a marked one
# loses its mark when it is split.
#
# Left out, each for a reason:
#   D     the docstrings keep their own voice (AGENTS.md), which is not pydocstyle's
#   PT    the tests are unittest's, so that they need only Python
#   T20   a script's output is what it prints
#   INP   Lem's one package is src/lem; the tests and the tools are files run by their path
#   EM    with TRY003 below: a refusal's message is written where it is raised
#   ARG, ERA, FA and the rules of libraries Lem does not use
ignore = [
    "COM812", # the formatter sets the trailing commas
    "TRY003", # a refusal says what is wrong and names the fix, in the `raise` that knows both
    "TRY004", # a refusal is one exception type whatever was wrong with the input
    "TRY301", # a refusal raised inside its own `try` is how a command stops with a message
    "PLC0415", # a module imports another on the path that needs it: to start fast, or because the two need each other
    "S603", # Lem's work is to run git, gh, agtermctl and a project's own checks,
    "S607", # each named in a list of arguments, found on PATH,
    "S606", # and a launcher becomes the script it starts (os.execv)
    "UP036", # python.py tells an old python3 what Lem needs, so those lines must stay
    "N818", # an exception is named for what happened (Refusal, NotFound)
]

# The typographic marks of a text for a person: the apostrophe, the en dash, the times sign, and
# the sign between the parts of a title as agterm shows it.
allowed-confusables = ["’", "–", "×", "›"]

[tool.ruff.lint.per-file-ignores]
# The file every hook starts under any python3 keeps to os.path and to what Python 3.9 has,
# and the entry to os.path, whose import costs less than pathlib's, before its look at the board
# server.
"src/lem/python.py" = ["PTH"]
"src/lem/__main__.py" = ["PTH"]
# lem ask shows a path as its caller wrote it, in a page's address and in each message (`./x.json`,
# a TMPDIR with `//`), and pathlib would rewrite that text.
"src/lem/ask.py" = ["PTH"]
"tests/**" = [
    "PLR2004", # a test compares with the value it expects
    "FBT003", # and passes it by position
    "PLR0913", # a helper that builds a record takes its fields
    "PLR0917",
    "RUF012", # a test class holds its fixtures as plain attributes
    "S108", # a path in /tmp is a text of a test, never a file
    "S604", # a suite runs the shell line it checks
    "E501", # a test's name is its sentence, and a fixture is a text as it is; ruff format still wraps the code
]
# A unit test puts src on sys.path before it imports lem, since the tests run with `python3 -I`,
# which reads no PYTHONPATH.
"tests/unit/*.py" = ["E402"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The owner's ruling "Python 3.11 stays, in the modern form", written for 3.14 from the release
# that brings Lem's own Python (docs/rulings/rulings.md).
"__future__.annotations".msg = "No script has `from __future__ import annotations`: Python 3.14 is the floor, and its own annotations are enough."

# ==== pyrefly ====
[tool.pyrefly]
# The Python Lem's code is written for: a name the standard library got later is an error here.
python-version = "3.14"
project-includes = ["**/*.py"]
# The same folders as ruff's `src`.
search-path = [
    "src",
    "tests/unit",
]
# `project-excludes` is the one list of what is left out. A task's worktree is under `.lem/` and an
# agent's under `.claude/`, both of which git ignores and both dot-folders: with the ignore files or
# the dot-folder heuristic, a check run inside a worktree reads no file and passes.
use-ignore-files = false
disable-project-excludes-heuristics = true
project-excludes = ["**/node_modules", "**/__pycache__", "**/.[!/.]*"]

[tool.pyrefly.errors]
# Both are off by default. On, a `# pyrefly: ignore` or `# type: ignore` that no longer hides an
# error is one itself, so no ignore outlives its reason.
unused-ignore = true
unused-type-ignore = true
