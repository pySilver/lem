{% macro head(title, assets, board=true) %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<meta name="turbo-refresh-method" content="morph">
<meta name="turbo-refresh-scroll" content="preserve">
<meta name="turbo-prefetch" content="false">
<link rel="icon" type="image/png" sizes="64x64" href="{{ assets }}/icons/icon-64.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="64x64" href="{{ assets }}/icons/icon-64-night.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="{{ assets }}/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="{{ assets }}/lem.css" data-turbo-track="reload">
<script src="{{ assets }}/lem.js" data-turbo-track="reload"></script>
<link rel="stylesheet" href="{{ assets }}/board.css" data-turbo-track="reload">
<link rel="stylesheet" href="{{ assets }}/push.css" data-turbo-track="reload">
{% if board %}<script src="{{ assets }}/vendor/board-app.js" defer data-turbo-track="reload"></script>{% endif %}
{% endmacro %}
