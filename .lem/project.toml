# What Lem reads in this repository. `project.py show` prints it resolved.

[paths]
# The folder of the plans, relative to the root of the checkout. Lem's own files are in .lem/, the
# rules for the code in .claude/rules, the review tool's folder is .revmux and the backlog is
# docs/backlog: each has that one place, and no line here.
plans = "docs/plans"
# The name of a plan's file in the plans folder: YYYY, MM and DD are the day the plan was
# written, <slug> is the task's. A plan named YYYYMMDD-<slug>.md is found too.
plan_file = "YYYY-MM-DD-<slug>.md"
# The folder of the owner's rulings, the decisions about the product that outlive a task, and the
# name of a ruling's file there, with the same tokens. Lem's own rulings are in AGENTS.md.
rulings = "docs/rulings"
ruling_file = "<slug>.md"

[branch]
# The branch a task starts from and lands on.
base = "main"
# Who lands a finished task: "owner", or "agent" once the checks are green.
land = "owner"
# What lands: "keep" lands the branch's own commits, "squash" lands one commit for the whole task.
history = "squash"
# How a task ends where the remote is GitHub: "pull-request" opens one there, "merge" lands the
# branch on the remote's base branch with none. With any other remote, or none, it is the merge.
propose = "pull-request"
# Branches nothing lands on and nothing is pushed to through this skill, whoever asks.
protected = []

[checks]
# The machine checks of a landing, each run at the root of the task's worktree.
# tests/all.sh runs every suite of the repository and ShellCheck at the same time; its last line
# says whether all passed, which is what the landing shows of each command.
commands = ["bash tests/all.sh"]
# What a fresh worktree of this project needs before its tests can start: install the packages,
# copy an environment file. The check that each criterion's tests fail on the base commit runs in a
# worktree of its own and runs these there first. Leave it empty when the tests start as they are.
setup = []
# Commands that need the machine to themselves: an end-to-end suite that uses fixed ports, one
# database or a browser. None here: tests/all.sh runs the Chrome suites beside the others.
alone = []

[flow]
# What must never go wrong in this project, each as one sentence in the owner's words. No code
# matches these and no list of paths stands in for them: Lem reads the ask against each, the lead
# its plan, and the agent that reviews the diff the change itself, and a change in reach of one
# takes the careful flow: its plan is talked through with the reviewer before any code, the
# landing gives it the project's full review set, and a person merges it. This table is read from
# the main checkout, so a branch cannot lift what guards it.
# The sentences from "The landing lets through" on are the maintaining session's, each for what
# some files guard: land.py, criteria.py, decisions.py, project.py, the correction hook with
# corrections.py and jev.py, the plugin's manifest, and the builder's agent file.
topics = [
  "A pull request says green when it should not: a check failed, a review found a must-fix, an acceptance criterion changed, or the bar went lower.",
  "Lem changes a developer's repository without his word: a push, a merge, a removed worktree or branch, a protected branch touched.",
  "A developer's typed messages leave the machine without his yes: the correction hook sends them to the Jev model through OpenRouter.",
  "Lem writes over something of the developer's: a file in his home or his repository that was there, his settings, his own command or skill of the same name.",
  "A task's record is lost or wrong: its state, its decisions and its approved criteria, which nothing rebuilds and the pull request reads.",
  "A change bends a ruling of the owner: a ruling in AGENTS.md is reopened only by asking him.",
  "The landing lets through a change that should not land: one the checks or the review did not pass, one a person should merge, or one aimed at a protected branch.",
  "A criterion's test is taken as its proof when it is not: it passes on the base commit too, or it holds another criterion than its own.",
  "A decision that is the owner's is taken without him, or one taken for him is missing from the pull request he reads.",
  "Lem reads a project's settings wrong: what must never go wrong, the checks or who lands taken from a file the branch changed, or a default nobody chose taken for the owner's word.",
  "The correction hook breaks the developer's session: it fails, hangs or slows every message he types.",
  "Lem as a plugin does not load in a developer's Claude Code, or brings a hook or a command he did not install.",
  "A builder or a lead works outside its brief: it edits the main checkout, another task's worktree or a branch it does not own, or it pushes.",
]
# How many tasks build or land at one time. Four to five ran well on one Mac; six gave a load
# average of 12 to 16 and unstable browser tests (convertiser-server, 2026-11-14). Lower it when
# the tests share one database or drive a browser.
# Lem's own repository (2026-11-16 onboarding): its tests drive headless Chrome, and most tasks here
# change the same stage files.
max_tasks = 2

[seats]
# Who sits where, each as "agent/model:effort". Leave out the effort ("codex/gpt-6.1-sol"), or
# the model and the effort ("codex"), and that agent's own default holds.
# The reviewer: "claude" or "codex". Lem's builders build; this one talks the plan of a careful
# or large task through with its defender, in the plan talk's companion. The same family twice is
# allowed.
reviewer = "codex"
# The defender of a careful or large plan in its talk with the reviewer, in a companion session
# Lem opens for the talk and closes after it. Only "claude" for now.
# planner = "claude/opus:high"
# The two experts who answer a choice that waits for the owner, at the same moment and read-only:
# two model families, so that their agreement is worth more than two of one.
# experts = ["claude/fable", "codex/gpt-6-astra:high"]

[corrections]
# Keep a queue of the owner's corrections for the retro. The hook that fills it sends each
# message the owner types, with the agent message it answers, to the Jev decision model. That
# is the owner's choice, so it is false until he says yes. `true` here, in git, is a yes for
# everybody who works in this repository: the hook comes with Lem's plugin. One person says
# no for themselves with `collect = false` under [corrections] in .lem/project.local.toml.
collect = true

# The tracker a task's ask may come from. Leave it out when the project has none. Lem reads a
# ticket into a task, moves it when its work starts and lands, and comments the landing. The
# team is in the ticket's id (ABC-12). Only `kind` is needed: `server` and `moves` show their
# defaults, and a status is named only when the team has two statuses of its type.
# [tracker]
# kind = "linear"
# server = "linear"        # the name of the tracker's MCP server in the agent
# moves = "lem"            # or "tracker", when the tracker's own automation moves the tickets
# started = "In Progress"  # only when the team has two statuses of the type "started"
# landed = "Done"          # only when the team has two statuses of the type "completed"

[naps]
# Now and then, when a task has ended or Lem waits for the owner, Lem takes a nap: a fresh agent
# reads the recent tasks, dreams, and writes the dream down in .lem/state/naps/, which the retro
# reads. Off here.
on = false
